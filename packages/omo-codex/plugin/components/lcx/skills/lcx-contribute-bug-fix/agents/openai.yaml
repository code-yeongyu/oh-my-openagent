interface:
  display_name: "lcx-contribute-bug-fix (omo)"
  short_description: "Contribute verified LazyCodex or Codex bug fixes"
  search_terms:
    - "lcx-contribute-bug-fix"
    - "contribute a bug fix"
    - "contribute to fix bug"
    - "fix bug pr"
    - "lazycodex fix"
    - "omo-codex bug fix"
    - "codex bug fix pr"
  default_prompt: "Use $lcx-contribute-bug-fix to debug this LazyCodex or Codex bug, search my open PRs for an existing lead PR first, work from a fresh ${TMPDIR:-/tmp} clone and worktree, implement the smallest verified fix, apply the lazycodex-generated label, deliver it as a fork PR (code-yeongyu/oh-my-openagent base dev for LazyCodex defects, openai/codex for upstream; never a PR on the code-yeongyu/lazycodex mirror), and clean up."
