main = ".open-next/worker.js"
name = "oh-my-openagent-web"
# The Sisyphus Labs account (moved 2026-10-09, sisyphuslabs/common-infra docs/cutover-workers.md). The omo.dev
# zone is Active there; routes are named by zone_id so a deploy can never attach them to another account's zone.
account_id = "6511ce566bfe27228f536a8fb9448be5"
compatibility_date = "2026-05-18"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = false
routes = [
  { pattern = "omo.dev/*", zone_id = "659a56dc53ddc7f388cd59888ccedaf0" },
  { pattern = "www.omo.dev/*", zone_id = "659a56dc53ddc7f388cd59888ccedaf0" },
]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"
