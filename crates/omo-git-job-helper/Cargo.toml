[package]
name = "omo-git-job-helper"
version.workspace = true
edition.workspace = true
license.workspace = true

# The memory-core git floor-job helper (omo#10391, design v4.2 sections 3 and 6): `run`, `probe` and `selftest`.
# Windows only; on every other OS the binary exits 2. The testkit images under examples/ are test-only and never
# shipped: the native contract rows (tests/) spawn them as job members, children and token launchers.
[[bin]]
name = "omo-git-job-helper"
path = "src/main.rs"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { workspace = true, features = [
    "Wdk_Foundation",
    "Wdk_System_Threading",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Performance",
    "Win32_System_Pipes",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
] }

# The contract rows' debugger harness (tests/support/debugger.rs) stops the helper at a kernel32 export.
[target.'cfg(target_os = "windows")'.dev-dependencies]
windows-sys = { workspace = true, features = [
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
] }
