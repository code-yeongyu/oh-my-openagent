[package]
name = "senpi-desktop-backend-atspi"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["rlib"]

[target.'cfg(target_os = "linux")'.dependencies]
atspi.workspace = true
senpi-desktop-core = { path = "../senpi-desktop-core" }
tokio = { workspace = true, features = ["time"] }
# atspi 0.30.0 (latest; upstream main still on zbus ^5.5) builds its proxies on zbus 5, and this
# crate hands zbus::Connection/Proxy values to atspi, so it stays on zbus 5 while the workspace
# (ashpd 0.14) is on zbus 6.
zbus = { version = "=5.19.0", default-features = false, features = ["async-io", "blocking-api"] }
