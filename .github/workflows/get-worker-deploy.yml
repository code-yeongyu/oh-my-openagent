name: get.omo.dev deploy

on:
  push:
    branches: [dev]
    paths:
      - "packages/get-worker/**"
      - ".github/workflows/get-worker-deploy.yml"
  workflow_dispatch:

concurrency:
  group: get-worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'code-yeongyu/oh-my-openagent'
    runs-on: ubuntu-latest
    environment:
      name: web-production
      url: https://get.omo.dev
    defaults:
      run:
        working-directory: packages/get-worker
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_GET_DEPLOY_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: packages/get-worker
          command: d1 migrations apply omo-get --remote
      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_GET_DEPLOY_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: packages/get-worker
          command: deploy
      - name: Smoke the live endpoints
        run: |
          set -euo pipefail
          curl -fsS https://get.omo.dev/healthz
          curl -fsSI https://get.omo.dev/install.sh | grep -i '^cache-control: public, max-age=300'
          curl -fsS https://get.omo.dev/channels/latest
      - name: Write job summary
        if: always()
        shell: bash
        working-directory: .
        env:
          JOB_SUMMARY_TITLE: get.omo.dev deploy
          JOB_SUMMARY_STATUS: ${{ job.status }}
          JOB_SUMMARY_DETAILS: |
            - Applies D1 migrations and deploys the omo-get Worker.
            - Smoke-checks healthz, install.sh caching and the latest channel.
          JOB_SUMMARY_NEXT: Check wrangler authentication and D1 migration output first.
        run: GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" bash .github/scripts/write-job-summary.sh
