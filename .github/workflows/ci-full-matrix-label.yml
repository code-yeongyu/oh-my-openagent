name: CI Full Matrix Label

on:
  pull_request:
    branches: [dev, master]
    types: [labeled]

# Reusable workflows cannot elevate the caller's token permissions.
# ci.yml's PR guard and push-only jobs declare these write permissions.
permissions:
  contents: write
  pull-requests: write

jobs:
  full-matrix:
    if: github.event.label.name == 'ci:full-matrix'
    # Only matching labels enter this group; bot labels cannot cancel it.
    concurrency:
      group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number }}-full-matrix
      cancel-in-progress: true
    uses: ./.github/workflows/ci.yml
