name: Computer live Linux

# The per-pull-request Linux live tier of the computer-use engine: real Xorg with uinput on the runner itself, and
# GNOME, KDE and sway sessions in their containers. Every job ends with teardown receipts; a job whose session or
# driver is missing fails and names what is missing, it never passes on a smaller set.
on:
  pull_request:
    paths:
      - ".github/workflows/computer-live-linux.yml"
      - "crates/omo-computer-backend-x11/**"
      - "crates/omo-computer-backend-atspi/**"
      - "crates/omo-computer-backend-wayland/**"
      - "script/qa/computer/linux.ts"
      - "script/qa/computer/linux/**"
      - "script/qa/computer/pool/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  xorg-uinput:
    name: computer live (xorg-uinput)
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Install Xorg, the dummy video driver and libinput
        run: |
          sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get install -y --no-install-recommends \
            xserver-xorg-core xserver-xorg-video-dummy xserver-xorg-input-libinput xinput x11-utils xdotool acl

      - name: Probe the runner (Xorg dummy, libinput, writable uinput, XI2 raw events)
        shell: bash
        run: |
          set -euo pipefail
          qa="${RUNNER_TEMP}/computer-live-linux"
          mkdir -p "$qa"
          bun script/qa/computer/pool/xorg-uinput-probe.ts --runs 3 --ledger "$qa/xorg-uinput-ledger.tsv" \
            --workdir "$RUNNER_TEMP" | tee "$qa/xorg-uinput-probe.log"

      - name: Live scenarios on the xorg session
        shell: bash
        run: |
          set -euo pipefail
          qa="${RUNNER_TEMP}/computer-live-linux"
          if test ! -f script/qa/computer/linux.ts; then
            echo "::error::the Linux live driver script/qa/computer/linux.ts is not on this head"
            exit 1
          fi
          bun script/qa/computer/linux.ts --session xorg --all --json | tee "$qa/xorg.jsonl"

      - name: Teardown receipts
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          left=0
          if pgrep -x Xorg >/dev/null; then echo "Xorg LEFT $(pgrep -x Xorg | tr '\n' ' ')"; left=1; else echo "Xorg procs 0"; fi
          if grep -q 'omo-qa-' /proc/bus/input/devices; then echo "uinput devices LEFT"; left=1; else echo "uinput devices REMOVED"; fi
          sockets=$(find /tmp/.X11-unix -maxdepth 1 -name 'X*' 2>/dev/null | wc -l)
          echo "X sockets left ${sockets}"
          exit "$left"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: computer-live-linux-xorg-uinput
          path: ${{ runner.temp }}/computer-live-linux
          if-no-files-found: warn

  compositor:
    name: computer live (${{ matrix.session }})
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        session: [gnome, kde, sway]
    env:
      CONTAINERS: crates/omo-computer-backend-wayland/probes/containers
      IMAGE: omo-computer-live-${{ matrix.session }}:${{ github.sha }}
      NAME: omo-computer-live-${{ matrix.session }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Require the session container and the driver
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          if test ! -f "$CONTAINERS/${{ matrix.session }}/Dockerfile"; then
            echo "::error::the ${{ matrix.session }} session container $CONTAINERS/${{ matrix.session }}/Dockerfile is not on this head"
            missing=1
          fi
          if test ! -f script/qa/computer/linux.ts; then
            echo "::error::the Linux live driver script/qa/computer/linux.ts is not on this head"
            missing=1
          fi
          exit "$missing"

      - name: Build the session image
        run: docker build -q -t "$IMAGE" -f "$CONTAINERS/${{ matrix.session }}/Dockerfile" "$CONTAINERS"

      - name: Live scenarios in a nested headless session
        shell: bash
        run: |
          set -euo pipefail
          qa="${RUNNER_TEMP}/computer-live-linux"
          mkdir -p "$qa"
          docker run --rm --init --name "$NAME" --shm-size 1g \
            -v "$GITHUB_WORKSPACE:/repo:ro" -v "$(command -v bun):/usr/local/bin/bun:ro" -w /repo \
            "$IMAGE" bun script/qa/computer/linux.ts --session "${{ matrix.session }}" --all --json \
            | tee "$qa/${{ matrix.session }}.jsonl"

      - name: Teardown receipts
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          docker rm -f "$NAME" >/dev/null 2>&1 || true
          left=$(docker ps -a -q --filter "name=^${NAME}$" | wc -l)
          if test "$left" -eq 0; then echo "container REMOVED $NAME"; else echo "container LEFT $NAME"; fi
          docker image rm -f "$IMAGE" >/dev/null 2>&1 || true
          if docker image inspect "$IMAGE" >/dev/null 2>&1; then echo "image LEFT $IMAGE"; left=1; else echo "image REMOVED $IMAGE"; fi
          exit "$left"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: computer-live-linux-${{ matrix.session }}
          path: ${{ runner.temp }}/computer-live-linux
          if-no-files-found: warn
