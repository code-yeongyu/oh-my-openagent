name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]
    # `labeled` lets the ci:full-matrix label retrigger CI; concurrency cancel-in-progress absorbs bot-label churn.
    types: [opened, synchronize, reopened, labeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci-mode:
    runs-on: ubuntu-latest
    outputs:
      generated_release_push: ${{ steps.classify.outputs.generated_release_push }}
      web_only: ${{ steps.classify.outputs.web_only }}
      run_heavy: ${{ steps.classify.outputs.run_heavy }}
      full_matrix: ${{ steps.classify.outputs.full_matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify CI mode
        id: classify
        shell: bash
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message || '' }}
          HEAD_REF: ${{ github.head_ref || '' }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) || '[]' }}
        run: |
          set -euo pipefail

          PATHS_FILE="$RUNNER_TEMP/ci-changed-paths"
          DIFF_AVAILABLE=true
          if [ -z "$BASE_SHA" ] ||
             [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ] ||
             ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null ||
             ! git diff --name-only -z "$BASE_SHA" "$GITHUB_SHA" > "$PATHS_FILE"; then
            DIFF_AVAILABLE=false
            : > "$PATHS_FILE"
          fi

          MERGE_PARENTS="$(git show -s --format=%P "$GITHUB_SHA" | wc -w)"

          MODE_JSON="$(node script/ci-fast-path.mjs \
            --event "$GITHUB_EVENT_NAME" \
            --message "$HEAD_COMMIT_MESSAGE" \
            --diff-available "$DIFF_AVAILABLE" \
            --merge-parents "$MERGE_PARENTS" \
            --head-ref "$HEAD_REF" \
            --labels "${PR_LABELS:-[]}" \
            < "$PATHS_FILE")"

          jq -r '"generated_release_push=\(.generatedReleasePush)"' <<< "$MODE_JSON" >> "$GITHUB_OUTPUT"
          jq -r '"web_only=\(.webOnly)"' <<< "$MODE_JSON" >> "$GITHUB_OUTPUT"
          jq -r '"run_heavy=\(.runHeavy)"' <<< "$MODE_JSON" >> "$GITHUB_OUTPUT"
          jq -r '"full_matrix=\(.fullMatrix)"' <<< "$MODE_JSON" >> "$GITHUB_OUTPUT"
          jq . <<< "$MODE_JSON"

      - name: Write job summary
        if: always()
        shell: bash
        env:
          JOB_SUMMARY_TITLE: CI execution mode
          JOB_SUMMARY_STATUS: ${{ job.status }}
          JOB_SUMMARY_DETAILS: |
            - Generated release push: `${{ steps.classify.outputs.generated_release_push || 'unknown' }}`.
            - Web-only change: `${{ steps.classify.outputs.web_only || 'unknown' }}`.
            - Run heavy validation: `${{ steps.classify.outputs.run_heavy || 'unknown' }}`.
            - Full 3-OS matrix: `${{ steps.classify.outputs.full_matrix || 'unknown' }}` (false keeps heavy work on ubuntu; add the `ci:full-matrix` label to force it).
          JOB_SUMMARY_NEXT: Classification failures default to heavy validation on the full matrix; inspect the changed-path diff and event metadata.
        run: GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" bash .github/scripts/write-job-summary.sh

  # Block PRs targeting master branch (comment + auto-close, then fail the check)
  block-master-pr:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: write
    steps:
      - name: Check PR target branch
        env:
          BASE_REF: ${{ github.base_ref }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          if [ "$BASE_REF" != "master" ]; then
            echo "PR targets '${BASE_REF}' branch - OK"
            exit 0
          fi

          echo "::error::PRs to master branch are not allowed. Please target the 'dev' branch instead."

          gh pr comment "$PR_URL" --body "$(cat <<EOF
          Hi @${PR_AUTHOR}, thanks for the contribution!

          This repository does not accept pull requests that target the \`master\` branch, so this PR is being closed automatically.

          **What to do instead:**
          1. Re-target (or recreate) this PR against the \`dev\` branch.
          2. All changes land on \`dev\` first; \`master\` is updated only by the release workflow.

          No worries, nothing is lost. Just open a new PR against \`dev\` and we'll take it from there. Thanks again!
          EOF
          )"

          gh pr close "$PR_URL"

          echo "PR was auto-closed because it targeted 'master'."
          exit 1

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## PR target guard"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Result | \`${{ job.status }}\` |"
            echo "| Workflow | \`${{ github.workflow }}\` |"
            echo "| Event | \`${{ github.event_name }}\` |"
            echo "| Base branch | \`${{ github.base_ref || 'n/a' }}\` |"
            echo
            echo "### What this job checks"
            echo
            echo "- Blocks pull requests that target \`master\`."
            echo "- Leaves non-master pull requests alone."
            echo
            echo "### If this fails"
            echo
            echo "Retarget the pull request to \`dev\`; release automation owns \`master\`."
          } >> "$GITHUB_STEP_SUMMARY"

  test:
    needs: [ci-mode]
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 60 || 30 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            shard: "1/2"
          - os: ubuntu-latest
            shard: "2/2"
          - os: macos-latest
            shard: "1/2"
          - os: macos-latest
            shard: "2/2"
          - os: windows-latest
            shard: "1/2"
          - os: windows-latest
            shard: "2/2"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        if: needs.ci-mode.outputs.run_heavy == 'true' && (matrix.os == 'ubuntu-latest' || needs.ci-mode.outputs.full_matrix == 'true')
        with:
          node-version: "24"

      - uses: oven-sh/setup-bun@v2
        if: needs.ci-mode.outputs.run_heavy == 'true' && (matrix.os == 'ubuntu-latest' || needs.ci-mode.outputs.full_matrix == 'true')
        with:
          # and 1.3.12 hangs on windows-latest in the ast-grep install-script
          # timeout race.
          bun-version: "1.4.0"


      - uses: actions/cache@v6
        if: runner.os != 'Windows' && needs.ci-mode.outputs.run_heavy == 'true' && (matrix.os == 'ubuntu-latest' || needs.ci-mode.outputs.full_matrix == 'true')
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.4.0-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        if: needs.ci-mode.outputs.run_heavy == 'true' && (matrix.os == 'ubuntu-latest' || needs.ci-mode.outputs.full_matrix == 'true')
        run: bun install --frozen-lockfile

      - name: Remove stale self-package test copies
        if: needs.ci-mode.outputs.run_heavy == 'true' && (matrix.os == 'ubuntu-latest' || needs.ci-mode.outputs.full_matrix == 'true')
        run: bun run script/remove-stale-self-package-tests.ts

      # The full install runs the root `prepare` (`bun run build`), whose
      # `build:lsp-daemon` step already runs `npm ci && npm run build` in
      # packages/lsp-daemon, so its node_modules and dist exist before the tests.
      - name: Run vendored lsp-daemon tests
        if: needs.ci-mode.outputs.run_heavy == 'true' && (matrix.os == 'ubuntu-latest' || needs.ci-mode.outputs.full_matrix == 'true')
        run: npm test
        working-directory: packages/lsp-daemon

      # Every OS splits the root suite into two parallel jobs (the Windows
      # shape): shard 1 runs omo-opencode + memory-core in one serial process,
      # shard 2 runs the shared serial quarantine first and then the remainder.
      # `bun test --parallel` is not used on POSIX: --isolate re-runs the heavy
      # preload per file and OOM-kills the 7 GB runners, and --no-isolate leaks
      # module state between files. Job-level sharding is the parallelism.
      - name: Run tests
        if: needs.ci-mode.outputs.run_heavy == 'true' && matrix.shard == '1/2' && (matrix.os == 'ubuntu-latest' || needs.ci-mode.outputs.full_matrix == 'true')
        run: bun test packages/omo-opencode packages/memory-core

      - name: Run tests
        if: needs.ci-mode.outputs.run_heavy == 'true' && runner.os != 'Windows' && matrix.shard == '2/2' && (matrix.os == 'ubuntu-latest' || needs.ci-mode.outputs.full_matrix == 'true')
        run: |
          bun test packages/senpi-task/src/runners/rpc-process.windows.test.ts packages/utils/src/codegraph-provision-upgrade.test.ts packages/senpi-task/src/__adversarial__/chaos-bench.test.ts packages/omo-codex/src/install/install-codex-legacy-agent-purge.test.ts script/codex-installer-version.test.ts packages/shared-skills/provenance-gate.test.ts packages/omo-codex/src/install/install-codex-mcp-manifest.test.ts packages/senpi-task/src/dag/scheduler.test.ts packages/omo-native/test/payload.test.ts script/build-omo-binary.test.ts
          bun --config=bunfig.win2.parallel.toml test

      # Git Bash sets SHELL/MSYSTEM on Windows, which makes process-platform
      # tests observe sh instead of the native PowerShell/cmd execution path.
      - name: Run tests
        if: needs.ci-mode.outputs.run_heavy == 'true' && runner.os == 'Windows' && matrix.shard == '2/2' && (matrix.os == 'ubuntu-latest' || needs.ci-mode.outputs.full_matrix == 'true')
        shell: pwsh
        run: |
          bun test packages/senpi-task/src/runners/rpc-process.windows.test.ts packages/utils/src/codegraph-provision-upgrade.test.ts packages/senpi-task/src/__adversarial__/chaos-bench.test.ts packages/omo-codex/src/install/install-codex-legacy-agent-purge.test.ts script/codex-installer-version.test.ts packages/shared-skills/provenance-gate.test.ts packages/omo-codex/src/install/install-codex-mcp-manifest.test.ts packages/senpi-task/src/dag/scheduler.test.ts packages/omo-native/test/payload.test.ts script/build-omo-binary.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun --config=bunfig.win2.parallel.toml test --parallel

      - name: Write job summary
        if: always()
        shell: bash
        env:
          JOB_SUMMARY_TITLE: Root test suite (${{ matrix.os }}${{ matrix.shard && format(', shard {0}', matrix.shard) || '' }})
          JOB_SUMMARY_STATUS: ${{ job.status }}
          JOB_SUMMARY_DETAILS: |
            - Builds vendored LSP packages before tests.
            - Runs `npm test` for `packages/lsp-daemon`.
            - Runs all non-Senpi root tests sharded two ways per OS: shard 1 covers omo-opencode + memory-core, shard 2 runs the shared serial quarantine first and then the remainder (serial on POSIX, `--parallel` on Windows).
            - Splits every OS by the same package groups so global zauc mock bootstraps stay with their consumers.
          JOB_SUMMARY_NEXT: Open the first failing test or package-build step; matrix failures are usually OS-specific.
        run: GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" bash .github/scripts/write-job-summary.sh

  typecheck:
    needs: [ci-mode]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        if: needs.ci-mode.outputs.run_heavy == 'true'
        with:
          node-version: "24"

      - uses: oven-sh/setup-bun@v2
        if: needs.ci-mode.outputs.run_heavy == 'true'
        with:
          bun-version: "1.4.0"

      - uses: actions/cache@v6
        if: needs.ci-mode.outputs.run_heavy == 'true'
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.4.0-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        if: needs.ci-mode.outputs.run_heavy == 'true'
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Type check
        if: needs.ci-mode.outputs.run_heavy == 'true'
        run: bun run typecheck

      - name: Write job summary
        if: always()
        shell: bash
        env:
          JOB_SUMMARY_TITLE: TypeScript checks (ubuntu-latest)
          JOB_SUMMARY_STATUS: ${{ job.status }}
          JOB_SUMMARY_DETAILS: |
            - Builds vendored LSP packages required by the workspace.
            - Runs root `bun run typecheck`, including script and package checks.
          JOB_SUMMARY_NEXT: Start with the first TypeScript diagnostic; shared package failures can cascade into adapters.
        run: GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" bash .github/scripts/write-job-summary.sh

  codex-compatibility:
    needs: [ci-mode]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            suite: full
          - os: macos-latest
            suite: platform
          - os: windows-latest
            suite: platform
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        if: needs.ci-mode.outputs.run_heavy == 'true' && (matrix.os == 'ubuntu-latest' || needs.ci-mode.outputs.full_matrix == 'true')
        with:
          node-version: "24"

      - uses: oven-sh/setup-bun@v2
        if: needs.ci-mode.outputs.run_heavy == 'true' && (matrix.os == 'ubuntu-latest' || needs.ci-mode.outputs.full_matrix == 'true')
        with:
          bun-version: "1.4.0"

      - uses: actions/cache@v6
        if: needs.ci-mode.outputs.run_heavy == 'true' && (matrix.os == 'ubuntu-latest' || needs.ci-mode.outputs.full_matrix == 'true')
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.4.0-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        if: needs.ci-mode.outputs.run_heavy == 'true' && (matrix.os == 'ubuntu-latest' || needs.ci-mode.outputs.full_matrix == 'true')
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Run full Codex compatibility suite
        if: needs.ci-mode.outputs.run_heavy == 'true' && matrix.suite == 'full' && (matrix.os == 'ubuntu-latest' || needs.ci-mode.outputs.full_matrix == 'true')
        run: bun run test:codex


      - name: Run omo-codex component checks
        if: needs.ci-mode.outputs.run_heavy == 'true' && matrix.suite == 'full' && (matrix.os == 'ubuntu-latest' || needs.ci-mode.outputs.full_matrix == 'true')
        shell: bash
        run: |
          set -uo pipefail
          status=0
          for component in packages/omo-codex/plugin/components/*/; do
            if jq -e '.scripts.check' "${component}package.json" > /dev/null 2>&1; then
              echo "::group::Component check: ${component}"
              npm --prefix "$component" run check || status=1
              echo "::endgroup::"
            fi
          done
          exit $status
      - name: Build Codex platform smoke prerequisites
        if: needs.ci-mode.outputs.run_heavy == 'true' && matrix.suite == 'platform' && (matrix.os == 'ubuntu-latest' || needs.ci-mode.outputs.full_matrix == 'true')
        run: |
          bun run build:codex-install
          bun run build:git-bash-mcp
          bun run build:lsp-tools-mcp
          bun run build:lsp-daemon
          npm --prefix packages/omo-codex/plugin ci
          bun run --cwd packages/omo-codex/plugin build

      - name: Run Codex platform smoke tests (.mjs via node --test)
        if: needs.ci-mode.outputs.run_heavy == 'true' && matrix.suite == 'platform' && (matrix.os == 'ubuntu-latest' || needs.ci-mode.outputs.full_matrix == 'true')
        run: >-
          node --test
          packages/omo-codex/scripts/install-local.test.mjs
          packages/omo-codex/scripts/install-local-entrypoint.test.mjs
          packages/omo-codex/scripts/install-local-git-bash-preflight.test.mjs
          packages/omo-codex/scripts/install-cli-args.test.mjs
          packages/omo-codex/plugin/test/node-install-surface.test.mjs
          packages/omo-codex/plugin/test/install-time-build-runtime.test.mjs

      - name: Run Codex platform smoke tests (.ts via bun test)
        if: needs.ci-mode.outputs.run_heavy == 'true' && matrix.suite == 'platform' && (matrix.os == 'ubuntu-latest' || needs.ci-mode.outputs.full_matrix == 'true')
        run: bun test packages/omo-opencode/src/cli/cli-installer.platform.test.ts

      - name: Write job summary
        if: always()
        shell: bash
        env:
          JOB_SUMMARY_TITLE: Codex compatibility (${{ matrix.os }}, ${{ matrix.suite }})
          JOB_SUMMARY_STATUS: ${{ job.status }}
          JOB_SUMMARY_DETAILS: |
            - Builds the MCP runtimes needed by the Codex adapter.
            - Runs the full hermetic Codex gate plus every omo-codex component check script on Linux, and platform-specific installer/path/shell smoke tests on macOS and Windows.
            - Preserves Linux, macOS, and Windows platform compatibility coverage without duplicating platform-neutral tests.
          JOB_SUMMARY_NEXT: Inspect the failing component build or the first Codex compatibility test failure for this OS.
        run: GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" bash .github/scripts/write-job-summary.sh

  senpi-compatibility:
    needs: [ci-mode]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        if: needs.ci-mode.outputs.run_heavy == 'true' && (matrix.os == 'ubuntu-latest' || needs.ci-mode.outputs.full_matrix == 'true')
        with:
          node-version: "24"

      - uses: oven-sh/setup-bun@v2
        if: needs.ci-mode.outputs.run_heavy == 'true' && (matrix.os == 'ubuntu-latest' || needs.ci-mode.outputs.full_matrix == 'true')
        with:
          bun-version: "1.4.0"

      - uses: actions/cache@v6
        if: needs.ci-mode.outputs.run_heavy == 'true' && (matrix.os == 'ubuntu-latest' || needs.ci-mode.outputs.full_matrix == 'true')
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.4.0-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        if: needs.ci-mode.outputs.run_heavy == 'true' && (matrix.os == 'ubuntu-latest' || needs.ci-mode.outputs.full_matrix == 'true')
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Remove stale self-package test copies
        if: needs.ci-mode.outputs.run_heavy == 'true' && (matrix.os == 'ubuntu-latest' || needs.ci-mode.outputs.full_matrix == 'true')
        run: bun run script/remove-stale-self-package-tests.ts

      # Linux only: digestBuildSources hashes repo-relative paths (build-extension.mjs:140,143),
      # which are backslash-separated on Windows, so the source digest is platform-dependent and
      # a committed artifact can never match on every OS. One platform is enough to catch drift.
      - name: Verify committed Senpi plugin bundle is current
        if: needs.ci-mode.outputs.run_heavy == 'true' && matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          node packages/omo-senpi/plugin/scripts/build-extension.mjs --check

      - name: Run Senpi compatibility tests
        if: needs.ci-mode.outputs.run_heavy == 'true' && (matrix.os == 'ubuntu-latest' || needs.ci-mode.outputs.full_matrix == 'true')
        shell: bash
        run: |
          set -euo pipefail
          bun run build:senpi-plugin
          PACK_DIR="$RUNNER_TEMP/omo-senpi-pack"
          mkdir -p "$PACK_DIR"
          npm pack --pack-destination "$PACK_DIR" packages/omo-senpi/plugin
          npm --prefix packages/lsp-daemon test -- test/daemon-roundtrip.test.ts
          bunx tsgo --noEmit -p packages/omo-senpi/tsconfig.json
          bun test ./.agents/skills/senpi-qa/scripts/resolve-evidence-dir.test.mjs
          bun test packages/omo-senpi

      - name: Write job summary
        if: always()
        shell: bash
        env:
          JOB_SUMMARY_TITLE: Senpi compatibility (${{ matrix.os }})
          JOB_SUMMARY_STATUS: ${{ job.status }}
          JOB_SUMMARY_DETAILS: |
            - Builds the local-path Senpi adapter package artifacts.
            - Builds the shared LSP daemon once before staging Senpi artifacts.
            - Packs the generated Pi package and runs hermetic Senpi and QA-contract tests.
            - Covers Linux/macOS socket and Windows named-pipe daemon smoke.
          JOB_SUMMARY_NEXT: Inspect the first omo-senpi build, sync, directive, or package test failure for this OS.
        run: GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" bash .github/scripts/write-job-summary.sh

  lazycodex-published-smoke:
    needs: [ci-mode]
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/setup-node@v7
        if: needs.ci-mode.outputs.run_heavy == 'true'
        with:
          node-version: "24"

      - uses: oven-sh/setup-bun@v2
        if: needs.ci-mode.outputs.run_heavy == 'true'
        with:
          bun-version: "1.4.0"

      - name: Run published lazycodex-ai smoke commands
        if: needs.ci-mode.outputs.run_heavy == 'true'
        env:
          HOME: ${{ runner.temp }}/lazycodex-published-smoke/home
          CODEX_HOME: ${{ runner.temp }}/lazycodex-published-smoke/codex
          CODEX_LOCAL_BIN_DIR: ${{ runner.temp }}/lazycodex-published-smoke/bin
        run: |
          set -euo pipefail
          SMOKE_DIR=$(mktemp -d)
          trap 'rm -rf "$SMOKE_DIR"' EXIT
          mkdir -p "$HOME" "$CODEX_HOME" "$CODEX_LOCAL_BIN_DIR" "$SMOKE_DIR/cwd"
          cd "$SMOKE_DIR/cwd"

          npx_install_output=$(npx -y lazycodex-ai@latest --dry-run install --no-tui --codex-autonomous)
          echo "$npx_install_output"
          if [ "$npx_install_output" != "npx --yes oh-my-openagent@latest install --platform=codex --no-tui --codex-autonomous" ]; then
            echo "::warning::lazycodex-ai install dry-run output changed: $npx_install_output"
          fi

          npx_doctor_output=$(npx -y lazycodex-ai@latest --dry-run doctor)
          echo "$npx_doctor_output"
          if [[ "$npx_doctor_output" != codex\ exec\ * ]] ||
             [[ "$npx_doctor_output" != *"--sandbox danger-full-access"* ]] ||
             [[ "$npx_doctor_output" != *'Use $omo:lcx-doctor'* ]] ||
             [[ "$npx_doctor_output" == *"--model"* ]] ||
             [[ "$npx_doctor_output" == *"gpt-5.5-codex-mini"* ]]; then
            echo "::warning::lazycodex-ai doctor dry-run output changed: $npx_doctor_output"
          fi

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## Published LazyCodex smoke"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Result | \`${{ job.status }}\` |"
            echo "| Workflow | \`${{ github.workflow }}\` |"
            echo "| Event | \`${{ github.event_name }}\` |"
            echo "| Ref | \`${{ github.ref_name }}\` |"
            echo
            echo "### What this job checks"
            echo
            echo "- Runs non-blocking smoke checks against \`lazycodex-ai@latest\`."
            echo "- Verifies dry-run install and doctor command routing from an isolated temp directory."
            echo
            echo "### If this fails"
            echo
            echo "Treat warnings as registry or alias drift signals; this job is intentionally non-blocking."
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: [ci-mode]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: oven-sh/setup-bun@v2
        if: needs.ci-mode.outputs.run_heavy == 'true'
        with:
          bun-version: "1.4.0"

      - uses: actions/cache@v6
        if: needs.ci-mode.outputs.run_heavy == 'true'
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.4.0-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        if: needs.ci-mode.outputs.run_heavy == 'true'
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build
        if: needs.ci-mode.outputs.run_heavy == 'true'
        run: bun run build

      - name: Verify build output
        if: needs.ci-mode.outputs.run_heavy == 'true'
        run: |
          test -f dist/index.js || (echo "ERROR: dist/index.js not found!" && exit 1)
          test -f dist/index.d.ts || (echo "ERROR: dist/index.d.ts not found!" && exit 1)

      - name: Verify dist bundle tests
        if: needs.ci-mode.outputs.run_heavy == 'true'
        run: bun test packages/omo-opencode/src/shared/dist-bundle-bun-globals.test.ts packages/omo-opencode/src/shared/dist-bundle-prompt-content.test.ts

      - name: Write job summary
        if: always()
        shell: bash
        env:
          JOB_SUMMARY_TITLE: Root build
          JOB_SUMMARY_STATUS: ${{ job.status }}
          JOB_SUMMARY_DETAILS: |
            - Builds the distributable OpenCode/Codex packages.
            - Confirms `dist/index.js` and `dist/index.d.ts` exist.
            - Runs dist bundle regression tests.
          JOB_SUMMARY_NEXT: Fix the first failing build prerequisite before debugging downstream dist checks.
        run: GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" bash .github/scripts/write-job-summary.sh

  omo-ai-payload-check:
    needs: [ci-mode]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        if: needs.ci-mode.outputs.run_heavy == 'true'
        with:
          node-version: "24"

      - uses: oven-sh/setup-bun@v2
        if: needs.ci-mode.outputs.run_heavy == 'true'
        with:
          bun-version: "1.4.0"

      - uses: actions/cache@v6
        if: needs.ci-mode.outputs.run_heavy == 'true'
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.4.0-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        if: needs.ci-mode.outputs.run_heavy == 'true'
        run: bun install --frozen-lockfile

      - name: Build omo-native
        if: needs.ci-mode.outputs.run_heavy == 'true'
        run: bun run build:omo-native

      - name: Verify omo-ai payload
        if: needs.ci-mode.outputs.run_heavy == 'true'
        run: node script/verify-omo-ai-payload.mjs

      - name: Dry-run publish
        if: needs.ci-mode.outputs.run_heavy == 'true'
        run: npm publish --dry-run --ignore-scripts --tag beta
        working-directory: packages/omo-native

      - name: Write job summary
        if: always()
        shell: bash
        env:
          JOB_SUMMARY_TITLE: omo-ai payload check
          JOB_SUMMARY_STATUS: ${{ job.status }}
          JOB_SUMMARY_DETAILS: |
            - Builds the omo-native package.
            - Verifies the omo-ai tarball payload whitelist.
            - Runs `npm publish --dry-run` to confirm publishability without publishing.
          JOB_SUMMARY_NEXT: Inspect the failing build, payload verifier, or dry-run publish step.
        run: GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" bash .github/scripts/write-job-summary.sh

  auto-commit-schema:
    runs-on: ubuntu-latest
    needs: [ci-mode, test, typecheck, codex-compatibility, senpi-compatibility, build, omo-ai-payload-check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.4.0-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build
        run: bun run build

      - name: Auto-commit schema changes
        run: |
          if git diff --quiet assets/oh-my-opencode.schema.json assets/omo.schema.json; then
            echo "No schema changes to commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add assets/oh-my-opencode.schema.json assets/omo.schema.json
            git commit -m "chore: auto-update schema.json"
            git push
          fi

      - name: Write job summary
        if: always()
        shell: bash
        env:
          JOB_SUMMARY_TITLE: Schema auto-commit
          JOB_SUMMARY_STATUS: ${{ job.status }}
          JOB_SUMMARY_DETAILS: |
            - Rebuilds the schema artifacts on `master` pushes.
            - Commits `assets/oh-my-opencode.schema.json` and `assets/omo.schema.json` only when generation changes them.
          JOB_SUMMARY_NEXT: If this fails, inspect schema generation first, then check bot write permissions.
        run: GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" bash .github/scripts/write-job-summary.sh

  draft-release:
    runs-on: ubuntu-latest
    needs: [ci-mode, test, typecheck, codex-compatibility, senpi-compatibility, build, omo-ai-payload-check]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/dev' &&
      needs.ci-mode.outputs.run_heavy == 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - run: git fetch --force --tags

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Generate release notes
        id: notes
        run: |
          NOTES=$(bun run script/generate-changelog.ts)
          {
            echo "notes<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES: ${{ steps.notes.outputs.notes }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          EXISTING_DRAFT=$(gh release list --json tagName,isDraft --jq '.[] | select(.isDraft == true and .tagName == "next") | .tagName')
          
          if [ -n "$EXISTING_DRAFT" ]; then
            echo "Updating existing draft release..."
            gh release edit next \
              --title "Upcoming Changes 🍿" \
              --notes-file - \
              --draft <<EOF
          $NOTES
          EOF
          else
            echo "Creating new draft release..."
            gh release create next \
              --title "Upcoming Changes 🍿" \
              --notes-file - \
              --draft \
              --target "$TARGET_SHA" <<EOF
          $NOTES
          EOF
          fi

      - name: Write job summary
        if: always()
        shell: bash
        env:
          JOB_SUMMARY_TITLE: Draft release notes
          JOB_SUMMARY_STATUS: ${{ job.status }}
          JOB_SUMMARY_DETAILS: |
            - Generates changelog notes from the current `dev` branch.
            - Creates or updates the `next` draft release.
          JOB_SUMMARY_NEXT: Check changelog generation output first, then GitHub release permissions.
        run: GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" bash .github/scripts/write-job-summary.sh
