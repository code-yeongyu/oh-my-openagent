name: PR Automation

# The one privileged consumer of PR Automation Signal (#13840): CLA, review claims and package labels for a PR head run as
# independent steps of ONE job, so a PR event costs the read-only signal plus one runner slot (it was six jobs). Fork
# isolation is unchanged: the signal stays read-only on pull_request; this workflow runs from the base branch, checks out
# only trusted helpers at github.workflow_sha, never executes PR code, and resolves the PR from GitHub metadata.
# Each part posts its own result ('cla', 'Review claim gate') even when an earlier part failed; the job fails if any did.
on:
  workflow_run:
    workflows: [PR Automation Signal]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Open pull request to recheck (CLA, review claims, package labels)"
        required: true
        type: string

permissions:
  actions: read
  contents: read
  pull-requests: write
  issues: write
  checks: write

env:
  OPENCODE_LABEL: opencode
  LAZYCODEX_LABEL: lazycodex
  GENERATED_LABEL: lazycodex-generated
  PACKAGE_LABEL_COLOR: ededed

# A newer signal for the same PR head branch replaces the older run; a dispatch keys on its own run id.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_run' && format('signal-{0}:{1}', github.event.workflow_run.head_repository.full_name, github.event.workflow_run.head_branch) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'workflow_run' }}

jobs:
  automation:
    name: PR automation
    # A cancelled or skipped signal carries no result to act on: notice-skipped-signal records it instead.
    if: >-
      (github.event_name == 'workflow_run' &&
        (github.event.workflow_run.event == 'pull_request' ||
          github.event.workflow_run.event == 'pull_request_review') &&
        github.event.workflow_run.conclusion != 'cancelled' &&
        github.event.workflow_run.conclusion != 'skipped') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Check out trusted automation helpers
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/ensure-package-labels.sh
            script/pr-automation-context.mjs
            script/pr-review-claims.mjs
          sparse-checkout-cone-mode: false

      - name: Resolve current PR from GitHub run metadata
        id: pr
        uses: actions/github-script@v9
        with:
          script: |
            const { pathToFileURL } = await import('node:url');
            const { prepareCLAEvent } = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/script/pr-automation-context.mjs`).href);
            const pr = await prepareCLAEvent({ github, context, core, eventPath: `${process.env.RUNNER_TEMP}/cla-pr-event.json` });
            if (!pr) return;
            core.setOutput('head_sha', pr.head.sha);
            core.setOutput('title', pr.title);
            core.setOutput('body', pr.body ?? '');

      - name: Check stored CLA signatures
        id: cla_state
        if: steps.pr.outputs.pr_number != ''
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const { readFile } = await import('node:fs/promises');
            context.payload = JSON.parse(await readFile(`${process.env.RUNNER_TEMP}/cla-pr-event.json`, 'utf8'));
            const signaturePath = "signatures/cla.json";
            const signatureBranch = "cla-signatures";
            const allowlist = [
              "code-yeongyu",
              "YeongYU",
              "bot*",
              "dependabot*",
              "github-actions*",
              "*[bot]",
              "sisyphus-dev-ai",
              "web-flow",
            ];

            const matchesAllowlist = (login) => {
              const normalizedLogin = login.toLowerCase();

              return allowlist.some((entry) => {
                const pattern = entry.toLowerCase();

                if (pattern.startsWith("*")) {
                  return normalizedLogin.endsWith(pattern.slice(1));
                }

                if (pattern.endsWith("*")) {
                  return normalizedLogin.startsWith(pattern.slice(0, -1));
                }

                return normalizedLogin === pattern;
              });
            };

            const { owner, repo } = context.repo;
            const pullNumber = context.payload.pull_request.number;

            const [signatureFile, commits] = await Promise.all([
              github.rest.repos.getContent({
                owner,
                repo,
                path: signaturePath,
                ref: signatureBranch,
              }),
              github.paginate(github.rest.pulls.listCommits, {
                owner,
                repo,
                pull_number: pullNumber,
                per_page: 100,
              }),
            ]);

            if (Array.isArray(signatureFile.data) || signatureFile.data.type !== "file") {
              core.setFailed(`${signaturePath} is not a file on ${signatureBranch}`);
              return;
            }

            const signatureContent = Buffer.from(
              signatureFile.data.content,
              signatureFile.data.encoding,
            ).toString("utf8");
            const signatures = JSON.parse(signatureContent);
            const signedContributors = Array.isArray(signatures.signedContributors)
              ? signatures.signedContributors
              : [];
            const signedIds = new Set(
              signedContributors
                .map((contributor) => Number(contributor.id))
                .filter((id) => Number.isFinite(id)),
            );
            const signedNames = new Set(
              signedContributors
                .map((contributor) => String(contributor.name || "").toLowerCase())
                .filter(Boolean),
            );
            const contributors = new Map();

            for (const commit of commits) {
              if (commit.author?.login && commit.author?.id) {
                contributors.set(commit.author.login, {
                  id: commit.author.id,
                  login: commit.author.login,
                });
              }
            }

            const unsigned = [...contributors.values()].filter((contributor) => {
              const login = contributor.login.toLowerCase();

              return (
                !matchesAllowlist(contributor.login) &&
                !signedIds.has(contributor.id) &&
                !signedNames.has(login)
              );
            });

            core.setOutput("needs_cla_action", unsigned.length > 0 ? "true" : "false");

            if (unsigned.length > 0) {
              const { data: current } = await github.rest.pulls.get({
                owner, repo, pull_number: pullNumber,
              });
              if (current.state !== "open" ||
                  current.head.sha !== context.payload.pull_request.head.sha) return;
              const marker = "CLA Assistant Lite bot";
              const body = `Thank you for your contribution! ${unsigned
                .map(contributor => `@${contributor.login}`).join(", ")} must sign the ` +
                `[Contributor License Agreement](https://github.com/${owner}/${repo}/blob/dev/CLA.md).\n\n` +
                "To sign, comment on this PR with:\n```\n" +
                "I have read the CLA Document and I hereby sign the CLA\n```\n\n" +
                `<sub>Posted by the **${marker}**.</sub>`;
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: pullNumber, per_page: 100,
              });
              const existing = comments.find(comment =>
                comment.user?.login === "github-actions[bot]" &&
                comment.body?.includes(marker));
              if (existing) {
                await github.rest.issues.updateComment({
                  owner, repo, comment_id: existing.id, body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: pullNumber, body,
                });
              }
            } else {
              core.info("All linked commit authors already signed the CLA or are allowlisted.");
            }

      - name: Report CLA result on the current PR head
        if: always() && steps.pr.outputs.pr_number != ''
        uses: actions/github-script@v9
        env:
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          EXPECTED_SHA: ${{ steps.pr.outputs.head_sha }}
          RESULT: ${{ steps.cla_state.outcome }}
          UNSIGNED: ${{ steps.cla_state.outputs.needs_cla_action }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: Number(process.env.PR_NUMBER) });
            if (pr.state !== 'open' || (process.env.EXPECTED_SHA && pr.head.sha !== process.env.EXPECTED_SHA)) return;
            await github.rest.checks.create({
              owner, repo, name: 'cla', head_sha: pr.head.sha,
              status: 'completed', conclusion: process.env.RESULT === 'success' && process.env.UNSIGNED !== 'true' ? 'success' : 'failure',
              output: { title: 'CLA signature check', summary: `Trusted CLA automation: ${process.env.RESULT}.` },
            });

      - name: Reconcile review claims and post the Review claim gate
        id: review_claims
        if: always() && steps.pr.outputs.pr_number != ''
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const { pathToFileURL } = await import('node:url');
            const { reconcileReviewClaims } = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/script/pr-review-claims.mjs`).href);
            await reconcileReviewClaims({ github, context, core });

      - name: Ensure canonical labels exist
        id: ensure_labels
        if: always() && steps.pr.outputs.pr_number != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/ensure-package-labels.sh

      - name: Label by changed packages and PR text
        id: package_labels
        if: always() && steps.pr.outputs.pr_number != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          PR_TITLE: ${{ steps.pr.outputs.title }}
          PR_BODY: ${{ steps.pr.outputs.body }}
        run: |
          set -euo pipefail

          label_for_path() {
            case "$1" in
              packages/*/*) : ;;
              *) return 1 ;;
            esac
            local pkg="${1#packages/}"
            pkg="${pkg%%/*}"
            case "$pkg" in
              omo-opencode) printf '%s\n' "$OPENCODE_LABEL" ;;
              omo-codex) printf '%s\n' "$LAZYCODEX_LABEL" ;;
              oh-my-opencode-*) printf '%s\n' "$OPENCODE_LABEL" ;;
              *) printf '%s\n' "$pkg" ;;
            esac
          }

          declare -A wanted=()
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            if label="$(label_for_path "$path")"; then
              wanted["$label"]=1
            fi
          done < <(gh pr diff "$PR_NUMBER" --name-only --repo "$GITHUB_REPOSITORY")

          pr_text="$(printf '%s\n%s\n' "$PR_TITLE" "$PR_BODY" | tr '[:upper:]' '[:lower:]')"
          case "$pr_text" in
            *lazycodex-generated*|*"this pr was generated by lazycodex"*)
              echo "This PR was generated by LazyCodex."
              wanted["$GENERATED_LABEL"]=1
              ;;
          esac

          if [ "${#wanted[@]}" -eq 0 ]; then
            echo "No package-specific changes detected; nothing to label."
            exit 0
          fi

          ensure_package_label() {
            gh label create "$1" --repo "$GITHUB_REPOSITORY" --color "$PACKAGE_LABEL_COLOR" --description "Changes under packages/$1" 2>/dev/null || true
          }

          add_args=()
          for label in "${!wanted[@]}"; do
            case "$label" in
              "$OPENCODE_LABEL" | "$LAZYCODEX_LABEL" | "$GENERATED_LABEL") : ;;
              *) ensure_package_label "$label" ;;
            esac
            add_args+=(--add-label "$label")
          done
          gh pr edit "$PR_NUMBER" "${add_args[@]}" --repo "$GITHUB_REPOSITORY"

      - name: Fail when any part failed
        if: always()
        env:
          PARTS: >-
            resolve=${{ steps.pr.outcome }}
            cla=${{ steps.cla_state.outcome }}
            review-claims=${{ steps.review_claims.outcome }}
            ensure-labels=${{ steps.ensure_labels.outcome }}
            package-labels=${{ steps.package_labels.outcome }}
        run: |
          failed=0
          for part in $PARTS; do
            if [ "${part#*=}" = "failure" ]; then
              echo "::error title=PR automation part failed::${part%%=*}"
              failed=1
            fi
          done
          exit "$failed"

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## PR automation"
            echo
            echo "| Part | Outcome |"
            echo "| --- | --- |"
            echo "| Resolve PR | \`${{ steps.pr.outcome }}\` |"
            echo "| CLA check (\`cla\`) | \`${{ steps.cla_state.outcome }}\` |"
            echo "| Review claims (\`Review claim gate\`) | \`${{ steps.review_claims.outcome }}\` |"
            echo "| Package labels | \`${{ steps.ensure_labels.outcome }}\` / \`${{ steps.package_labels.outcome }}\` |"
            echo
            echo "Each part runs and reports on its own; the job fails when any part failed."
          } >> "$GITHUB_STEP_SUMMARY"

  notice-skipped-signal:
    # Runs exactly when the consumer jobs skipped for a cancelled or skipped signal: if no
    # newer completed signal run covers the same head, say so loudly instead of exiting silently.
    if: >-
      github.event_name == 'workflow_run' &&
      (github.event.workflow_run.conclusion == 'cancelled' ||
        github.event.workflow_run.conclusion == 'skipped')
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      actions: read
      pull-requests: read
    steps:
      - name: Report a skipped signal with no newer run for this head
        uses: actions/github-script@v9
        with:
          script: |
            const head = context.payload.workflow_run.head_sha;
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'pr-automation-signal.yml',
              head_sha: head,
              per_page: 100,
            });
            const thisId = context.payload.workflow_run.id;
            const newer = data.workflow_runs.filter((run) => run.id > thisId);
            if (newer.length > 0) {
              core.info(`A newer PR Automation Signal run (${newer[0].run_number}) covers head ${head.slice(0, 10)}; this signal carried no result to act on.`);
              return;
            }
            // A push cancels the signal of the head it replaced: only a head that is still an open PR's head is a gap.
            // A deleted fork has no head repository to look up: keep the warning.
            const signal = context.payload.workflow_run;
            if (signal.head_repository) {
              const { data: open } = await github.rest.pulls.list({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                head: `${signal.head_repository.owner.login}:${signal.head_branch}`,
                per_page: 100,
              });
              if (!open.some((pr) => pr.head.sha === head)) {
                core.info(`Head ${head.slice(0, 10)} is no longer an open PR head; its superseded signal needs no checks.`);
                return;
              }
            }
            core.warning(`No newer PR Automation Signal run for head ${head.slice(0, 10)}: the ${context.workflow} checks have NOT run for this head. Re-run with workflow_dispatch (pr_number) if this head still needs them.`);
            await core.summary
              .addHeading(`${context.workflow}: checks skipped on a cancelled signal`)
              .addRaw(`No newer PR Automation Signal run exists for head ${head.slice(0, 10)}. The checks did not run. Use the workflow_dispatch input pr_number to run them for this PR.`)
              .write();
      - name: Write job summary
        if: always()
        run: |
          {
            echo "## Skipped-signal notice"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Event | \`${{ github.event_name }}\` |"
            echo "| Upstream conclusion | \`${{ github.event.workflow_run.conclusion }}\` |"
            echo "| Detail | see the notice step output above |"
          } >> "$GITHUB_STEP_SUMMARY"
