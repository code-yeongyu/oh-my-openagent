name: PR Automation Signal

# No checkout, artifacts, secrets, or write token. The privileged consumer (pr-automation.yml) resolves
# the PR from GitHub's run metadata and reads its current state through the API.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

# One signal per PR: a newer event for the same PR replaces a queued or running older signal. Its one consumer,
# PR Automation, acts on the PR's current state, so only the newest signal carries anything to act on.
concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  signal:
    runs-on: ubuntu-latest
    steps:
      - name: Signal metadata automation
        run: echo "PR metadata is ready for trusted workflow_run consumers."
      - name: Write job summary
        if: always()
        run: echo 'Read-only PR metadata signal; no PR code or artifacts were executed.' >> "$GITHUB_STEP_SUMMARY"
