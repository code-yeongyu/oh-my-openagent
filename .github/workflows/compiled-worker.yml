name: Compiled session worker

on:
  pull_request:
    paths:
      - script/senpi-worker-compile.ts
      - script/senpi-worker-compile.test.ts
      - .github/workflows/compiled-worker.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  relocated-worker:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - name: Exercise relocated compiled workers without repository dependencies
        shell: bash
        run: |
          set -euo pipefail
          scratch=$(mktemp -d)
          trap 'rm -rf "$scratch"' EXIT
          cp script/senpi-worker-compile.ts script/senpi-worker-compile.test.ts "$scratch/"
          cd "$scratch"
          bun --revision
          bun test
      - name: Write job summary
        if: always()
        shell: bash
        env:
          JOB_SUMMARY_TITLE: Compiled session worker (${{ matrix.os }})
          JOB_SUMMARY_STATUS: ${{ job.status }}
          JOB_SUMMARY_DETAILS: |
            - Bun 1.4.2; directory, Bun-link, and external-link layouts.
            - Source trees removed before relocated executables start two workers.
          JOB_SUMMARY_NEXT: Inspect the test log for runtime revision and executable SHA-256 values.
        run: GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" bash .github/scripts/write-job-summary.sh
