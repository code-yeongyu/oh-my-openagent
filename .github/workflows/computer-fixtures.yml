name: Computer conformance fixtures

on:
  push:
    paths:
      - "script/qa/computer/conformance/fixtures/**"
      - ".github/workflows/computer-fixtures.yml"
  pull_request:
    branches: [master, dev]
    paths:
      - "script/qa/computer/conformance/fixtures/**"
      - ".github/workflows/computer-fixtures.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-linux:
    name: fixture native-linux (ubuntu-26.04)
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The image carries Xvfb and Tk but no GTK bindings; Tk has no AT-SPI bridge, so the ax cells
      # need a toolkit that exports AT-SPI. GTK 3 through PyGObject is the route the repo's AT-SPI
      # fixtures already use.
      - name: Install GTK 3 bindings
        run: |
          sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get install -y --no-install-recommends \
            python3-gi gir1.2-gtk-3.0

      - name: Self-test
        run: |
          xvfb-run -a bun script/qa/computer/conformance/fixtures/self-test.ts --fixture native-linux -- \
            /usr/bin/python3 script/qa/computer/conformance/fixtures/native-linux/fixture.py

      - name: Sabotage legs (each must turn the self-test red)
        run: |
          for field in value receivedKeys pressCount scrollSteps dragOrder menuSelection title savedDocuments; do
            xvfb-run -a bun script/qa/computer/conformance/fixtures/self-test.ts --fixture native-linux --sabotage "$field" -- \
              /usr/bin/python3 script/qa/computer/conformance/fixtures/native-linux/fixture.py | tail -n 1
            test "${PIPESTATUS[0]}" -eq 0
          done

      - name: Write job summary
        if: always()
        shell: bash
        env:
          JOB_SUMMARY_TITLE: Conformance fixture native-linux
          JOB_SUMMARY_STATUS: ${{ job.status }}
          JOB_SUMMARY_DETAILS: |
            - GTK 3 fixture under Xvfb: each catalog action applied through GTK must change exactly its report field.
            - Sabotage legs: a pinned report field must turn the self-test red, on that field's legs only.
          JOB_SUMMARY_NEXT: Start with the first CHECK ... FAIL or SABOTAGE ... line; a STAYED GREEN line means the self-test cannot see that field.
        run: GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" bash .github/scripts/write-job-summary.sh
