name: Windows standalone binary

# A Windows standalone omo binary must work when run from the folder it was downloaded to (#7485):
# build the windows-x64 binary from this commit, copy it alone into an empty directory, and run a
# scripted session whose shell command loads the terminal runtime, on a first and a second launch.
on:
  pull_request:
    paths:
      - "packages/omo-native/**"
      - "script/build-omo-binary.ts"
      - "script/engine-sidecar-sources.ts"
      - "script/qa/omo-native-bare-exe-smoke.mjs"
      - ".github/workflows/windows-standalone-binary.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bare-exe:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build the desktop engine the binary embeds
        run: |
          toolchain=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$toolchain" --profile minimal
          rustup default "$toolchain"
          rustup target add x86_64-pc-windows-msvc
          cargo build --release -p senpi-desktop-engine --locked --target x86_64-pc-windows-msvc

      - name: Build the windows-x64 standalone binary
        run: |
          version=$(jq -r .version packages/omo-native/package.json)
          bun script/build-omo-binary.ts --target windows-x64 --omo-version "$version" --omo-ai-version "$version" --out-dir .omo/bare-exe

      - name: Run the binary from an empty download folder
        run: bun script/qa/omo-native-bare-exe-smoke.mjs --binary .omo/bare-exe/omo-windows-x64.exe

      - name: Write job summary
        if: always()
        shell: bash
        env:
          JOB_SUMMARY_TITLE: Windows standalone binary
          JOB_SUMMARY_STATUS: ${{ job.status }}
          JOB_SUMMARY_DETAILS: |
            - Builds the windows-x64 standalone binary from this commit.
            - Runs it from an empty download folder twice, each with a scripted shell command that loads the terminal runtime.
          JOB_SUMMARY_NEXT: Read the PASS/FAIL lines of the last step; a FAIL names the tool error the binary returned.
        run: GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" bash .github/scripts/write-job-summary.sh
