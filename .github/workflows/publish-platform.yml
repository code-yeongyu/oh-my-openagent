name: publish-platform
run-name: "platform packages ${{ inputs.version }}"

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      dist_tag:
        required: false
        type: string
        default: ""
      omo_ai_version:
        # omo-ai version stamped into the release binaries. Optional here so the
        # caller wiring stays actionlint-clean; the binary lane fails loud when
        # it is missing or malformed (see "Check release assets").
        required: false
        type: string
        default: ""
      # Operator-built darwin artifacts (#13921): only publish.yml passes these, after its gate-reuse job
      # admitted the maintainer. A direct dispatch always uses the hosted macOS legs.
      operator_darwin_artifacts:
        required: false
        type: string
        default: ""
      operator_darwin_manifest_sha256:
        required: false
        type: string
        default: ""
      prepared_release_sha:
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g., 3.0.0-beta.12)"
        required: true
        type: string
      dist_tag:
        description: "npm dist tag (e.g., beta, latest)"
        required: false
        type: string
        default: ""
      omo_ai_version:
        description: "omo-ai version to stamp into release binaries (e.g., 3.0.0-0.beta.12)"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  desktop-engine:
    if: github.repository == 'code-yeongyu/oh-my-openagent'
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        # The two darwin legs drop out when operator-built darwin artifacts replace them (#13921); the
        # operator-darwin job then uploads verified desktop-engine-darwin-* artifacts under the same names.
        # Native arm64 Linux runners, so --selftest executes the arm64 build itself; 22.04 keeps the same glibc
        # floor as the x64 engine.
        include: ${{ fromJSON(format('[{0}{1}]', inputs.operator_darwin_artifacts == '' && '{"host":"darwin-arm64","runner":"macos-15","rust_target":"aarch64-apple-darwin","clang_arch":"arm64","binary":"senpi-desktop-engine"},{"host":"darwin-x64","runner":"macos-15","rust_target":"x86_64-apple-darwin","clang_arch":"x86_64","binary":"senpi-desktop-engine"},' || '', '{"host":"linux-x64","runner":"ubuntu-22.04","rust_target":"x86_64-unknown-linux-gnu","binary":"senpi-desktop-engine"},{"host":"linux-arm64","runner":"ubuntu-22.04-arm","rust_target":"aarch64-unknown-linux-gnu","binary":"senpi-desktop-engine"},{"host":"win32-x64","runner":"windows-latest","rust_target":"x86_64-pc-windows-msvc","binary":"senpi-desktop-engine.exe"},{"host":"win32-arm64","runner":"windows-11-arm","rust_target":"aarch64-pc-windows-msvc","binary":"senpi-desktop-engine.exe"}')) }}
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Install pinned Rust toolchain and target
        run: |
          toolchain=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$toolchain" --profile minimal
          rustup default "$toolchain"
          rustup target add "${{ matrix.rust_target }}"

      - name: Build and sign Darwin capture helper
        if: startsWith(matrix.host, 'darwin-')
        timeout-minutes: 75
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          MACOS_SIGNING_REQUIRED: ${{ vars.MACOS_SIGNING_REQUIRED }}
          CLANG_ARCH: ${{ matrix.clang_arch }}
        run: |
          set -euo pipefail
          HELPER_DIR="${RUNNER_TEMP}/desktop-capture-helper"
          HELPER="${HELPER_DIR}/senpi-desktop-capture-helper"
          mkdir -p "$HELPER_DIR"
          /usr/bin/clang -arch "$CLANG_ARCH" \
            -x objective-c -std=c11 -fobjc-arc -O2 -Wall \
            -mmacosx-version-min=13.0 \
            -framework AppKit -framework ScreenCaptureKit -framework CoreVideo \
            crates/senpi-desktop-backend-macos/native/senpi-desktop-capture-helper.m \
            -o "$HELPER"
          # The helper carries the engine's identifier (build.rs signs dev builds the same way). The
          # engine stages it at a fresh temp path on every start, so TCC charges Screen Recording to the
          # responsible process (the app that launched OmO), not to the helper. It is signed, not
          # notarized: the engine writes it unquarantined into a private directory at runtime, so
          # Gatekeeper never assesses it.
          bash .github/scripts/macos-sign-and-notarize.sh --sign-only \
            --identifier ai.sisyphuslabs.senpi-desktop-engine "$HELPER"
          test -s "$HELPER"
          codesign -dv --verbose=2 "$HELPER" 2>&1 | grep -qx "Identifier=ai.sisyphuslabs.senpi-desktop-engine" \
            || { echo "::error::the capture helper is not signed with the engine identifier" >&2; exit 1; }
          echo "SENPI_DESKTOP_CAPTURE_HELPER_SIGNED=$HELPER_DIR" >> "$GITHUB_ENV"

      - name: Build desktop engine
        env:
          # rustc defaults x86_64-apple-darwin to macOS 10.12, which links the Swift back-deploy
          # libraries through @rpath with no LC_RPATH: the x64 engine then aborts in dyld at launch.
          # 11.0 is the arm64 default and keeps both Darwin engines on the OS Swift runtime.
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: cargo build --release -p senpi-desktop-engine --locked --target "${{ matrix.rust_target }}"

      - name: Stage desktop engine release asset
        run: |
          bun script/desktop-engine-release.ts stage \
            "${{ matrix.host }}" \
            "target/${{ matrix.rust_target }}/release/${{ matrix.binary }}" \
            ".omo/desktop-engine-assets"

      - name: Smoke native desktop engine
        if: matrix.host != 'darwin-x64'
        run: "target/${{ matrix.rust_target }}/release/${{ matrix.binary }} --selftest"

      - name: Smoke x64 Darwin desktop engine under Rosetta
        if: matrix.host == 'darwin-x64'
        run: |
          arch -x86_64 /usr/bin/true 2>/dev/null || sudo softwareupdate --install-rosetta --agree-to-license
          arch -x86_64 "target/${{ matrix.rust_target }}/release/${{ matrix.binary }}" --selftest

      # The memory-core git floor-job helper (omo#10391) ships on Windows only, unsigned like the engine, with a static
      # CRT (design v4.2 section 3). Its own cargo call, so RUSTFLAGS reaches no other package. The selftest proves the
      # release bytes can create, limit and join a Global floor job on this runner's own architecture.
      - name: Build git job helper
        if: startsWith(matrix.host, 'win32-')
        env:
          HOST: ${{ matrix.host }}
          RUST_TARGET: ${{ matrix.rust_target }}
          RUSTFLAGS: -C target-feature=+crt-static
        run: |
          set -euo pipefail
          cargo build --release -p omo-git-job-helper --locked --target "$RUST_TARGET"
          HELPER_DIR=".omo/desktop-engine-assets/git-job-helper-${HOST}"
          mkdir -p "$HELPER_DIR"
          cp "target/${RUST_TARGET}/release/omo-git-job-helper.exe" "$HELPER_DIR/"
          chmod 755 "$HELPER_DIR/omo-git-job-helper.exe"
          SELFTEST="$("$HELPER_DIR/omo-git-job-helper.exe" selftest)"
          echo "$SELFTEST"
          [[ "$SELFTEST" == "selftest ok "* ]]

      # The engine CA importer's fact helper (omo#10762) ships on macOS and Windows; Linux reads its trust store
      # from files and gets none. The Windows build stays unsigned, like the Windows engine.
      - name: Build engine trust helper
        if: startsWith(matrix.host, 'darwin-') || startsWith(matrix.host, 'win32-')
        env:
          # Same floor as the engine: rustc otherwise defaults x86_64-apple-darwin to macOS 10.12.
          MACOSX_DEPLOYMENT_TARGET: "11.0"
          HOST: ${{ matrix.host }}
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          set -euo pipefail
          cargo build --release -p omo-engine-trust-helper --locked --target "$RUST_TARGET"
          EXE=""
          if [[ "$HOST" == win32-* ]]; then EXE=".exe"; fi
          # A host-named directory: publish.yml merges every desktop-engine artifact into one directory and
          # uploads only its top-level omo-* and senpi-desktop-engine-* files as release assets.
          HELPER_DIR=".omo/desktop-engine-assets/engine-trust-helper-${HOST}"
          mkdir -p "$HELPER_DIR"
          cp "target/${RUST_TARGET}/release/omo-engine-trust-helper${EXE}" "$HELPER_DIR/"
          chmod 755 "$HELPER_DIR/omo-engine-trust-helper${EXE}"

      - name: Sign Darwin engine trust helper
        if: startsWith(matrix.host, 'darwin-')
        timeout-minutes: 75
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          MACOS_SIGNING_REQUIRED: ${{ vars.MACOS_SIGNING_REQUIRED }}
          HOST: ${{ matrix.host }}
        run: |
          set -euo pipefail
          HELPER=".omo/desktop-engine-assets/engine-trust-helper-${HOST}/omo-engine-trust-helper"
          # Signed, not notarized, like the capture helper: the compiled omo extracts it unquarantined into its
          # runtime directory and spawns it from there, so Gatekeeper never assesses it. The bytes signed here
          # are the bytes the build job hashes into the runtime manifest.
          bash .github/scripts/macos-sign-and-notarize.sh --sign-only \
            --identifier ai.sisyphuslabs.omo-engine-trust-helper "$HELPER"
          test -s "$HELPER"
          codesign -dv --verbose=2 "$HELPER" 2>&1 | grep -qx "Identifier=ai.sisyphuslabs.omo-engine-trust-helper" \
            || { echo "::error::the engine trust helper is not signed with its identifier" >&2; exit 1; }

      # Runs the signed bytes under the hardened runtime and decodes what they print with the production decoder.
      # The macOS helper takes no input; it reads the runner's own trust store.
      - name: Smoke signed Darwin engine trust helper
        if: startsWith(matrix.host, 'darwin-')
        env:
          HOST: ${{ matrix.host }}
        run: |
          set -euo pipefail
          HELPER=".omo/desktop-engine-assets/engine-trust-helper-${HOST}/omo-engine-trust-helper"
          OUTPUT="${RUNNER_TEMP}/engine-trust-helper-output.json"
          if [ "$HOST" = darwin-x64 ]; then
            arch -x86_64 /usr/bin/true 2>/dev/null || sudo softwareupdate --install-rosetta --agree-to-license
            arch -x86_64 "$HELPER" < /dev/null > "$OUTPUT"
          else
            "$HELPER" < /dev/null > "$OUTPUT"
          fi
          bun script/engine-trust-helper-smoke.ts < "$OUTPUT"

      - name: Sign and notarize Darwin desktop engine
        if: startsWith(matrix.host, 'darwin-')
        timeout-minutes: 75
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          MACOS_SIGNING_REQUIRED: ${{ vars.MACOS_SIGNING_REQUIRED }}
          HOST: ${{ matrix.host }}
        run: |
          set -euo pipefail
          ASSET=".omo/desktop-engine-assets/senpi-desktop-engine-${HOST}"
          bash .github/scripts/macos-sign-and-notarize.sh --identifier ai.sisyphuslabs.senpi-desktop-engine "$ASSET"
          if [ "$HOST" = darwin-x64 ]; then
            arch -x86_64 "$ASSET" --selftest
          else
            "$ASSET" --selftest
          fi

      - name: Upload desktop engine artifact
        uses: actions/upload-artifact@v7
        with:
          name: desktop-engine-${{ matrix.host }}
          path: |
            .omo/desktop-engine-assets/senpi-desktop-engine-*
            .omo/desktop-engine-assets/engine-trust-helper-*/omo-engine-trust-helper*
            .omo/desktop-engine-assets/git-job-helper-*/omo-git-job-helper*
          retention-days: 1
          if-no-files-found: error

      - name: Write job summary
        if: always()
        shell: bash
        env:
          JOB_SUMMARY_TITLE: Desktop engine release build (${{ matrix.host }})
          JOB_SUMMARY_STATUS: ${{ job.status }}
          JOB_SUMMARY_DETAILS: |
            - Builds the Rust desktop engine for the declared host.
            - Stages the shared release asset name and signs Darwin binaries.
            - Runs --selftest on every leg; the x64 Darwin cross-build runs it under Rosetta.
          JOB_SUMMARY_NEXT: Check the Rust target build or signed asset staging output.
        run: GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" bash .github/scripts/write-job-summary.sh

  # The signed keychain helper (#11262): one universal build, signed with its fixed identifier and
  # notarized, then gated on its exact designated requirement. Every darwin output takes these bytes:
  # the darwin build legs (compiled payload and platform packages), publish-main (omo-ai) and the
  # GitHub release asset the desktop fetches.
  keychain-helper:
    if: github.repository == 'code-yeongyu/oh-my-openagent' && inputs.operator_darwin_artifacts == ''
    runs-on: macos-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Build universal keychain helper
        run: |
          set -euo pipefail
          HELPER_DIR="${RUNNER_TEMP}/omo-keychain"
          mkdir -p "$HELPER_DIR"
          bun packages/omo-native/keychain-helper/build.ts --out "$HELPER_DIR/omo-keychain"
          echo "KEYCHAIN_HELPER=$HELPER_DIR/omo-keychain" >> "$GITHUB_ENV"

      - name: Sign and notarize keychain helper
        timeout-minutes: 75
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          # Forced: an ad-hoc helper would fail every install's requirement check.
          MACOS_SIGNING_REQUIRED: "true"
        run: |
          set -euo pipefail
          bash .github/scripts/macos-sign-and-notarize.sh --identifier com.mengmota.omo-keychain-helper "$KEYCHAIN_HELPER"

      - name: Verify keychain helper signature
        run: bun script/keychain-helper-release.ts verify "$KEYCHAIN_HELPER"

      - name: Package keychain helper artifacts
        run: |
          set -euo pipefail
          chmod 0755 "$KEYCHAIN_HELPER"
          mkdir -p .omo/keychain-helper .omo/release-binaries
          # The tarball keeps the mode across jobs; upload-artifact alone would drop u+x.
          tar -czf .omo/keychain-helper/omo-keychain.tar.gz -C "$(dirname "$KEYCHAIN_HELPER")" omo-keychain
          cp "$KEYCHAIN_HELPER" .omo/release-binaries/omo-keychain-darwin-universal

      - name: Upload keychain helper artifact
        uses: actions/upload-artifact@v7
        with:
          name: keychain-helper
          path: .omo/keychain-helper/omo-keychain.tar.gz
          retention-days: 1
          if-no-files-found: error

      - name: Upload keychain helper release asset artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-binary-omo-keychain
          path: .omo/release-binaries/omo-keychain-darwin-universal
          retention-days: 1
          if-no-files-found: error

      - name: Write job summary
        if: always()
        shell: bash
        env:
          JOB_SUMMARY_TITLE: Keychain helper release build
          JOB_SUMMARY_STATUS: ${{ job.status }}
          JOB_SUMMARY_DETAILS: |
            - Builds the universal (arm64 + x86_64) omo-keychain helper from the release commit.
            - Signs it as com.mengmota.omo-keychain-helper with the hardened runtime and notarizes it.
            - Fails unless its designated requirement, team, architectures and mode match the helper contract.
          JOB_SUMMARY_NEXT: Check the clang build, the signing/notarization log, or the requirement mismatch printed by the verify step.
        run: GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" bash .github/scripts/write-job-summary.sh

  # Operator-built darwin artifacts (#13921) replace the hosted macOS legs: desktop-engine darwin-arm64/x64,
  # keychain-helper and the darwin release binaries. publish.yml's gate-reuse admitted the maintainer; this job
  # verifies every artifact on Linux before anything consumes it, then uploads them under the artifact names the
  # hosted legs use. The verifier checks every code page, the CMS signer (the certificate that actually signed,
  # chained to the pinned Developer ID CA and Apple root) and its team, and Apple's ticket service confirms
  # notarization by cdhash. Trade-off (accepted): no Gatekeeper/OCSP evaluation runs in CI.
  operator-darwin:
    if: github.repository == 'code-yeongyu/oh-my-openagent' && inputs.operator_darwin_artifacts != ''
    runs-on: ubuntu-24.04
    # The verifier's two network lookups (Apple ticket, GitHub role) time out per call. The gh and git commands in
    # the other steps have no per-call bound, so this caps the whole job well below the 6 h default.
    timeout-minutes: 30
    permissions:
      # Draft releases are listed only to tokens with push access; nothing here writes.
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      # The job holds a write token while it parses operator-supplied binaries: keep it out of .git/config.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      # The checkout is the dispatched ref (#13943, #13964). This step refuses a ref whose operator-darwin-*.ts or
      # bunfig.toml differ from the default branch's, and copies the DEFAULT BRANCH's verifier bytes outside the
      # checkout. The verify step runs only that copy, from an empty working directory, with no Bun config, no .env
      # and a cleared environment, so no file in the ref (bunfig.toml, tsconfig.json/jsconfig.json paths, .env) can
      # replace the verifier or intercept its lookups. It does NOT pin this workflow file itself: a ref that edits
      # publish-platform.yml can drop this step, which only a protected environment or a branch rule closes (owner
      # setting).
      - name: Refuse operator darwin verifier code that differs from the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'dev' }}
        run: |
          set -euo pipefail
          if ! git fetch --no-tags --depth=1 origin "$DEFAULT_BRANCH"; then
            echo "::error::operator_darwin_artifacts refused: could not fetch ${DEFAULT_BRANCH} to compare the verifier."
            exit 1
          fi
          if ! git diff --quiet FETCH_HEAD HEAD -- '.github/workflows/operator-darwin-*.ts' bunfig.toml; then
            echo "::error::operator_darwin_artifacts refused: .github/workflows/operator-darwin-*.ts or bunfig.toml differ from ${DEFAULT_BRANCH}; the dispatched ref must carry the merged verifier unchanged."
            git diff --stat FETCH_HEAD HEAD -- '.github/workflows/operator-darwin-*.ts' bunfig.toml
            exit 1
          fi
          PINNED="${RUNNER_TEMP}/operator-darwin-verifier"
          mkdir -p "$PINNED"
          git ls-tree --name-only FETCH_HEAD .github/workflows/ | grep '/operator-darwin-[a-z]*\.ts$' | while read -r path; do
            git show "FETCH_HEAD:${path}" > "${PINNED}/${path##*/}"
          done
          test -s "${PINNED}/operator-darwin-verify.ts"
          echo "OPERATOR_DARWIN_VERIFIER=${PINNED}" >> "$GITHUB_ENV"
          echo "The operator darwin verifier equals ${DEFAULT_BRANCH}; pinned copy at ${PINNED}."

      - name: Download operator darwin artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.operator_darwin_artifacts }}
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^operator-darwin-[0-9a-f]{12}$ ]]; then
            echo "::error::operator_darwin_artifacts refused: it must be operator-darwin-<12 lowercase hex of the source commit>."
            exit 1
          fi
          if [ "$(gh release view "$TAG" --json isDraft --jq '.isDraft')" != "true" ]; then
            echo "::error::operator_darwin_artifacts refused: ${TAG} is not a draft staging release."
            exit 1
          fi
          DIR="${RUNNER_TEMP}/operator-darwin"
          mkdir -p "$DIR"
          gh release download "$TAG" --dir "$DIR"
          echo "OPERATOR_DARWIN_DIR=$DIR" >> "$GITHUB_ENV"

      - name: Verify operator darwin artifacts
        env:
          TAG: ${{ inputs.operator_darwin_artifacts }}
          MANIFEST_SHA256: ${{ inputs.operator_darwin_manifest_sha256 }}
          PREPARED_RELEASE_SHA: ${{ inputs.prepared_release_sha }}
          VERSION: ${{ inputs.version }}
          # The verifier re-checks the dispatcher's role itself, so a future caller of this workflow cannot skip
          # publish.yml's maintainer gate.
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Nothing reads the operator-supplied manifest before its sha256 matches the maintainer's dispatch pin.
          MANIFEST="$OPERATOR_DARWIN_DIR/operator-darwin-manifest.json"
          if [ ! -f "$MANIFEST" ] || [ "$(sha256sum "$MANIFEST" | cut -d' ' -f1)" != "$MANIFEST_SHA256" ]; then
            echo "::error::operator_darwin_artifacts refused: operator-darwin-manifest.json does not match the pinned operator_darwin_manifest_sha256."
            exit 1
          fi
          SOURCE_SHA="$(jq -r '.source_sha // empty' "$MANIFEST")"
          if ! [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ && "$PREPARED_RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::operator_darwin_artifacts refused: the manifest source_sha and prepared_release_sha must be 40-hex SHAs."
            exit 1
          fi
          if ! git fetch --no-tags --depth=200 origin "$SOURCE_SHA" "$PREPARED_RELEASE_SHA"; then
            echo "::error::operator_darwin_artifacts refused: could not fetch source ${SOURCE_SHA} and prepared_release_sha ${PREPARED_RELEASE_SHA}."
            exit 1
          fi
          # Run the pinned default-branch verifier from an empty directory outside the checkout: no bunfig.toml,
          # tsconfig/jsconfig or .env from the ref is in reach, and the environment is rebuilt from scratch so no
          # proxy, TLS override, NODE_OPTIONS or BUN_* setting reaches it.
          RUN_DIR="$(mktemp -d "${RUNNER_TEMP}/operator-darwin-run.XXXXXX")"
          : > "${RUN_DIR}/empty-bunfig.toml"
          # env -i drops the runner environment so a proxy, TLS override or NODE_OPTIONS cannot reach the
          # verifier. Windows cannot create a process without its system root, so only those variables are forwarded.
          WIN_BASE=()
          if [ -n "${SYSTEMROOT:-}" ]; then
            WIN_BASE+=(
              "SYSTEMROOT=${SYSTEMROOT}"
              "SYSTEMDRIVE=${SYSTEMDRIVE:-}"
              "WINDIR=${WINDIR:-$SYSTEMROOT}"
              "PATHEXT=${PATHEXT:-.COM;.EXE;.BAT;.CMD}"
              "COMSPEC=${COMSPEC:-${SYSTEMROOT}\\system32\\cmd.exe}"
              "TEMP=${TEMP:-}"
              "TMP=${TMP:-}"
            )
          fi
          (cd "$RUN_DIR" && env -i PATH="$PATH" HOME="$RUN_DIR" RUNNER_TEMP="$RUNNER_TEMP" GH_TOKEN="${GH_TOKEN:-}" \
            "${WIN_BASE[@]}" \
            bun --no-env-file --config="${RUN_DIR}/empty-bunfig.toml" "${OPERATOR_DARWIN_VERIFIER}/operator-darwin-verify.ts" \
            --dir "$OPERATOR_DARWIN_DIR" --tag "$TAG" \
            --manifest-sha256 "$MANIFEST_SHA256" --prepared-sha "$PREPARED_RELEASE_SHA" --version "$VERSION" --repo "$GITHUB_WORKSPACE" \
            --actor "$ACTOR" --triggering-actor "$TRIGGERING_ACTOR" --repository "$REPOSITORY" \
            --summary "${RUNNER_TEMP}/operator-darwin-rows.md")
          {
            echo "### Darwin artifacts: OPERATOR-BUILT"
            echo "npm provenance covers this publish run only; the darwin build is attested by the Developer ID signature, Apple notarization and the sha256 values below, which the release records."
            echo
            cat "${RUNNER_TEMP}/operator-darwin-rows.md"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stage verified artifacts under the hosted artifact layout
        run: |
          set -euo pipefail
          D="$OPERATOR_DARWIN_DIR"
          for HOST in darwin-arm64 darwin-x64; do
            mkdir -p ".omo/operator-darwin/desktop-engine-${HOST}/engine-trust-helper-${HOST}"
            install -m 0755 "$D/senpi-desktop-engine-${HOST}" ".omo/operator-darwin/desktop-engine-${HOST}/"
            install -m 0755 "$D/omo-engine-trust-helper-${HOST}" ".omo/operator-darwin/desktop-engine-${HOST}/engine-trust-helper-${HOST}/omo-engine-trust-helper"
          done
          for PLATFORM in darwin-arm64 darwin-x64 darwin-x64-baseline; do
            mkdir -p ".omo/operator-darwin/release-binary-${PLATFORM}"
            install -m 0755 "$D/omo-${PLATFORM}" ".omo/operator-darwin/release-binary-${PLATFORM}/"
          done
          mkdir -p .omo/operator-darwin/keychain .omo/operator-darwin/keychain-helper .omo/operator-darwin/release-binary-omo-keychain
          install -m 0755 "$D/omo-keychain-darwin-universal" .omo/operator-darwin/keychain/omo-keychain
          tar -czf .omo/operator-darwin/keychain-helper/omo-keychain.tar.gz -C .omo/operator-darwin/keychain omo-keychain
          install -m 0755 "$D/omo-keychain-darwin-universal" .omo/operator-darwin/release-binary-omo-keychain/

      - name: Upload desktop-engine-darwin-arm64
        uses: actions/upload-artifact@v7
        with:
          name: desktop-engine-darwin-arm64
          path: .omo/operator-darwin/desktop-engine-darwin-arm64/
          retention-days: 1
          if-no-files-found: error

      - name: Upload desktop-engine-darwin-x64
        uses: actions/upload-artifact@v7
        with:
          name: desktop-engine-darwin-x64
          path: .omo/operator-darwin/desktop-engine-darwin-x64/
          retention-days: 1
          if-no-files-found: error

      - name: Upload keychain-helper
        uses: actions/upload-artifact@v7
        with:
          name: keychain-helper
          path: .omo/operator-darwin/keychain-helper/omo-keychain.tar.gz
          retention-days: 1
          if-no-files-found: error

      - name: Upload release-binary-omo-keychain
        uses: actions/upload-artifact@v7
        with:
          name: release-binary-omo-keychain
          path: .omo/operator-darwin/release-binary-omo-keychain/omo-keychain-darwin-universal
          retention-days: 1
          if-no-files-found: error

      - name: Upload release-binary-darwin-arm64
        uses: actions/upload-artifact@v7
        with:
          name: release-binary-darwin-arm64
          path: .omo/operator-darwin/release-binary-darwin-arm64/omo-darwin-arm64
          retention-days: 1
          if-no-files-found: error

      - name: Upload release-binary-darwin-x64
        uses: actions/upload-artifact@v7
        with:
          name: release-binary-darwin-x64
          path: .omo/operator-darwin/release-binary-darwin-x64/omo-darwin-x64
          retention-days: 1
          if-no-files-found: error

      - name: Upload release-binary-darwin-x64-baseline
        uses: actions/upload-artifact@v7
        with:
          name: release-binary-darwin-x64-baseline
          path: .omo/operator-darwin/release-binary-darwin-x64-baseline/omo-darwin-x64-baseline
          retention-days: 1
          if-no-files-found: error

      - name: Write job summary
        if: always()
        shell: bash
        env:
          JOB_SUMMARY_TITLE: Operator-built darwin artifacts
          JOB_SUMMARY_STATUS: ${{ job.status }}
          JOB_SUMMARY_DETAILS: |
            - Downloads the draft staging release named by operator_darwin_artifacts.
            - Verifies every artifact's code pages, Developer ID signer, team and notarization ticket, and the engines' source stamp.
            - Uploads the verified artifacts under the hosted darwin artifact names.
          JOB_SUMMARY_NEXT: Read the operator_darwin_artifacts refused line; rebuild or re-stage the named artifact.
        run: GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" bash .github/scripts/write-job-summary.sh

  # =============================================================================
  # Job 1: Build binaries for all platforms
  # - Windows builds on windows-latest (avoid bun cross-compile segfault)
  # - All other platforms build on ubuntu-latest
  # - Uploads compressed artifacts for the publish job
  # =============================================================================
  build:
    needs: [desktop-engine, keychain-helper, operator-darwin]
    # With operator-built darwin artifacts the hosted keychain-helper is skipped and operator-darwin must pass;
    # otherwise operator-darwin is skipped and both hosted jobs must pass, as before.
    if: >-
      always() && !cancelled() &&
      github.repository == 'code-yeongyu/oh-my-openagent' &&
      needs.desktop-engine.result == 'success' &&
      ((inputs.operator_darwin_artifacts == '' && needs.keychain-helper.result == 'success') ||
       (inputs.operator_darwin_artifacts != '' && needs.operator-darwin.result == 'success'))
    # Pin until this release/deploy path is proven on Ubuntu 26.04: #9945. Operator-built darwin legs only
    # package the npm launcher, which needs no macOS.
    runs-on: ${{ startsWith(matrix.platform, 'windows-') && 'windows-latest' || startsWith(matrix.platform, 'darwin-') && inputs.operator_darwin_artifacts == '' && 'macos-latest' || 'ubuntu-24.04' }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      max-parallel: 11
      matrix:
        platform: [darwin-arm64, darwin-x64, darwin-x64-baseline, linux-x64, linux-x64-baseline, linux-arm64, linux-x64-musl, linux-x64-musl-baseline, linux-arm64-musl, windows-x64, windows-x64-baseline, windows-arm64]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python for packaged eval
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Validate release inputs
        id: validate
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_DIST_TAG: ${{ inputs.dist_tag }}
        run: |
          VERSION="$INPUT_VERSION"
          DIST_TAG="$INPUT_DIST_TAG"

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$ ]]; then
            echo "::error::Invalid version: $VERSION"
            exit 1
          fi

          if [ -n "$DIST_TAG" ] && ! [[ "$DIST_TAG" =~ ^[a-z][a-z0-9-]*$ ]]; then
            echo "::error::Invalid dist_tag: $DIST_TAG"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "dist_tag=$DIST_TAG" >> "$GITHUB_OUTPUT"

      - name: Check if already published
        id: check
        env:
          VERSION: ${{ steps.validate.outputs.version }}
        run: |
          PLATFORM_KEY="${{ matrix.platform }}"
          PLATFORM_KEY="${PLATFORM_KEY//-/_}"
          
          # Check oh-my-opencode
          OC_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://registry.npmjs.org/oh-my-opencode-${{ matrix.platform }}/${VERSION}")
          # Check oh-my-openagent
          OA_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://registry.npmjs.org/oh-my-openagent-${{ matrix.platform }}/${VERSION}")
          
          echo "oh-my-opencode-${{ matrix.platform }}@${VERSION}: ${OC_STATUS}"
          echo "oh-my-openagent-${{ matrix.platform }}@${VERSION}: ${OA_STATUS}"
          
          if [ "$OC_STATUS" = "200" ]; then
            echo "skip_opencode=true" >> "$GITHUB_OUTPUT"
            echo "✓ oh-my-opencode-${{ matrix.platform }}@${VERSION} already published"
          else
            echo "skip_opencode=false" >> "$GITHUB_OUTPUT"
            echo "→ oh-my-opencode-${{ matrix.platform }}@${VERSION} needs publishing"
          fi
          
          if [ "$OA_STATUS" = "200" ]; then
            echo "skip_openagent=true" >> "$GITHUB_OUTPUT"
            echo "✓ oh-my-openagent-${{ matrix.platform }}@${VERSION} already published"
          else
            echo "skip_openagent=false" >> "$GITHUB_OUTPUT"
            echo "→ oh-my-openagent-${{ matrix.platform }}@${VERSION} needs publishing"
          fi
          
          # Skip build only if BOTH are already published
          if [ "$OC_STATUS" = "200" ] && [ "$OA_STATUS" = "200" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update version in package.json
        if: steps.check.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.validate.outputs.version }}
        run: |
          cd "packages/oh-my-opencode-${{ matrix.platform }}"
          jq --arg v "$VERSION" '.version = $v' package.json > tmp.json && mv tmp.json package.json

      - name: Set root package version
        if: steps.check.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.validate.outputs.version }}
        run: |
          jq --arg v "$VERSION" '.version = $v' package.json > tmp.json && mv tmp.json package.json

      - name: Build launcher
        if: steps.check.outputs.skip != 'true'
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 5
          max_attempts: 5
          retry_wait_seconds: 10
          shell: bash
          command: |
            PLATFORM="${{ matrix.platform }}"
            PACKAGE_DIR="packages/oh-my-opencode-${PLATFORM}"
            bun run build:binaries
            OUTPUT="${PACKAGE_DIR}/bin/oh-my-opencode.js"
            echo "Built launcher:"
            ls -lh "$OUTPUT"

      - name: Verify darwin launcher
        if: steps.check.outputs.skip != 'true' && startsWith(matrix.platform, 'darwin-')
        run: |
          LAUNCHER="packages/oh-my-opencode-${{ matrix.platform }}/bin/oh-my-opencode.js"
          file "$LAUNCHER"
          head -n 1 "$LAUNCHER" | grep -F "#!/usr/bin/env node"

      - name: Check release assets
        id: release-assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.validate.outputs.version }}
          OMO_AI_VERSION: ${{ inputs.omo_ai_version }}
          OPERATOR_DARWIN_ARTIFACTS: ${{ inputs.operator_darwin_artifacts }}
        run: |
          set -euo pipefail
          if ! [[ "$OMO_AI_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$ ]]; then
            echo "::error::Invalid omo_ai_version: $OMO_AI_VERSION"
            exit 1
          fi

          PLATFORM="${{ matrix.platform }}"
          # The operator-darwin job already uploaded this leg's verified release binary (#13921).
          if [ -n "${OPERATOR_DARWIN_ARTIFACTS:-}" ] && [[ "$PLATFORM" == darwin-* ]]; then
            echo "binary_exists=true" >> "$GITHUB_OUTPUT"
            echo "✓ omo-${PLATFORM} comes from verified operator-built artifacts ${OPERATOR_DARWIN_ARTIFACTS}"
            exit 0
          fi
          BINARY="omo-${PLATFORM}"
          if [[ "$PLATFORM" == windows-* ]]; then
            BINARY="omo-${PLATFORM}.exe"
          fi
          ENGINE_ASSET="$(bun script/release-desktop-engine-target.ts --target "$PLATFORM" | jq -r '.asset // empty')"

          # The binary lane has its own idempotency key: the release asset on
          # the GitHub release. An available target with a missing engine must
          # rebuild even when its omo executable is already present.
          if ASSET_NAMES="$(gh release view "v${VERSION}" --json assets --jq '.assets[].name' 2>/dev/null)"; then
            if grep -Fxq "$BINARY" <<<"$ASSET_NAMES" &&
               { [ -z "$ENGINE_ASSET" ] || grep -Fxq "$ENGINE_ASSET" <<<"$ASSET_NAMES"; }; then
              echo "binary_exists=true" >> "$GITHUB_OUTPUT"
              echo "✓ release assets ${BINARY} and ${ENGINE_ASSET:-unavailable engine} already exist on v${VERSION}"
            else
              echo "binary_exists=false" >> "$GITHUB_OUTPUT"
              echo "→ release asset ${BINARY} or ${ENGINE_ASSET:-unavailable engine} missing on v${VERSION}; building release binary"
            fi
          else
            echo "binary_exists=false" >> "$GITHUB_OUTPUT"
            echo "→ release v${VERSION} not found or lists no assets; building release binary"
          fi

      - name: Resolve desktop engine availability
        id: desktop-engine-target
        if: steps.release-assets.outputs.binary_exists != 'true'
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          TARGET_INFO="$(bun script/release-desktop-engine-target.ts --target "$PLATFORM")"
          {
            echo "host=$(jq -r '.host // empty' <<<"$TARGET_INFO")"
            echo "asset=$(jq -r '.asset // empty' <<<"$TARGET_INFO")"
            echo "source=$(jq -r '.source // empty' <<<"$TARGET_INFO")"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve engine trust helper availability
        id: engine-trust-helper-target
        if: steps.release-assets.outputs.binary_exists != 'true'
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          TARGET_INFO="$(bun script/release-desktop-engine-target.ts --trust-helper-target "$PLATFORM")"
          {
            echo "host=$(jq -r '.host // empty' <<<"$TARGET_INFO")"
            echo "asset=$(jq -r '.asset // empty' <<<"$TARGET_INFO")"
            echo "source=$(jq -r '.source // empty' <<<"$TARGET_INFO")"
          } >> "$GITHUB_OUTPUT"

      - name: Download desktop engine for compiled payload
        if: steps.desktop-engine-target.outputs.host != ''
        uses: actions/download-artifact@v8
        with:
          name: desktop-engine-${{ steps.desktop-engine-target.outputs.host }}
          path: .omo/desktop-engine-assets

      - name: Resolve git job helper availability
        id: git-job-helper-target
        if: steps.release-assets.outputs.binary_exists != 'true'
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          TARGET_INFO="$(bun script/release-desktop-engine-target.ts --git-job-helper-target "$PLATFORM")"
          {
            echo "host=$(jq -r '.host // empty' <<<"$TARGET_INFO")"
            echo "asset=$(jq -r '.asset // empty' <<<"$TARGET_INFO")"
            echo "source=$(jq -r '.source // empty' <<<"$TARGET_INFO")"
          } >> "$GITHUB_OUTPUT"

      # Like the trust helper, the git job helper travels in the desktop-engine artifact downloaded above.
      - name: Stage git job helper for compiled payload
        if: steps.git-job-helper-target.outputs.host != ''
        env:
          HELPER_ASSET: ${{ steps.git-job-helper-target.outputs.asset }}
          HELPER_SOURCE: ${{ steps.git-job-helper-target.outputs.source }}
        run: |
          set -euo pipefail
          test -f ".omo/desktop-engine-assets/$HELPER_ASSET"
          mkdir -p "$(dirname "$HELPER_SOURCE")"
          cp ".omo/desktop-engine-assets/$HELPER_ASSET" "$HELPER_SOURCE"
          chmod +x "$HELPER_SOURCE"

      # The helper travels in the desktop-engine artifact downloaded above.
      - name: Stage engine trust helper for compiled payload
        if: steps.engine-trust-helper-target.outputs.host != ''
        env:
          HELPER_ASSET: ${{ steps.engine-trust-helper-target.outputs.asset }}
          HELPER_SOURCE: ${{ steps.engine-trust-helper-target.outputs.source }}
        run: |
          set -euo pipefail
          test -f ".omo/desktop-engine-assets/$HELPER_ASSET"
          mkdir -p "$(dirname "$HELPER_SOURCE")"
          cp ".omo/desktop-engine-assets/$HELPER_ASSET" "$HELPER_SOURCE"
          chmod +x "$HELPER_SOURCE"

      - name: Stage target-specific Rust engine for compiled payload
        if: steps.desktop-engine-target.outputs.host != ''
        env:
          ENGINE_ASSET: ${{ steps.desktop-engine-target.outputs.asset }}
          ENGINE_SOURCE: ${{ steps.desktop-engine-target.outputs.source }}
        run: |
          set -euo pipefail
          test -f ".omo/desktop-engine-assets/$ENGINE_ASSET"
          mkdir -p "$(dirname "$ENGINE_SOURCE")"
          cp ".omo/desktop-engine-assets/$ENGINE_ASSET" "$ENGINE_SOURCE"
          chmod +x "$ENGINE_SOURCE"

      - name: Download keychain helper
        if: startsWith(matrix.platform, 'darwin-') && (steps.release-assets.outputs.binary_exists != 'true' || steps.check.outputs.skip != 'true')
        uses: actions/download-artifact@v8
        with:
          name: keychain-helper
          path: .omo/keychain-helper

      # build-omo-binary embeds packages/omo-native/bin/darwin/omo-keychain into every darwin binary (at
      # the payload root, so execDir/omo-keychain) and fails without it; the platform package ships the
      # same bytes as bin/omo-keychain.
      - name: Stage keychain helper
        if: startsWith(matrix.platform, 'darwin-') && (steps.release-assets.outputs.binary_exists != 'true' || steps.check.outputs.skip != 'true')
        env:
          PLATFORM: ${{ matrix.platform }}
          PACKAGE_SKIP: ${{ steps.check.outputs.skip }}
        run: |
          set -euo pipefail
          mkdir -p packages/omo-native/bin/darwin
          tar -xzpf .omo/keychain-helper/omo-keychain.tar.gz -C packages/omo-native/bin/darwin
          test -x packages/omo-native/bin/darwin/omo-keychain
          if [ "$PACKAGE_SKIP" != "true" ]; then
            mkdir -p "packages/oh-my-opencode-${PLATFORM}/bin"
            install -m 0755 packages/omo-native/bin/darwin/omo-keychain "packages/oh-my-opencode-${PLATFORM}/bin/omo-keychain"
          fi

      - name: Build release binary
        if: steps.release-assets.outputs.binary_exists != 'true'
        env:
          OMO_VERSION: ${{ steps.validate.outputs.version }}
          OMO_AI_VERSION: ${{ inputs.omo_ai_version }}
        run: |
          bun run script/build-omo-binary.ts \
            --target "${{ matrix.platform }}" \
            --omo-version "$OMO_VERSION" \
            --omo-ai-version "$OMO_AI_VERSION"
          echo "Built release binary:"
          ls -lh .omo/release-binaries/
        timeout-minutes: 45

      - name: Sign and notarize Darwin release binary
        if: steps.release-assets.outputs.binary_exists != 'true' && startsWith(matrix.platform, 'darwin-')
        timeout-minutes: 75
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          MACOS_SIGNING_REQUIRED: ${{ vars.MACOS_SIGNING_REQUIRED }}
          BINARY: omo-${{ matrix.platform }}
        run: |
          set -euo pipefail
          bash .github/scripts/macos-sign-and-notarize.sh \
            --identifier ai.sisyphuslabs.omo \
            --entitlements .github/scripts/omo-bun-executable.entitlements \
            ".omo/release-binaries/${BINARY}"
          # Signing rewrites the bytes the build step digested.
          (cd .omo/release-binaries && shasum -a 256 "$BINARY" > SHA256SUMS)

      - name: Smoke test release binary
        if: steps.release-assets.outputs.binary_exists != 'true'
        env:
          OMO_AI_VERSION: ${{ inputs.omo_ai_version }}
        run: |
          set -euo pipefail
          TARGET="${{ matrix.platform }}"
          EXE_SUFFIX=""
          if [[ "$TARGET" == windows-* ]]; then
            EXE_SUFFIX=".exe"
          fi
          BIN=".omo/release-binaries/omo-${TARGET}${EXE_SUFFIX}"
          ENGINE_PIN="$(jq -r '.dependencies["@code-yeongyu/senpi"]' packages/omo-native/package.json)"
          # Stamped version line, compared as a prefix: a missing sibling package.json
          # silently stamps 0.0.0, so the version and the engine pin are both compared.
          # The line continues past the pin with the engine build stamp (`; scheme epoch`
          # or `; scheme nodef`), which varies per build and is not pinned here.
          EXPECTED_VERSION_LINE="omo ${OMO_AI_VERSION} (engine: senpi ${ENGINE_PIN}"
          test -f "$BIN"

          isolate() {
            SMOKE_ROOT="$(mktemp -d)"
            mkdir -p "${SMOKE_ROOT}/home" "${SMOKE_ROOT}/agent" \
              "${SMOKE_ROOT}/xdg/config" "${SMOKE_ROOT}/xdg/data" \
              "${SMOKE_ROOT}/xdg/state" "${SMOKE_ROOT}/xdg/cache"
            export HOME="${SMOKE_ROOT}/home"
            export XDG_CONFIG_HOME="${SMOKE_ROOT}/xdg/config"
            export XDG_DATA_HOME="${SMOKE_ROOT}/xdg/data"
            export XDG_STATE_HOME="${SMOKE_ROOT}/xdg/state"
            export XDG_CACHE_HOME="${SMOKE_ROOT}/xdg/cache"
            export OMO_CODING_AGENT_DIR="${SMOKE_ROOT}/agent"
            # Node's Windows os.homedir() follows USERPROFILE; HOME alone is
            # only the Git Bash shell view and does not control provisioning.
            if [[ "$TARGET" == windows-* ]]; then
              export USERPROFILE="${HOME}"
            fi
          }

          assert_version_line() {
            local actual
            actual="$($BIN --version)"
            case "$actual" in
              "${EXPECTED_VERSION_LINE}"*")") ;;
              *)
                echo "version mismatch for ${TARGET}: expected '${EXPECTED_VERSION_LINE}...)', got '${actual}'"
                return 1
                ;;
            esac
          }

          assert_first_run_provisioned() {
            local provisioned="${HOME}/.omo/binary-runtime/${OMO_AI_VERSION}/omo${EXE_SUFFIX}"
            if [ ! -f "$provisioned" ]; then
              echo "first-run provisioning did not materialize ${provisioned}"
              return 1
            fi
          }

          assert_keychain_helper_provisioned() {
            local helper="${HOME}/.omo/binary-runtime/${OMO_AI_VERSION}/omo-keychain"
            if [ ! -x "$helper" ]; then
              echo "first-run provisioning did not materialize an executable ${helper}"
              return 1
            fi
            bun script/keychain-helper-release.ts verify "$helper"
          }

          pty_smoke() {
            # Round-trip the binary through a real pty on the pty-smoked legs.
            if [[ "${OSTYPE:-}" == darwin* ]]; then
              script -q /dev/null "$BIN" --version | tr -d '\r' | grep -F "$EXPECTED_VERSION_LINE"
            else
              script -qec "$BIN --version" /dev/null | tr -d '\r' | grep -F "$EXPECTED_VERSION_LINE"
            fi
          }

          oldstable_glibc_smoke() {
            # The binary must also run against a glibc older than the builder's.
            docker run --rm -v "${PWD}:/work" -w /work -e HOME=/tmp/omo-smoke-home \
              debian:oldstable sh -c "${BIN} --version" | grep -F "$EXPECTED_VERSION_LINE"
          }

          musl_smoke() {
            # musl binaries cannot run on the glibc runner: alpine container.
            docker run --rm -v "${PWD}:/work" -w /work -e HOME=/tmp/omo-smoke-home \
              alpine:3.21 sh -c "apk add --no-cache libstdc++ >/dev/null && ${BIN} --version" | grep -F "$EXPECTED_VERSION_LINE"
            # Mount the parent so the driver can rename the source checkout. --init gives the container a
            # PID 1 that reaps orphans; node as PID 1 leaves an exited host supervisor as a zombie.
            docker run --rm --init -v "${PWD}/..:/workspace" -w "/workspace/$(basename "$PWD")" \
              alpine:3.21 sh -c "apk add --no-cache libstdc++ python3 nodejs procps >/dev/null && node script/qa/omo-native-eval-smoke.mjs ${BIN}"
          }

          verify_checksum_and_size_only() {
            # No arm64 Windows runner exists: verify digest and size budget
            # without executing the binary.
            if [[ "$TARGET" == darwin-* ]]; then
              ( cd .omo/release-binaries && shasum -a 256 -c SHA256SUMS )
            else
              ( cd .omo/release-binaries && sha256sum -c SHA256SUMS )
            fi
            # Same 260 MiB budget as MAX_BINARY_BYTES in script/build-omo-binary.ts: it bounds the
            # download every install and update makes. Print the headroom; warn under 5 MiB.
            local size budget=272629760 warn=5242880
            size="$(wc -c < "$BIN")"
            if [ "$size" -gt "$budget" ]; then
              echo "release binary ${TARGET} exceeds the 260 MiB size budget (${size} bytes)"
              return 1
            fi
            local headroom=$(( budget - size ))
            if [ "$headroom" -lt "$warn" ]; then
              echo "::warning::release binary ${TARGET} is within 5 MiB of its size budget (${size} bytes, ${headroom} bytes headroom)"
            else
              echo "release binary ${TARGET}: ${size} bytes, ${headroom} bytes headroom under the 260 MiB budget"
            fi
          }

          case "$TARGET" in
            darwin-arm64)
              # arm64 macOS runner: native exec.
              isolate
              assert_version_line
              assert_first_run_provisioned
              assert_keychain_helper_provisioned
              pty_smoke
              ;;
            darwin-x64|darwin-x64-baseline)
              # Cross-compiled Darwin legs are digest/manifest checked, not native eval legs.
              verify_checksum_and_size_only
              ;;
            linux-x64|linux-x64-baseline)
              # x64 Linux runner: native exec; pty + oldstable-glibc legs on the main target.
              isolate
              assert_version_line
              assert_first_run_provisioned
              bun script/qa/omo-native-eval-smoke.mjs "$BIN"
              if [ "$TARGET" = "linux-x64" ]; then
                pty_smoke
                oldstable_glibc_smoke
              fi
              ;;
            linux-x64-musl|linux-x64-musl-baseline)
              isolate
              musl_smoke
              ;;
            linux-arm64|linux-arm64-musl)
              # The x64 runner cannot execute arm64 binaries; the
              # smoke-linux-arm64 job execs them on an arm64 runner.
              echo "${TARGET} smoke deferred to the smoke-linux-arm64 job"
              ;;
            windows-x64|windows-x64-baseline)
              # x64 Windows runner: native exec.
              isolate
              assert_version_line
              assert_first_run_provisioned
              # A fresh hosted runner reads the tool-cache Python cold: the first Python kernel start took
              # 3.2-9.5 s against a 10 s cell budget, and 0.25-0.4 s once warm (#10904). Import the stdlib
              # modules the kernel prelude loads before the smoke so its Python cell measures the kernel.
              bun script/qa/python-kernel-warmup.mjs
              bun script/qa/omo-native-eval-smoke.mjs "$BIN"
              ;;
            windows-arm64)
              # No arm64 Windows runner: digest and size budget only.
              verify_checksum_and_size_only
              ;;
            *)
              echo "::error::no smoke leg defined for ${TARGET}"
              exit 1
              ;;
          esac
        timeout-minutes: 20

      - name: Smoke eval registration in fresh binary
        if: steps.release-assets.outputs.binary_exists != 'true' && matrix.platform == 'darwin-arm64'
        run: |
          bun script/qa/omo-native-eval-smoke.mjs \
            --binary .omo/release-binaries/omo-darwin-arm64
        timeout-minutes: 5

      # The npm payload is uploaded only after this leg's release-binary smokes passed:
      # a failed smoke leaves this platform with no payload, so only its publish stops.
      - name: Compress binary
        if: steps.check.outputs.skip != 'true'
        run: |
          PLATFORM="${{ matrix.platform }}"
          PACKAGE_DIR="packages/oh-my-opencode-${PLATFORM}"
          cd "$PACKAGE_DIR"
          
          if [[ "$PLATFORM" == windows-* ]]; then
            # Windows: use 7z (pre-installed on windows-latest)
            7z a -tzip ../../binary-${PLATFORM}.zip bin/ package.json
          else
            # Unix: use tar.gz
            tar -czvf ../../binary-${PLATFORM}.tar.gz bin/ package.json
          fi
          
          cd ../..
          echo "Compressed artifact:"
          ls -lh binary-${PLATFORM}.*

      - name: Upload artifact
        if: steps.check.outputs.skip != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.platform }}
          path: |
            binary-${{ matrix.platform }}.tar.gz
            binary-${{ matrix.platform }}.zip
          retention-days: 1
          if-no-files-found: error

      - name: Upload release binary artifact
        if: steps.release-assets.outputs.binary_exists != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-binary-${{ matrix.platform }}
          path: .omo/release-binaries/omo-*
          retention-days: 1
          if-no-files-found: error

      - name: Write job summary
        if: always()
        shell: bash
        env:
          JOB_SUMMARY_TITLE: Platform build (${{ matrix.platform }})
          JOB_SUMMARY_STATUS: ${{ job.status }}
          JOB_SUMMARY_DETAILS: |
            - Validates release inputs for `${{ matrix.platform }}`.
            - Skips already-published platform packages.
            - Builds and uploads the launcher artifact when publishing is needed.
          JOB_SUMMARY_NEXT: Check validation output first, then the build launcher or artifact upload step for this platform.
        run: GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" bash .github/scripts/write-job-summary.sh

  publish:
    needs: [build, smoke-linux-arm64]
    if: always() && !cancelled() && github.repository == 'code-yeongyu/oh-my-openagent'
    # Pin until this release/deploy path is proven on Ubuntu 26.04: #9946.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      # Each matrix leg is an independent OIDC-provenance npm publish with no shared
      # state; the build matrix above already runs all 12 legs concurrently. 6 keeps
      # a conservative margin against npm burst limits while roughly halving the
      # publish wall time versus the previous value of 2.
      max-parallel: 6
      matrix:
        platform: [darwin-arm64, darwin-x64, darwin-x64-baseline, linux-x64, linux-x64-baseline, linux-arm64, linux-x64-musl, linux-x64-musl-baseline, linux-arm64-musl, windows-x64, windows-x64-baseline, windows-arm64]
    steps:
      - name: Require the linux-arm64 smoke for arm64 legs
        env:
          ARM64_SMOKE_RESULT: ${{ needs.smoke-linux-arm64.result }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          case "$PLATFORM" in
            linux-arm64*)
              if [ "$ARM64_SMOKE_RESULT" != "success" ]; then
                echo "::error::$PLATFORM is not published: the linux-arm64 release-binary smoke finished with '$ARM64_SMOKE_RESULT'"
                exit 1
              fi
              echo "$PLATFORM: linux-arm64 release-binary smoke passed"
              ;;
            *)
              echo "$PLATFORM: smoked in its own build leg"
              ;;
          esac

      - name: Validate release inputs
        id: validate
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_DIST_TAG: ${{ inputs.dist_tag }}
        run: |
          VERSION="$INPUT_VERSION"
          DIST_TAG="$INPUT_DIST_TAG"

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$ ]]; then
            echo "::error::Invalid version: $VERSION"
            exit 1
          fi

          if [ -n "$DIST_TAG" ] && ! [[ "$DIST_TAG" =~ ^[a-z][a-z0-9-]*$ ]]; then
            echo "::error::Invalid dist_tag: $DIST_TAG"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "dist_tag=$DIST_TAG" >> "$GITHUB_OUTPUT"

      - name: Check if already published
        id: check
        env:
          VERSION: ${{ steps.validate.outputs.version }}
        run: |
          OC_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://registry.npmjs.org/oh-my-opencode-${{ matrix.platform }}/${VERSION}")
          OA_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://registry.npmjs.org/oh-my-openagent-${{ matrix.platform }}/${VERSION}")
          
          if [ "$OC_STATUS" = "200" ]; then
            echo "skip_opencode=true" >> "$GITHUB_OUTPUT"
            echo "✓ oh-my-opencode-${{ matrix.platform }}@${VERSION} already published"
          else
            echo "skip_opencode=false" >> "$GITHUB_OUTPUT"
          fi
          
          if [ "$OA_STATUS" = "200" ]; then
            echo "skip_openagent=true" >> "$GITHUB_OUTPUT"
            echo "✓ oh-my-openagent-${{ matrix.platform }}@${VERSION} already published"
          else
            echo "skip_openagent=false" >> "$GITHUB_OUTPUT"
          fi
          
          # Need artifact if either package needs publishing
          if [ "$OC_STATUS" = "200" ] && [ "$OA_STATUS" = "200" ]; then
            echo "skip_all=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip_all=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download artifact
        id: download
        if: steps.check.outputs.skip_all != 'true'
        # A missing payload is decided by the next step with a clear reason, not by an opaque download error.
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: binary-${{ matrix.platform }}
          path: .

      - name: Require this platform's smoked payload
        if: steps.check.outputs.skip_all != 'true'
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          if [ -f "binary-$PLATFORM.tar.gz" ] || [ -f "binary-$PLATFORM.zip" ]; then
            echo "$PLATFORM: payload present, its release-binary smoke passed in this run"
          else
            echo "::error::$PLATFORM is not published: its npm payload was never uploaded, because this platform's release-binary smoke did not pass in this run"
            exit 1
          fi

      - name: Extract artifact
        if: steps.check.outputs.skip_all != 'true' && steps.download.outcome == 'success'
        run: |
          PLATFORM="${{ matrix.platform }}"
          PACKAGE_DIR="packages/oh-my-opencode-${PLATFORM}"
          mkdir -p "$PACKAGE_DIR"
          
          if [[ "$PLATFORM" == windows-* ]]; then
            unzip binary-${PLATFORM}.zip -d "$PACKAGE_DIR/"
          else
            tar -xzvf binary-${PLATFORM}.tar.gz -C "$PACKAGE_DIR/"
          fi
          
          echo "Extracted contents:"
          ls -la "$PACKAGE_DIR/"
          ls -la "$PACKAGE_DIR/bin/"

      - uses: actions/setup-node@v7
        if: steps.check.outputs.skip_all != 'true' && steps.download.outcome == 'success'
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm for trusted publishing (>=11.5.1)
        if: steps.check.outputs.skip_all != 'true' && steps.download.outcome == 'success'
        run: npm install -g npm@11.18.0

      - name: Strip token auth from .npmrc to force OIDC
        if: steps.check.outputs.skip_all != 'true' && steps.download.outcome == 'success'
        run: |
          for f in .npmrc "$HOME/.npmrc"; do
            if [ -f "$f" ]; then
              sed -i.bak '/_authToken/d' "$f"
              rm -f "$f.bak"
              echo "Cleaned $f"
            fi
          done

      # A failed publish must fail the job (no continue-on-error), or `gh run rerun --failed` never retries
      # it and publish-main only finds the gap at its registry check. Only the TLOG 409 is retried (at most twice): Sigstore can
      # store an entry, answer npm's first POST with a 5xx, then refuse the re-POST of the same signature with
      # TLOG_CREATE_ENTRY_ERROR "(409) an equivalent entry already exists", which aborts before the upload. A fresh
      # publish signs anew, so the retry keeps provenance; only a second 409 falls back to no provenance.
      - name: Write npm publish helper
        if: steps.check.outputs.skip_all != 'true' && steps.download.outcome == 'success'
        run: |
          cat > "$RUNNER_TEMP/npm-publish.sh" <<'HELPER'
          set -uo pipefail
          dist_tag="${1:-}"
          args=(--access public --loglevel verbose)
          if [ -n "$dist_tag" ]; then
            args+=(--tag "$dist_tag")
          fi
          log="$(mktemp)"
          trap 'rm -f "$log"' EXIT
          is_tlog_409() {
            grep -q "TLOG_CREATE_ENTRY_ERROR" "$log" && grep -q "equivalent entry already exists" "$log"
          }
          on_registry() {
            local name version
            name="$(node -p "require('./package.json').name")"
            version="$(node -p "require('./package.json').version")"
            [ "$(npm view "${name}@${version}" version 2>/dev/null)" = "$version" ]
          }
          NPM_CONFIG_PROVENANCE=true npm publish "${args[@]}" --provenance 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          [ "$status" -eq 0 ] && exit 0
          is_tlog_409 || exit "$status"
          on_registry && { echo "already on the registry after the TLOG 409"; exit 0; }
          echo "::warning::Sigstore refused a re-sent transparency-log entry (409); retrying once with a fresh provenance signature"
          NPM_CONFIG_PROVENANCE=true npm publish "${args[@]}" --provenance 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          [ "$status" -eq 0 ] && exit 0
          is_tlog_409 || exit "$status"
          on_registry && { echo "already on the registry after the TLOG 409"; exit 0; }
          echo "::warning::the provenance retry hit the same TLOG 409; publishing once more without provenance"
          NPM_CONFIG_PROVENANCE=false npm publish "${args[@]}" --provenance=false
          exit $?
          HELPER

      - name: Publish oh-my-opencode-${{ matrix.platform }}
        if: steps.check.outputs.skip_opencode != 'true' && steps.download.outcome == 'success'
        env:
          DIST_TAG: ${{ steps.validate.outputs.dist_tag }}
        run: |
          cd "packages/oh-my-opencode-${{ matrix.platform }}"
          bash "$RUNNER_TEMP/npm-publish.sh" "$DIST_TAG"
        timeout-minutes: 15

      - name: Publish oh-my-openagent-${{ matrix.platform }}
        if: always() && steps.check.outputs.skip_openagent != 'true' && steps.download.outcome == 'success'
        env:
          DIST_TAG: ${{ steps.validate.outputs.dist_tag }}
        run: |
          cd "packages/oh-my-opencode-${{ matrix.platform }}"

          # Rename package for oh-my-openagent
          jq --arg name "oh-my-openagent-${{ matrix.platform }}" \
             --arg desc "Platform-specific binary for oh-my-openagent (${{ matrix.platform }})" \
             '.name = $name | .description = $desc' \
             package.json > tmp.json && mv tmp.json package.json

          bash "$RUNNER_TEMP/npm-publish.sh" "$DIST_TAG"
        timeout-minutes: 15

      - name: Write job summary
        if: always()
        env:
          JOB_SUMMARY_DIST_TAG: ${{ inputs.dist_tag || 'latest' }}
        run: |
          {
            echo "## Platform publish (${{ matrix.platform }})"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Result | \`${{ job.status }}\` |"
            echo "| Workflow | \`${{ github.workflow }}\` |"
            echo "| Platform | \`${{ matrix.platform }}\` |"
            echo "| Dist tag | \`$JOB_SUMMARY_DIST_TAG\` |"
            echo
            echo "### What this job checks"
            echo
            echo "- Rechecks whether platform packages are already published."
            echo "- Downloads the matching build artifact only when needed."
            echo "- Publishes legacy and renamed platform packages with trusted publishing."
            echo
            echo "### If this fails"
            echo
            echo "Check artifact download status, npm trusted publishing, and the package-specific publish log."
          } >> "$GITHUB_STEP_SUMMARY"

  # =============================================================================
  # Job 3: Smoke linux-arm64 release binaries on a native arm64 runner
  # - The build matrix compiles these legs on x64 (cross-compile), so they need
  #   a real arm64 host to execute: the glibc binary runs natively on
  #   ubuntu-24.04-arm and the musl binary runs in an alpine container.
  # - If the arm64 runner label is unavailable the job fails: intended hard
  #   signal, no silent fallback.
  # =============================================================================
  smoke-linux-arm64:
    needs: build
    # Runs even when an unrelated build leg failed, so a windows failure cannot block
    # the arm64 publishes; a failed arm64 build still fails here (its artifact is missing).
    if: always() && !cancelled() && github.repository == 'code-yeongyu/oh-my-openagent'
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check release assets
        id: release-assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          for LEG in linux-arm64 linux-arm64-musl; do
            if ASSET_NAMES="$(gh release view "v${VERSION}" --json assets --jq '.assets[].name' 2>/dev/null)"; then
              if grep -Fxq "omo-${LEG}" <<<"$ASSET_NAMES"; then
                echo "${LEG//-/_}_exists=true" >> "$GITHUB_OUTPUT"
                echo "✓ release asset omo-${LEG} already exists on v${VERSION}"
                continue
              fi
            fi
            echo "${LEG//-/_}_exists=false" >> "$GITHUB_OUTPUT"
            echo "→ release asset omo-${LEG} missing on v${VERSION}; smoking it"
          done

      - name: Download linux-arm64 release binary artifact
        if: steps.release-assets.outputs.linux_arm64_exists != 'true'
        uses: actions/download-artifact@v8
        with:
          name: release-binary-linux-arm64
          path: .omo/release-binaries

      - name: Download linux-arm64-musl release binary artifact
        if: steps.release-assets.outputs.linux_arm64_musl_exists != 'true'
        uses: actions/download-artifact@v8
        with:
          name: release-binary-linux-arm64-musl
          path: .omo/release-binaries

      - name: Smoke linux-arm64 binaries
        if: steps.release-assets.outputs.linux_arm64_exists != 'true' || steps.release-assets.outputs.linux_arm64_musl_exists != 'true'
        env:
          OMO_AI_VERSION: ${{ inputs.omo_ai_version }}
          GLIBC_EXISTS: ${{ steps.release-assets.outputs.linux_arm64_exists }}
          MUSL_EXISTS: ${{ steps.release-assets.outputs.linux_arm64_musl_exists }}
        run: |
          set -euo pipefail
          ENGINE_PIN="$(jq -r '.dependencies["@code-yeongyu/senpi"]' packages/omo-native/package.json)"
          # Prefix through the engine pin; the line continues with the engine build
          # stamp (`; scheme epoch` or `; scheme nodef`), which varies per build.
          EXPECTED_VERSION_LINE="omo ${OMO_AI_VERSION} (engine: senpi ${ENGINE_PIN}"

          isolate() {
            SMOKE_ROOT="$(mktemp -d)"
            mkdir -p "${SMOKE_ROOT}/home" "${SMOKE_ROOT}/agent" \
              "${SMOKE_ROOT}/xdg/config" "${SMOKE_ROOT}/xdg/data" \
              "${SMOKE_ROOT}/xdg/state" "${SMOKE_ROOT}/xdg/cache"
            export HOME="${SMOKE_ROOT}/home"
            export XDG_CONFIG_HOME="${SMOKE_ROOT}/xdg/config"
            export XDG_DATA_HOME="${SMOKE_ROOT}/xdg/data"
            export XDG_STATE_HOME="${SMOKE_ROOT}/xdg/state"
            export XDG_CACHE_HOME="${SMOKE_ROOT}/xdg/cache"
            export OMO_CODING_AGENT_DIR="${SMOKE_ROOT}/agent"
          }

          if [ "$GLIBC_EXISTS" != "true" ]; then
            # Native arm64 exec (glibc).
            chmod +x .omo/release-binaries/omo-linux-arm64
            isolate
            actual="$(.omo/release-binaries/omo-linux-arm64 --version)"
            case "$actual" in
              "${EXPECTED_VERSION_LINE}"*")") ;;
              *)
                echo "version mismatch for omo-linux-arm64: expected '${EXPECTED_VERSION_LINE}...)', got '${actual}'"
                exit 1
                ;;
            esac
            test -f "${HOME}/.omo/binary-runtime/${OMO_AI_VERSION}/omo"
            bun script/qa/omo-native-eval-smoke.mjs .omo/release-binaries/omo-linux-arm64
          fi

          if [ "$MUSL_EXISTS" != "true" ]; then
            # alpine container for the musl binary.
            docker run --rm -v "${PWD}:/work" -w /work -e HOME=/tmp/omo-smoke-home \
              alpine:3.21 sh -c "apk add --no-cache libstdc++ >/dev/null && chmod +x .omo/release-binaries/omo-linux-arm64-musl && .omo/release-binaries/omo-linux-arm64-musl --version" \
              | grep -F "$EXPECTED_VERSION_LINE"
            docker run --rm --init -v "${PWD}/..:/workspace" -w "/workspace/$(basename "$PWD")" \
              alpine:3.21 sh -c "apk add --no-cache libstdc++ python3 nodejs procps >/dev/null && node script/qa/omo-native-eval-smoke.mjs .omo/release-binaries/omo-linux-arm64-musl"
          fi

      - name: Write job summary
        if: always()
        shell: bash
        env:
          JOB_SUMMARY_TITLE: Release-binary smoke (linux-arm64)
          JOB_SUMMARY_STATUS: ${{ job.status }}
          JOB_SUMMARY_DETAILS: |
            - Downloads the linux-arm64 and linux-arm64-musl release binaries.
            - Execs the glibc binary natively and the musl binary in an alpine container.
            - Asserts the exact stamped version line and the provisioned runtime.
          JOB_SUMMARY_NEXT: Check the smoke step output for the failing target or version line.
        run: GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" bash .github/scripts/write-job-summary.sh
        timeout-minutes: 15
