name: Computer spike SP-N (Windows)

# Measures the SP-N ledger rows on a hosted Windows desktop. Runs on
# workflow_dispatch and on a pull request the shared platform decision admits
# (pr-platform-decision.yml, #13859); the first step proves the job has an interactive desktop
# (OpenInputDesktop succeeds and the session id is not 0) and the probe exits
# naming that precondition otherwise. The ledger is uploaded as an artifact;
# rows are committed to the repository only by the spike's own pull request.

on:
  pull_request:
    branches: [master, dev]
    paths:
      - "crates/omo-computer-backend-win32/probes/**"
      - ".github/workflows/computer-spike-windows.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  platform:
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/pr-platform-decision.yml

  sp-n:
    name: computer spike SP-N (windows-latest)
    needs: platform
    # macOS/Windows only when the shared platform decision allows it (pr-platform-decision.yml, #13859).
    if: needs.platform.outputs.full_matrix == 'true'
    runs-on: windows-latest
    # 2 passes x 895 s + overhead + reserve, 10 % kept free (the self-test checks it)
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      # The precompiled native assembly lives under the runner temp dir, outside the checkout (sp-n.ps1 -NativeDir;
      # probe-sp-n.ts passes it). Set here, not in job env: the runner context is not available at job level.
      - name: Native assembly directory under the runner temp dir
        shell: pwsh
        run: '"SPN_NATIVE_DIR=$env:RUNNER_TEMP\spn-native" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      # The helper's native type, compiled once here into $SPN_NATIVE_DIR/sp-n-native.dll (sha256 recorded beside it and
      # checked by every leg before loading), so no leg compiles at run time.
      - name: Precompile the SP-N native assembly
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File crates/omo-computer-backend-win32/probes/sp-n.ps1 -Leg build-native

      - name: Interactive desktop precondition
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File crates/omo-computer-backend-win32/probes/sp-n.ps1 -Leg precondition

      - name: Measure SP-N
        shell: pwsh
        run: bun crates/omo-computer-backend-win32/probes/probe-sp-n.ts --measure --out "$env:RUNNER_TEMP/win32-delivery.tsv" --host "hosted windows-latest"

      - name: Verify SP-N against the fresh measurement
        shell: pwsh
        run: bun crates/omo-computer-backend-win32/probes/probe-sp-n.ts --verify "$env:RUNNER_TEMP/win32-delivery.tsv" --host "hosted windows-latest"

      - name: Upload ledger
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sp-n-win32-delivery
          path: ${{ runner.temp }}/win32-delivery.tsv
          if-no-files-found: warn

      - name: Write job summary
        if: always()
        shell: bash
        env:
          JOB_SUMMARY_TITLE: Computer spike SP-N (Windows)
          JOB_SUMMARY_STATUS: ${{ job.status }}
          JOB_SUMMARY_DETAILS: |
            - Precompiles the helper's native assembly, proves an interactive desktop, then measures the SP-N rows and verifies them against a second pass.
            - The ledger is uploaded, never committed here; rows land only through the spike's own pull request.
          JOB_SUMMARY_NEXT: Open the sp-n-win32-delivery artifact for the measured ledger TSV.
        run: |
          GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" bash .github/scripts/write-job-summary.sh
