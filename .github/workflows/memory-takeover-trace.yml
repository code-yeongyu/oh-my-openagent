name: Memory takeover trace

# Measurement only (#10959): runs the SIGKILL takeover test N times per OS with the OMO_TAKEOVER_TRACE timeline on,
# and writes a phase table to the job summary. Windows is the subject; Linux and macOS are the baselines.
on:
  pull_request:
    paths:
      - .github/workflows/memory-takeover-trace.yml
      - packages/memory-core/src/concurrency/takeover-trace.test-support.ts
      - packages/memory-core/src/concurrency/sigkill-takeover.test.ts
      - packages/memory-core/src/concurrency/writer-child.ts
      - packages/memory-core/src/concurrency/two-process-kit.test-support.ts
      - script/takeover-trace-summary.ts
  workflow_dispatch:
    inputs:
      iterations:
        description: Number of runs of the takeover test per OS
        required: true
        default: 20
        type: number
      test_ref:
        description: Git ref whose repository contents should be tested
        required: false
        type: string

permissions:
  contents: read

jobs:
  trace:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-26.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.test_ref || github.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run the takeover test repeatedly with the trace on
        id: runs
        shell: bash
        env:
          ITERATIONS: ${{ inputs.iterations || 20 }}
        run: |
          trace_dir="$RUNNER_TEMP/takeover-trace"
          mkdir -p "$trace_dir"
          failed=0
          for i in $(seq 1 "$ITERATIONS"); do
            if OMO_TAKEOVER_TRACE="$trace_dir/run-$i.jsonl" bun test packages/memory-core/src/concurrency/sigkill-takeover.test.ts -t "lands every remaining commit cleanly" > "$trace_dir/run-$i.log" 2>&1; then
              echo "run $i: pass"
            else
              echo "run $i: FAIL"
              failed=$((failed + 1))
            fi
          done
          echo "failed=$failed" >> "$GITHUB_OUTPUT"
          echo "trace_dir=$trace_dir" >> "$GITHUB_OUTPUT"

      - name: Write job summary
        if: always() && steps.runs.outputs.trace_dir != ''
        shell: bash
        run: bun script/takeover-trace-summary.ts "${{ steps.runs.outputs.trace_dir }}" "${{ matrix.os }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload timelines
        if: always() && steps.runs.outputs.trace_dir != ''
        uses: actions/upload-artifact@v4
        with:
          name: takeover-trace-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.runs.outputs.trace_dir }}
          retention-days: 1

      - name: Fail when any run failed
        if: steps.runs.outputs.failed != '0'
        shell: bash
        env:
          FAILED: ${{ steps.runs.outputs.failed }}
        run: |
          echo "::error::$FAILED takeover run(s) failed; see the job summary and the uploaded timelines"
          exit 1
