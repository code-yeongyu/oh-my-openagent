name: Lint Workflows

on:
  push:
    paths:
      - '.github/workflows/**'
  pull_request:
    paths:
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install actionlint
        env:
          # Anonymous raw.githubusercontent.com requests from shared runner IPs
          # are throttled to HTTP 429. The authenticated contents API draws from
          # the token quota instead, so the pinned installer fetch is stable.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header "Accept: application/vnd.github.raw+json" \
            --output download-actionlint.bash \
            "https://api.github.com/repos/rhysd/actionlint/contents/scripts/download-actionlint.bash?ref=v1.7.10"
          bash download-actionlint.bash 1.7.10

      - name: Run actionlint
        run: ./actionlint -color -shellcheck=""

      - name: Write job summary
        if: always()
        shell: bash
        env:
          JOB_SUMMARY_TITLE: Workflow lint
          JOB_SUMMARY_STATUS: ${{ job.status }}
          JOB_SUMMARY_DETAILS: |
            - Downloads the pinned actionlint release.
            - Validates every workflow changed in this repository.
          JOB_SUMMARY_NEXT: Fix the first actionlint diagnostic; most failures point to an exact workflow line.
        run: GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" bash .github/scripts/write-job-summary.sh
