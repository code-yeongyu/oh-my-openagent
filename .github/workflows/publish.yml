name: publish
run-name: "${{ format('release {0}', inputs.version || inputs.bump) }}"

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Bump major, minor, or patch"
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
      version:
        description: "Override version (e.g., 3.0.0-beta.6). Takes precedence over bump."
        required: false
        type: string
      source_sha:
        description: "Stamp this full commit SHA instead of the dispatch branch head. Requires an ancestor of dev with green push CI."
        required: false
        type: string
      skip_platform:
        description: "Skip platform binary packages"
        required: false
        type: boolean
        default: false
      publish_lazycodex:
        description: "Publish the lazycodex-ai npm alias"
        required: false
        type: boolean
        default: true
      lazycodex_only:
        description: "Publish only LazyCodex from the base head, without stamping or publishing omo packages. Requires a reserved version such as 5.0.0-beta.62.lazycodex.1 or 5.0.0-lazycodex.1."
        required: false
        type: boolean
        default: false
      prepared_release_sha:
        description: "Internal: exact prepared source SHA for the provenance-bearing publish run."
        required: false
        type: string
      source_ci_run:
        description: "Internal: id of the ci.yml run the parent release dispatched for source_sha; revalidated here, used only with prepared_release_sha."
        required: false
        type: string
      ci_basis_receipt:
        description: "Maintainer-only: id of an exact-head CI basis receipt that waives the hosted ci.yml wait in gate-reuse. Requires prepared_release_sha and ci_basis_head. Leave empty to wait for hosted CI."
        required: false
        type: string
        default: ""
      ci_basis_head:
        description: "Maintainer-only: the 40-hex commit the ci_basis_receipt covers; must be prepared_release_sha or an ancestor of it that differs only under .github/workflows/."
        required: false
        type: string
        default: ""
      operator_darwin_artifacts:
        description: "Maintainer-only: draft release operator-darwin-<12 hex> holding operator-built, signed and notarized darwin artifacts. Replaces the hosted macOS legs of publish-platform. Requires prepared_release_sha and operator_darwin_manifest_sha256. Leave empty for the hosted legs."
        required: false
        type: string
        default: ""
      operator_darwin_manifest_sha256:
        description: "Maintainer-only: sha256 of that release's operator-darwin-manifest.json, as the operator printed it. The run refuses any other manifest, so a later edit of the draft cannot swap artifacts. Leave empty for the hosted legs."
        required: false
        type: string
        default: ""

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  id-token: write
  actions: write

jobs:
  # A pinned release owns the CI run its gate waits on (#15094). ci.yml keeps only the newest pending dev push run, so
  # a later merge could cancel the pin's push run while it waits; a run dispatched on its own ref is alone in its
  # concurrency group. The source is admitted (read-only) before anything is written or dispatched. The ref name
  # carries this release attempt (release-ci/<sha>-<run id>-<attempt>), so no other release shares or deletes it, and
  # the dispatch API returns the run it created, so the run is known by id, never inferred. GITHUB_TOKEN creates the
  # ref (which starts no push run) and dispatches. Skipped when the pin's ci.yml predates the dispatch trigger.
  pin-ci:
    if: inputs.source_sha != '' && inputs.prepared_release_sha == '' && inputs.lazycodex_only != true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write
    outputs:
      ref_owned: ${{ steps.pin.outputs.ref_owned }}
      ci_run_id: ${{ steps.pin.outputs.ci_run_id }}
      ci_ref: ${{ steps.pin.outputs.ci_ref }}
      dispatch_attempted: ${{ steps.pin.outputs.dispatch_attempted }}
      source_sha: ${{ steps.pin.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Dispatch CI on the pinned source's own ref
        id: pin
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          LAZYCODEX_ONLY: ${{ inputs.lazycodex_only }}
          CI_BASIS_RECEIPT: ${{ inputs.ci_basis_receipt }}
          PREPARED_RELEASE_SHA: ${{ inputs.prepared_release_sha }}
        run: |
          set -euo pipefail
          source .github/scripts/release-source-admission.sh
          admit_release_source
          echo "source_sha=${SOURCE_SHA}" >> "$GITHUB_OUTPUT"
          triggers="$(gh api -H "Accept: application/vnd.github.raw+json" "repos/${GH_REPO}/contents/.github/workflows/ci.yml?ref=${SOURCE_SHA}" \
            | yq -o=json | jq -c '.on | keys')"
          if ! jq -e 'index("workflow_dispatch")' <<< "$triggers" > /dev/null; then
            echo "ci.yml at ${SOURCE_SHA} has no workflow_dispatch trigger (${triggers}); gate-reuse waits for its dev push run."
            exit 0
          fi
          ref="release-ci/${SOURCE_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "ci_ref=${ref}" >> "$GITHUB_OUTPUT"
          # The name is this attempt's alone, so cleanup is registered before the create: whatever its answer, unpin-ci
          # reconciles the ref (deletes it only while it names the source) and any run on it.
          echo "ref_owned=true" >> "$GITHUB_OUTPUT"
          if ! gh api --method POST "repos/${GH_REPO}/git/refs" -f ref="refs/heads/${ref}" -f sha="$SOURCE_SHA" > /dev/null; then
            # The ref exists only if this POST created it before its answer was lost.
            existing="$(gh api "repos/${GH_REPO}/git/ref/heads/${ref}" --jq .object.sha || true)"
            if [ "$existing" != "$SOURCE_SHA" ]; then
              echo "::error::Could not create refs/heads/${ref} at ${SOURCE_SHA} (it reads '${existing}')."
              exit 1
            fi
          fi
          # No retry: a repeated dispatch could start a second run nobody records. A lost answer fails the release, and
          # unpin-ci then looks for the run it may have started.
          echo "dispatch_attempted=true" >> "$GITHUB_OUTPUT"
          run_id="$(gh api --method POST "repos/${GH_REPO}/actions/workflows/ci.yml/dispatches" -f ref="$ref" -F return_run_details=true --jq '.workflow_run_id // empty')"
          if ! [[ "$run_id" =~ ^[0-9]+$ ]]; then
            echo "::error::Dispatching ci.yml on ${ref} returned no run id ('${run_id}')."
            exit 1
          fi
          echo "ci_run_id=${run_id}" >> "$GITHUB_OUTPUT"
          echo "Dispatched ci.yml on ${ref}: run ${run_id}." >> "$GITHUB_STEP_SUMMARY"

      - name: Write job summary
        if: always()
        shell: bash
        env:
          JOB_SUMMARY_TITLE: Release CI pin
          JOB_SUMMARY_STATUS: ${{ job.status }}
          JOB_SUMMARY_DETAILS: |
            - Admits the pinned source, creates this attempt's release-ci/<sha>-<run>-<attempt> ref and dispatches ci.yml there, recording the run id the dispatch returned (#15094).
            - Skipped when the pin's ci.yml has no workflow_dispatch trigger; gate-reuse then waits for the dev push run.
          JOB_SUMMARY_NEXT: If this failed, read the admission or dispatch error above; unpin-ci removes the ref and any run it started.
        run: GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" bash .github/scripts/write-job-summary.sh

  gate-reuse:
    needs: [pin-ci]
    # pin-ci is skipped for every release that is not a pinned parent run; that must not skip this gate.
    if: ${{ !failure() && !cancelled() }}
    # Pin until this release/deploy path is proven on Ubuntu 26.04: #9932.
    runs-on: ubuntu-24.04
    outputs:
      exact_stamp_ci: ${{ steps.source_ci.outputs.exact_stamp_ci }}
    permissions:
      actions: read
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: ${{ inputs.source_sha && '0' || '1' }}

      # Operator-built darwin artifacts (#13921) replace the hosted macOS legs only for a maintainer on the
      # prepared-source run. An empty input never enters the block.
      - name: Refuse inadmissible operator darwin artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPERATOR_DARWIN_ARTIFACTS: ${{ inputs.operator_darwin_artifacts }}
          OPERATOR_DARWIN_MANIFEST_SHA256: ${{ inputs.operator_darwin_manifest_sha256 }}
          PREPARED_RELEASE_SHA: ${{ inputs.prepared_release_sha }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "$OPERATOR_DARWIN_ARTIFACTS" ]; then
            if [ -n "$OPERATOR_DARWIN_MANIFEST_SHA256" ]; then
              echo "::error::operator_darwin_artifacts refused: operator_darwin_manifest_sha256 is set without operator_darwin_artifacts."
              exit 1
            fi
            echo "operator_darwin_artifacts is empty; publish-platform uses the hosted macOS legs."
            exit 0
          fi
          LC_ALL=C
          if [ -z "$PREPARED_RELEASE_SHA" ]; then
            echo "::error::operator_darwin_artifacts refused: prepared_release_sha is empty; operator-built darwin artifacts only apply to the prepared-source publish run."
            exit 1
          fi
          if ! [[ "$PREPARED_RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::operator_darwin_artifacts refused: prepared_release_sha must be a full 40-character lowercase hex commit SHA."
            exit 1
          fi
          if ! [[ "$OPERATOR_DARWIN_ARTIFACTS" =~ ^operator-darwin-[0-9a-f]{12}$ ]]; then
            echo "::error::operator_darwin_artifacts refused: it must be operator-darwin-<12 lowercase hex of the source commit>."
            exit 1
          fi
          if ! [[ "$OPERATOR_DARWIN_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::operator_darwin_artifacts refused: operator_darwin_manifest_sha256 must be the 64 lowercase hex sha256 of the staged operator-darwin-manifest.json."
            exit 1
          fi
          for login in "$ACTOR" "$TRIGGERING_ACTOR"; do
            if ! [[ "$login" =~ ^[A-Za-z0-9][A-Za-z0-9-]{0,38}$ ]]; then
              echo "::error::operator_darwin_artifacts refused: actor '${login}' is not a GitHub user login and cannot be a maintainer."
              exit 1
            fi
            if ! role="$(gh api "repos/${REPOSITORY}/collaborators/${login}/permission" --jq '.role_name')"; then
              echo "::error::operator_darwin_artifacts refused: could not read the repository permission of ${login}."
              exit 1
            fi
            if [ "$role" != "admin" ] && [ "$role" != "maintain" ]; then
              echo "::error::operator_darwin_artifacts refused: ${login} has repository role '${role}'; only admin or maintain may replace the hosted macOS legs."
              exit 1
            fi
          done
          {
            echo "### Darwin artifacts: OPERATOR-BUILT"
            echo "- Staging release: \`${OPERATOR_DARWIN_ARTIFACTS}\` (manifest sha256 \`${OPERATOR_DARWIN_MANIFEST_SHA256}\`); prepared source: \`${PREPARED_RELEASE_SHA}\`."
            echo "- Dispatched by \`${ACTOR}\` (triggered by \`${TRIGGERING_ACTOR}\`); publish-platform verifies every artifact before use."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "operator_darwin_artifacts ${OPERATOR_DARWIN_ARTIFACTS} admitted for ${ACTOR}."

      # Pull requests run Linux only (#13802); a macOS/Windows job that fails on dev opens the ci:platform-red
      # issue (platform-red-tracker.yml). Both the release cut and the publish run refuse while it is open.
      - name: Refuse while a dev macOS/Windows job is red
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          open="$(gh issue list --label ci:platform-red --state open --json number,url --jq '.[] | "#\(.number) \(.url)"')"
          if [ -n "$open" ]; then
            echo "::error::A macOS/Windows job is red on dev; fix it (or close the issue with the reason) before releasing: $open"
            exit 1
          fi
          echo "No open ci:platform-red issue."

      - name: Require successful CI for prepared release source
        id: source_ci
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          LAZYCODEX_ONLY: ${{ inputs.lazycodex_only }}
          PREPARED_RELEASE_SHA: ${{ inputs.prepared_release_sha }}
          CI_BASIS_RECEIPT: ${{ inputs.ci_basis_receipt }}
          CI_BASIS_HEAD: ${{ inputs.ci_basis_head }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_CI_RUN: ${{ needs.pin-ci.outputs.ci_run_id || (inputs.prepared_release_sha != '' && inputs.source_ci_run) || '' }}
          RELEASE_CI_REF: ${{ needs.pin-ci.outputs.ci_ref }}
        run: |
          set -euo pipefail

          if [ -n "$SOURCE_SHA" ]; then
            source .github/scripts/release-source-admission.sh
            admit_release_source
          fi

          # Explicit, logged waiver of the hosted CI wait. An empty receipt keeps the default path below.
          if [ -n "$CI_BASIS_RECEIPT" ]; then
            LC_ALL=C # code-point ranges for the shape checks; this block always exits.
            # An explicit space-to-tilde range, not [[:print:]]: Git Bash on Windows still classifies UTF-8 characters
            # under LC_ALL=C, so [[:print:]] accepted a non-ASCII receipt there (#13955).
            if [ "${#CI_BASIS_RECEIPT}" -gt 128 ] || [[ "$CI_BASIS_RECEIPT" == *[!\ -~]* ]]; then
              echo "::error::ci_basis_receipt refused: it must be 1-128 printable ASCII characters with no newline or control character."
              exit 1
            fi
            if [ -z "$PREPARED_RELEASE_SHA" ]; then
              echo "::error::ci_basis_receipt refused: prepared_release_sha is empty; the waiver only applies to the prepared-source publish run."
              exit 1
            fi
            if ! [[ "$PREPARED_RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::ci_basis_receipt refused: prepared_release_sha must be a full 40-character lowercase hex commit SHA."
              exit 1
            fi
            if ! [[ "$CI_BASIS_HEAD" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::ci_basis_receipt refused: ci_basis_head must be a full 40-character lowercase hex commit SHA."
              exit 1
            fi
            for login in "$ACTOR" "$TRIGGERING_ACTOR"; do
              if ! [[ "$login" =~ ^[A-Za-z0-9][A-Za-z0-9-]{0,38}$ ]]; then
                echo "::error::ci_basis_receipt refused: actor '${login}' is not a GitHub user login and cannot be a maintainer."
                exit 1
              fi
              if ! role="$(gh api "repos/${REPOSITORY}/collaborators/${login}/permission" --jq '.role_name')"; then
                echo "::error::ci_basis_receipt refused: could not read the repository permission of ${login}."
                exit 1
              fi
              if [ "$role" != "admin" ] && [ "$role" != "maintain" ]; then
                echo "::error::ci_basis_receipt refused: ${login} has repository role '${role}'; only admin or maintain may waive hosted CI."
                exit 1
              fi
            done
            # The receipt covers ci_basis_head; the prepared source may add workflow-only commits on top of it.
            # The fetch depth bounds the ancestry search; an ancestor beyond it is refused, never assumed.
            if ! git fetch --no-tags --depth=200 origin "$CI_BASIS_HEAD" "$PREPARED_RELEASE_SHA"; then
              echo "::error::ci_basis_receipt refused: could not fetch ci_basis_head ${CI_BASIS_HEAD} and prepared_release_sha ${PREPARED_RELEASE_SHA}."
              exit 1
            fi
            if ! git merge-base --is-ancestor "$CI_BASIS_HEAD" "$PREPARED_RELEASE_SHA"; then
              echo "::error::ci_basis_receipt refused: ci_basis_head ${CI_BASIS_HEAD} is not an ancestor of prepared_release_sha ${PREPARED_RELEASE_SHA} within 200 commits."
              exit 1
            fi
            delta="$(git diff --no-renames --name-only "$CI_BASIS_HEAD" "$PREPARED_RELEASE_SHA" --)"
            outside="$(grep -v '^\.github/workflows/' <<< "$delta" || true)"
            if [ -n "$outside" ]; then
              echo "::error::ci_basis_receipt refused: ${CI_BASIS_HEAD}..${PREPARED_RELEASE_SHA} changes files outside .github/workflows/: $(tr '\n' ' ' <<< "$outside")"
              exit 1
            fi
            {
              echo "- ci_basis_receipt: ${CI_BASIS_RECEIPT}"
              echo "- ci_basis_head: ${CI_BASIS_HEAD}"
              echo "- prepared_release_sha: ${PREPARED_RELEASE_SHA}"
              echo "- actor: ${ACTOR} (triggered by ${TRIGGERING_ACTOR})"
              echo "- hosted CI wait waived by ci_basis_receipt"
              echo ""
              echo "Workflow-only delta (git diff --stat ${CI_BASIS_HEAD}..${PREPARED_RELEASE_SHA}):"
              echo ""
              echo '```'
              git diff --no-renames --stat "${CI_BASIS_HEAD}..${PREPARED_RELEASE_SHA}" --
              echo '```'
            } | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ -z "$PREPARED_RELEASE_SHA" ] && [ -z "$SOURCE_SHA" ]; then
            echo "Skipping duplicate gates on the release preparation dispatch."
            exit 0
          fi

          retry_gh() {
            local description="$1"
            shift
            local output=""
            for api_retry in 1 2 3 4 5; do
              if output="$("$@" 2>&1)"; then
                printf '%s' "$output"
                return 0
              fi
              echo "${description}: retry ${api_retry}/5" >&2
              echo "$output" >&2
              if [ "$api_retry" != "5" ]; then sleep 5; fi
            done
            echo "::error::${description} failed after 5 retries; GitHub API may be down." >&2
            return 1
          }

          # The release's own run is a receipt only if it is this repository's ci.yml, dispatched by its workflow token on a
          # release-ci ref for the source. The parent knows the exact ref (and got the id from its own dispatch). The tagged
          # child gets the id as an input, so it also requires that it was itself dispatched by the workflow token and that
          # the ref names a real publish.yml attempt of this repository, created before that run.
          # Called in an || list, so errexit is off inside: every lookup refuses explicitly when it fails.
          verify_owned_run() {
            local sha="$1" ci_workflow publish_workflow run parent_id parent_attempt parent receipt receipts
            if ! [[ "$owned" =~ ^[0-9]+$ ]]; then
              echo "::error::The release's CI run id '${owned}' is not a run id."
              return 1
            fi
            ci_workflow="$(retry_gh "Read the ci.yml workflow" gh api "repos/${REPOSITORY}/actions/workflows/ci.yml" --jq .id)" || return 1
            run="$(retry_gh "Read the release's own CI run" gh api "repos/${REPOSITORY}/actions/runs/${owned}" \
              --jq '[.id, .workflow_id, .head_sha, .event, .head_branch, .triggering_actor.login, .created_at] | @tsv')" || return 1
            IFS=$'\t' read -r run_id run_workflow run_sha run_event run_branch run_actor run_created <<< "$run"
            if ! [[ "$ci_workflow" =~ ^[0-9]+$ ]] || [ "$run_id" != "$owned" ] || [ "$run_workflow" != "$ci_workflow" ] || [ "$run_sha" != "$sha" ] ||
              [ "$run_event" != workflow_dispatch ] || [ "$run_actor" != "github-actions[bot]" ]; then
              echo "::error::CI run ${owned} is not a run this release dispatched for ${sha} (workflow ${run_workflow:-?}, event ${run_event:-?}, branch ${run_branch:-?}, by ${run_actor:-?})."
              return 1
            fi
            if [ -n "$RELEASE_CI_REF" ]; then
              if [ "$run_branch" != "$RELEASE_CI_REF" ]; then
                echo "::error::CI run ${owned} is not a run this release dispatched for ${sha} (branch ${run_branch}, not ${RELEASE_CI_REF})."
                return 1
              fi
              return 0
            fi
            if [ "$TRIGGERING_ACTOR" != "github-actions[bot]" ] || ! [[ "$run_branch" =~ ^release-ci/${sha}-([0-9]+)-([0-9]+)$ ]]; then
              echo "::error::CI run ${owned} is not a run this release dispatched for ${sha} (branch ${run_branch:-?}; this run was started by ${TRIGGERING_ACTOR})."
              return 1
            fi
            parent_id="${BASH_REMATCH[1]}"
            parent_attempt="${BASH_REMATCH[2]}"
            parent="$(retry_gh "Read the parent release run" gh api "repos/${REPOSITORY}/actions/runs/${parent_id}" \
              --jq '[.workflow_id, .event, .run_attempt, .created_at] | @tsv')" || return 1
            publish_workflow="$(retry_gh "Read the publish.yml workflow" gh api "repos/${REPOSITORY}/actions/workflows/publish.yml" --jq .id)" || return 1
            IFS=$'\t' read -r parent_workflow parent_event parent_run_attempt parent_created <<< "$parent"
            if ! [[ "$publish_workflow" =~ ^[0-9]+$ ]] || [ "$parent_workflow" != "$publish_workflow" ] ||
              [ "$parent_event" != workflow_dispatch ] || ! [[ "$parent_run_attempt" =~ ^[0-9]+$ ]] || [ "$parent_run_attempt" -lt "$parent_attempt" ] || [[ "$parent_created" > "$run_created" ]]; then
              echo "::error::CI run ${owned} names release attempt ${parent_id}-${parent_attempt}, which is not a publish.yml release of this repository that started it."
              return 1
            fi
            receipt="release-ci-receipt-${sha}-${PREPARED_RELEASE_SHA}-${owned}"
            receipts="$(retry_gh "Read the parent release's CI receipt" gh api --method GET "repos/${REPOSITORY}/actions/runs/${parent_id}/artifacts" \
              -f name="$receipt" --jq "[.artifacts[] | select(.workflow_run.id == ${parent_id})] | length")" || return 1
            if ! [[ "$receipts" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::Release attempt ${parent_id} recorded no receipt binding CI run ${owned} to ${sha} and ${PREPARED_RELEASE_SHA} (${receipt})."
              return 1
            fi
          }

          # Unpinned releases can also use the release-state PR's CI at the prepared SHA.
          # Pinned releases require a push and proof that its heavy validation actually ran.
          # The pinned source also counts the one run pin-ci dispatched for it (#15094), by run id, never any other dispatch:
          # the parent release's own (exact ref), or in the tagged child the parent's, carried as source_ci_run and checked
          # again here (dispatched by this repository's workflow token, at the source, on a release-ci ref for it).
          wait_for_ci() {
            local sha="$1" event="${2:-}" push_run owned="" owned_status="" owned_conclusion="" unproven_push="" owned_verified=""
            if [ "$event" = "push" ]; then set -- -f "event=push"; else set --; fi
            if [ "$event" = "push" ] && [ "$sha" = "$SOURCE_SHA" ]; then owned="${RELEASE_CI_RUN:-}"; fi
            # Its own run starts with the release, so it gets a full CI run's time (about 70 minutes) plus margin.
            local attempts=120
            if [ -n "$owned" ]; then attempts=400; fi
            for attempt in $(seq 1 "$attempts"); do
              RUNS="$(retry_gh "Read CI workflow runs" gh api --method GET \
                "repos/${{ github.repository }}/actions/workflows/ci.yml/runs" \
                -f head_sha="$sha" "$@" -f per_page=100)"

              if [ "$event" = "push" ]; then
                push_run="$(select_green_push "$sha" <<< "$RUNS")"
                SUCCESS_ID="${push_run%%$'\t'*}"
                # With its own run, a green push counts only once proven; an unproven one never decides the release.
                if [ -n "$SUCCESS_ID" ] && [ -n "$owned" ] && [ "$SUCCESS_ID" != "$unproven_push" ]; then
                  if require_push_validation "$REPOSITORY" "$push_run"; then
                    echo "CI workflow run ${SUCCESS_ID} ran and passed required validation for ${sha}."
                    return 0
                  fi
                  echo "::warning::Green push run ${SUCCESS_ID} lacks the required validation proof; judging the release's own CI run ${owned}."
                  unproven_push="$SUCCESS_ID"
                fi
                if [ -n "$owned" ] && [ "$SUCCESS_ID" = "$unproven_push" ]; then SUCCESS_ID=""; fi
                if [ -z "$SUCCESS_ID" ] && [ -n "$owned" ]; then
                  if [ -z "$owned_verified" ]; then
                    verify_owned_run "$sha" || return 1
                    owned_verified=true
                  fi
                  OWNED="$(retry_gh "Read the release's own CI run" gh api "repos/${REPOSITORY}/actions/runs/${owned}" \
                    --jq '[.id, .run_attempt, .head_sha, .status, (.conclusion // "none")] | @tsv')"
                  IFS=$'\t' read -r owned_id owned_attempt owned_sha owned_status owned_conclusion <<< "$OWNED"
                  if [ "$owned_id" != "$owned" ] || [ "$owned_sha" != "$sha" ]; then
                    echo "::error::CI run ${owned} changed identity while the release waited on it."
                    return 1
                  fi
                  if [ "$owned_status" = completed ] && [ "$owned_conclusion" = success ]; then
                    push_run="$(printf '%s\t%s\t%s' "$owned_id" "$owned_attempt" "$owned_sha")"
                    SUCCESS_ID="$owned_id"
                  fi
                fi
              else
                SUCCESS_ID="$(jq -r --arg sha "$sha" '
                  [.workflow_runs[] | select(.head_sha == $sha and .status == "completed" and .conclusion == "success")]
                  | sort_by(.created_at) | last | .id // empty
                ' <<< "$RUNS")"
              fi
              if [ -n "$SUCCESS_ID" ]; then
                if [ "$event" = "push" ]; then
                  require_push_validation "$REPOSITORY" "$push_run" || return 1
                  echo "CI workflow run ${SUCCESS_ID} ran and passed required validation for ${sha}."
                  return 0
                fi
                echo "CI workflow run ${SUCCESS_ID} succeeded for ${sha}."
                # An unpinned release can reuse platform CI only for a verified stamp over a green base.
                LEGS="$(retry_gh "Read CI run jobs" gh api "repos/${REPOSITORY}/actions/runs/${SUCCESS_ID}/jobs?filter=latest&per_page=100" \
                  --jq "$(cat .github/scripts/platform-jobs.jq)" | cut -f2)"
                if [ -n "$LEGS" ] && ! grep -qvx success <<< "$LEGS"; then
                  echo "Its macOS/Windows legs ran and passed."
                  return 0
                fi
                git fetch --no-tags --depth=2 origin "$sha"
                PLATFORM_BASE="$(git rev-parse "${sha}^")"
                if ! node script/release-state-paths.mjs --check-stamp "$PLATFORM_BASE" "$sha"; then
                  echo "::error::CI run ${SUCCESS_ID} did not run macOS/Windows, and ${sha} changes more than the release stamp over ${PLATFORM_BASE}; run the full matrix on it."
                  return 1
                fi
                if [ "$(GH_REPO="$REPOSITORY" BASE_SHA="$PLATFORM_BASE" bash .github/scripts/base-platform-green.sh)" != "true" ]; then
                  echo "::error::CI run ${SUCCESS_ID} did not run macOS/Windows, and the base ${PLATFORM_BASE} has no dev push run whose macOS/Windows legs ran green."
                  return 1
                fi
                echo "Its macOS/Windows legs did not run; base ${PLATFORM_BASE} proved them and the delta is the release stamp only."
                return 0
              fi

              # With its own run, the release judges only that run: another run's verdict (a superseded push, an older
              # attempt) never decides it. It fails fast: a job that already concluded red decides the outcome now, not when
              # the run ends (the 5.1.84 cut's run went red at minute 11 of 66). A cancelled job is not a verdict.
              if [ -n "$owned" ]; then
                if [ "$owned_status" = completed ]; then
                  echo "::error::The release's own CI run ${owned} for ${sha} concluded ${owned_conclusion}."
                  return 1
                fi
                RED="$(retry_gh "Read the release's own CI run jobs" gh api "repos/${REPOSITORY}/actions/runs/${owned}/jobs?filter=latest&per_page=100" \
                  --jq '[.jobs[] | select(.status == "completed" and (.conclusion == "failure" or .conclusion == "timed_out" or .conclusion == "startup_failure")) | "\(.name)=\(.conclusion)"] | join(", ")')"
                if [ -n "$RED" ]; then
                  echo "::error::The release's own CI run ${owned} for ${sha} is still running but already failed: ${RED}."
                  return 1
                fi
                echo "Waiting for the release's own CI run ${owned} on ${sha} (attempt ${attempt}/${attempts})."
                sleep 15
                continue
              fi

              ACTIVE_COUNT="$(jq -r --arg sha "$sha" '
                [.workflow_runs[] | select(.head_sha == $sha and .status != "completed")] | length
              ' <<< "$RUNS")"
              COMPLETED_COUNT="$(jq -r --arg sha "$sha" '
                [.workflow_runs[] | select(.head_sha == $sha and .status == "completed")] | length
              ' <<< "$RUNS")"
              if [ "$ACTIVE_COUNT" = "0" ] && [ "$COMPLETED_COUNT" != "0" ]; then
                jq -r --arg sha "$sha" '
                  .workflow_runs[] | select(.head_sha == $sha)
                  | "CI run \(.id): status=\(.status), conclusion=\(.conclusion), url=\(.html_url)"
                ' <<< "$RUNS"
                echo "::error::CI completed without a successful run for ${sha}."
                return 1
              fi
              echo "Waiting for successful CI on ${sha} (attempt ${attempt}/${attempts})."
              sleep 15
            done

            echo "::error::Timed out waiting for successful CI on ${sha}."
            return 1
          }

          if [ -n "$SOURCE_SHA" ]; then
            # The push proof is dispatch code: load it before the checkout moves to the source it judges.
            proof_dir="$(mktemp -d "$RUNNER_TEMP/release-proof.XXXXXXXXXX")"
            trap 'rm -rf "$proof_dir"' EXIT
            git show "${GITHUB_SHA}:.github/scripts/release-push-proof.sh" > "$proof_dir/release-push-proof.sh"
            git show "${GITHUB_SHA}:.github/scripts/release-push-proof.mjs" > "$proof_dir/release-push-proof.mjs"
            git show "${GITHUB_SHA}:.github/scripts/release-proof-contract.json" > "$proof_dir/release-proof-contract.json"
            source "$proof_dir/release-push-proof.sh"
            wait_for_ci "$SOURCE_SHA" "push"
            if [ -z "$PREPARED_RELEASE_SHA" ]; then exit 0; fi
            # Read the checker from the green basis, not from the delta it is judging.
            git checkout --detach "$SOURCE_SHA"
            if node script/release-state-paths.mjs --check-stamp "$SOURCE_SHA" "$PREPARED_RELEASE_SHA"; then
              echo "Reusing push CI at ${SOURCE_SHA} for release stamp ${PREPARED_RELEASE_SHA}." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            # PR CI can be indexed by the stamp SHA while testing its merge tree.
            # A push run at the stamp tests the source we actually publish.
            wait_for_ci "$PREPARED_RELEASE_SHA" "push"
            echo "exact_stamp_ci=${PREPARED_RELEASE_SHA}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          wait_for_ci "$PREPARED_RELEASE_SHA"

      - name: Write job summary
        if: always()
        shell: bash
        env:
          JOB_SUMMARY_TITLE: Release gate reuse decision
          JOB_SUMMARY_STATUS: ${{ job.status }}
          JOB_SUMMARY_DETAILS: |
            - A pinned source requires push CI that ran and passed required validation before stamping. Only a verified release stamp can reuse it.
            - Otherwise checks CI at the exact prepared SHA, skipping the wait on unpinned preparation. When macOS/Windows did not run, requires a verified stamp over a base that proved them.
            - A repository admin or maintainer may waive that wait with a ci_basis_receipt whose head differs from the prepared SHA only under .github/workflows/; the waiver and delta are logged.
            - Fails closed when CI fails, is cancelled, times out, or cannot be read.
          JOB_SUMMARY_NEXT: Rerun CI on the prepared SHA or fix its failed workflow before publishing.
        run: GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" bash .github/scripts/write-job-summary.sh

  # The release-ci ref only names the run's commit; the run and its record stay after the ref is gone. Runs on every
  # outcome once pin-ci owned the ref (including a failed or cancelled release), deletes the ref only while it still
  # names the pinned source, and stops the release's own run if the gate no longer needs it.
  unpin-ci:
    needs: [pin-ci, gate-reuse]
    if: always() && inputs.prepared_release_sha == '' && needs.pin-ci.outputs.ref_owned == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      contents: write
    steps:
      - name: Delete the pinned source's CI ref
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ needs.pin-ci.outputs.source_sha }}
          CI_RUN_ID: ${{ needs.pin-ci.outputs.ci_run_id }}
          CI_REF: ${{ needs.pin-ci.outputs.ci_ref }}
          DISPATCH_ATTEMPTED: ${{ needs.pin-ci.outputs.dispatch_attempted }}
        run: |
          set -uo pipefail
          # Cancelling the run and removing the ref are independent; each retries, and anything unresolved fails this job.
          unresolved=""
          with_retry() {
            local output
            for api_retry in 1 2 3 4 5; do
              if output="$("$@" 2>&1)"; then printf '%s' "$output"; return 0; fi
              if grep -q 'HTTP 404' <<< "$output"; then return 4; fi
              echo "$1 $2 $3: retry ${api_retry}/5: ${output}" >&2
              if [ "$api_retry" != "5" ]; then sleep 5; fi
            done
            return 1
          }
          if [ -z "$CI_RUN_ID" ] && [ "$DISPATCH_ATTEMPTED" = true ]; then
            # The dispatch's answer was lost: a run on this attempt's own ref is the one it may have started. A new run can
            # take a while to be listed, so an empty list is no answer until the window ends; then it stays indeterminate.
            found=""
            for visibility in $(seq 1 18); do
              if ! listed="$(with_retry gh api --method GET "repos/${GH_REPO}/actions/workflows/ci.yml/runs" -f branch="$CI_REF" -f event=workflow_dispatch --jq '[.workflow_runs[] | "\(.id):\(.status)"] | join(" ")')"; then
                found=error
                unresolved+=" list-runs"
                break
              fi
              for entry in $listed; do
                found=yes
                if [ "${entry#*:}" != completed ]; then
                  with_retry gh run cancel "${entry%%:*}" > /dev/null || unresolved+=" cancel-run-${entry%%:*}"
                fi
              done
              [ -z "$found" ] || break
              sleep 10
            done
            [ -n "$found" ] || unresolved+=" dispatch-indeterminate"
          fi
          if [ -n "$CI_RUN_ID" ]; then
            if run_status="$(with_retry gh api "repos/${GH_REPO}/actions/runs/${CI_RUN_ID}" --jq .status)"; then
              if [ "$run_status" != completed ] && ! with_retry gh run cancel "$CI_RUN_ID" > /dev/null; then
                unresolved+=" cancel-run-${CI_RUN_ID}"
              fi
            else
              unresolved+=" read-run-${CI_RUN_ID}"
            fi
          fi
          ref="heads/${CI_REF}"
          # Actions runs bash with -e: capture the status instead of letting a failed read end the step.
          existing="$(with_retry gh api "repos/${GH_REPO}/git/ref/${ref}" --jq .object.sha)" && ref_read=0 || ref_read=$?
          case "$ref_read" in
            4) echo "refs/${ref} is already gone." ;;
            0)
              if [ "$existing" != "$SOURCE_SHA" ]; then
                echo "::error::refs/${ref} now names ${existing}, not ${SOURCE_SHA}; leaving it for a maintainer."
                unresolved+=" ref-moved"
              elif with_retry gh api --method DELETE "repos/${GH_REPO}/git/refs/${ref}" > /dev/null; then
                echo "Deleted refs/${ref}."
              else
                unresolved+=" delete-ref"
              fi
              ;;
            *) unresolved+=" read-ref" ;;
          esac
          if [ -n "$unresolved" ]; then
            echo "::error::Cleanup of the release's CI ref refs/${ref} and run ${CI_RUN_ID:-none} is unresolved:${unresolved}; finish it by hand."
            exit 1
          fi

      - name: Write job summary
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          CI_REF: ${{ needs.pin-ci.outputs.ci_ref }}
          CI_RUN_ID: ${{ needs.pin-ci.outputs.ci_run_id }}
        run: |
          {
            echo "## Release CI ref cleanup"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Result | \`$JOB_STATUS\` |"
            echo "| Ref | \`refs/heads/$CI_REF\` |"
            echo "| CI run | \`${CI_RUN_ID:-none}\` |"
            echo
            echo "Cancels the release's own CI run if it is still running and deletes its ref while it names the source; anything unresolved fails this job and is named above."
          } >> "$GITHUB_STEP_SUMMARY"

  preflight-trust:
    # Pin until this release/deploy path is proven on Ubuntu 26.04: #9933.
    runs-on: ubuntu-24.04
    needs: [release-metadata]
    if: github.repository == 'code-yeongyu/oh-my-openagent'
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Require LazyCodex sync token
        # Every channel that publishes lazycodex-ai also syncs the Codex marketplace mirror, so the
        # token is required whenever LazyCodex is published, not only on stable releases.
        if: inputs.publish_lazycodex == true
        env:
          LAZYCODEX_SYNC_TOKEN: ${{ secrets.LAZYCODEX_SYNC_TOKEN }}
        run: |
          if [ -z "$LAZYCODEX_SYNC_TOKEN" ]; then
            echo "::error::LAZYCODEX_SYNC_TOKEN is required to push the Codex marketplace bundle to code-yeongyu/lazycodex."
            exit 1
          fi

      - uses: actions/checkout@v7

      - name: Verify trusted publisher for release packages
        env:
          REPO: code-yeongyu/oh-my-openagent
          WORKFLOW_FILE: publish.yml
          PUBLISH_LAZYCODEX: ${{ inputs.publish_lazycodex }}
          LAZYCODEX_ONLY: ${{ inputs.lazycodex_only }}
        run: |
          PLATFORMS=(darwin-arm64 darwin-x64 darwin-x64-baseline linux-x64 linux-x64-baseline linux-arm64 linux-x64-musl linux-x64-musl-baseline linux-arm64-musl windows-x64 windows-x64-baseline windows-arm64)
          if [ "${LAZYCODEX_ONLY}" = "true" ]; then
            ALL_PACKAGES=(lazycodex-ai)
          else
            ALL_PACKAGES=(oh-my-opencode oh-my-openagent omo-ai)
            if [ "${PUBLISH_LAZYCODEX}" = "true" ]; then
              ALL_PACKAGES+=(lazycodex-ai)
            fi
            for plat in "${PLATFORMS[@]}"; do
              ALL_PACKAGES+=("oh-my-opencode-${plat}")
              ALL_PACKAGES+=("oh-my-openagent-${plat}")
            done
          fi

          # Diagnostic/setup reference: docs/reference/omo-ai-publishing.md
          node script/preflight-trust.mjs "${ALL_PACKAGES[@]}"

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## Trusted publishing preflight"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Result | \`${{ job.status }}\` |"
            echo "| Workflow | \`${{ github.workflow }}\` |"
            echo "| LazyCodex publish | \`${{ inputs.publish_lazycodex }}\` |"
            echo "| LazyCodex only | \`${{ inputs.lazycodex_only }}\` |"
            echo
            echo "### What this job checks"
            echo
            echo "- Requires the LazyCodex sync token whenever LazyCodex is published."
            echo "- Verifies npm trusted-publisher mappings before release writes begin."
            echo
            echo "### If this fails"
            echo
            echo "Read the first failing package/status diagnostic. Transport, throttling, server errors and ambiguous 404s retry automatically; exhaustion reports the actual error. Only definitive authorization failures print publisher-configuration guidance. Check the sync secret separately if its prerequisite failed."
          } >> "$GITHUB_STEP_SUMMARY"

  release-metadata:
    # Pin until this release/deploy path is proven on Ubuntu 26.04: #9934.
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      dist_tag: ${{ steps.version.outputs.dist_tag }}
      omo_ai_version: ${{ steps.omo-ai.outputs.omo_ai_version }}
      omo_ai_dist_tag: ${{ steps.omo-ai.outputs.omo_ai_dist_tag }}
      already_published: ${{ steps.omo-ai.outputs.already_published }}
      previous_lazycodex_version: ${{ steps.version.outputs.previous_lazycodex_version }}
    steps:
      - uses: actions/checkout@v7

      - name: Assert omo bin ownership
        run: |
          if jq -e '.bin.omo' package.json >/dev/null; then
            echo '::error::root package.json re-declares bin.omo - the omo name belongs to omo-ai (see docs/reference/omo-ai-publishing.md)'
            exit 1
          fi

      - name: Calculate version
        id: version
        env:
          RAW_VERSION: ${{ inputs.version }}
          BUMP: ${{ inputs.bump }}
          PUBLISH_LAZYCODEX: ${{ inputs.publish_lazycodex }}
          LAZYCODEX_ONLY: ${{ inputs.lazycodex_only }}
        run: |
          if [ "$LAZYCODEX_ONLY" = "true" ]; then
            # A LazyCodex-only release never bumps from the omo registry version and is
            # meaningless without the lazycodex-ai publish it exists to ship.
            if [ -z "$RAW_VERSION" ]; then
              echo "::error::lazycodex_only requires an explicit version input."
              exit 1
            fi
            if [ "$PUBLISH_LAZYCODEX" != "true" ]; then
              echo "::error::lazycodex_only requires publish_lazycodex=true."
              exit 1
            fi
          fi

          VERSION="$RAW_VERSION"
          if [ -z "$VERSION" ]; then
            PREV=$(curl -s https://registry.npmjs.org/oh-my-opencode/latest | jq -r '.version // "0.0.0"')
            BASE="${PREV%%-*}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE"
            case "$BUMP" in
              major) VERSION="$((MAJOR+1)).0.0" ;;
              minor) VERSION="${MAJOR}.$((MINOR+1)).0" ;;
              *) VERSION="${MAJOR}.${MINOR}.$((PATCH+1))" ;;
            esac
          fi

          # Reject cross-line namespace use before drafting release state or probing npm.
          METADATA=$(node script/release-version.mjs "$VERSION")
          printf '%s\n' "$METADATA" >> "$GITHUB_OUTPUT"
          DIST_TAG=$(printf '%s\n' "$METADATA" | awk -F= '$1 == "dist_tag" { print $2 }')

          LAZYCODEX_COMPARE_TAG="${DIST_TAG:-latest}"
          PREVIOUS_LAZYCODEX_VERSION=$(npm view "lazycodex-ai@${LAZYCODEX_COMPARE_TAG}" version 2>/dev/null || true)
          echo "previous_lazycodex_version=${PREVIOUS_LAZYCODEX_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Calculate omo-ai metadata
        id: omo-ai
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # The channel follows the version: a prerelease X.Y.Z-<suffix> ships as X.Y.Z-0.<suffix> on the
          # beta dist-tag, a stable X.Y.Z ships as exactly X.Y.Z on latest, so a bare `bun add -g omo-ai`
          # resolves the stable release.
          if [[ "$VERSION" == *"-"* ]]; then
            OMO_AI_VERSION="${VERSION/-/-0.}"
            OMO_AI_DIST_TAG=beta
          else
            OMO_AI_VERSION="${VERSION}"
            OMO_AI_DIST_TAG=latest
          fi

          echo "omo_ai_version=$OMO_AI_VERSION" >> "$GITHUB_OUTPUT"
          echo "omo_ai_dist_tag=$OMO_AI_DIST_TAG" >> "$GITHUB_OUTPUT"

          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://registry.npmjs.org/omo-ai/${OMO_AI_VERSION}")
          if [ "$STATUS" = "200" ]; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi
          echo "omo-ai version: $OMO_AI_VERSION (registry HTTP $STATUS)"

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## Release metadata"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Result | \`${{ job.status }}\` |"
            echo "| Version | \`${{ steps.version.outputs.version || 'not calculated' }}\` |"
            echo "| Dist tag | \`${{ steps.version.outputs.dist_tag || 'latest' }}\` |"
            echo "| LazyCodex only | \`${{ inputs.lazycodex_only }}\` |"
            echo "| Previous LazyCodex | \`${{ steps.version.outputs.previous_lazycodex_version || 'none' }}\` |"
            echo
            echo "### What this job checks"
            echo
            echo "- Resolves the release version from manual inputs."
            echo "- Computes the npm dist tag and previous LazyCodex comparison version."
            echo
            echo "### If this fails"
            echo
            echo "Check the requested version format, bump input, or npm metadata lookup."
          } >> "$GITHUB_STEP_SUMMARY"

  prepare-release-state:
    # Pin until this release/deploy path is proven on Ubuntu 26.04: #9935.
    runs-on: ubuntu-24.04
    needs: [gate-reuse, preflight-trust, release-metadata]
    if: >-
      always() &&
      github.repository == 'code-yeongyu/oh-my-openagent' &&
      needs.gate-reuse.result == 'success' &&
      needs.preflight-trust.result == 'success' &&
      needs.release-metadata.result == 'success'
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_sha: ${{ steps.publish_state.outputs.release_sha || steps.prepare.outputs.release_sha }}
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      RELEASE_REF: ${{ inputs.source_sha && 'dev' || github.ref_name }}
    steps:
      # The PAT checks out with persist-credentials disabled: repo-controlled
      # generation below must never be able to read the release credential from
      # git config. The token is exported explicitly only when the generated
      # release state is ready to be pushed.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ !inputs.prepared_release_sha && inputs.source_sha || '' }}
          token: ${{ secrets.GH_PAT }}
          persist-credentials: false

      - run: git fetch --force --tags

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      # build-extension.mjs derives its --external list from the runner's builtinModules;
      # the senpi-compatibility freshness check runs it on node 24, so this job must too, or
      # the stamped bundle is byte-divergent and rejected as stale (#8329).
      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Prepare release state (generation)
        id: prepare
        # Generation only: this step runs repo-controlled scripts and package
        # managers, so it carries NO form of the release PAT in its environment.
        # Credential-bearing operations live in the next step.
        env:
          VERSION: ${{ needs.release-metadata.outputs.version }}
          OMO_AI_VERSION: ${{ needs.release-metadata.outputs.omo_ai_version }}
          PREPARED_RELEASE_SHA: ${{ inputs.prepared_release_sha }}
          LAZYCODEX_ONLY: ${{ inputs.lazycodex_only }}
        run: |
          set -euo pipefail

          if [ -n "$PREPARED_RELEASE_SHA" ]; then
            if [ "$PREPARED_RELEASE_SHA" != "$GITHUB_SHA" ]; then
              echo "::error::Prepared source SHA ${PREPARED_RELEASE_SHA} does not match dispatch SHA ${GITHUB_SHA}."
              exit 1
            fi
            echo "release_sha=${PREPARED_RELEASE_SHA}" >> "$GITHUB_OUTPUT"
            echo "needs_push=false" >> "$GITHUB_OUTPUT"
            echo "Publishing from prepared source ${PREPARED_RELEASE_SHA}"
            exit 0
          fi

          BASE_REF="${RELEASE_REF:-dev}"
          RELEASE_BRANCH="release/v${VERSION}-source-state"

          git fetch origin "${BASE_REF}" --tags

          BASE_HEAD="$(git rev-parse "origin/${BASE_REF}")"

          if [ "${LAZYCODEX_ONLY:-}" = "true" ]; then
            # A LazyCodex-only release publishes the base head as-is: no omo manifest is stamped and no
            # release commit lands on the base branch. The provenance-safe child is dispatched from the
            # lazycodex-v<version> tag namespace so it never collides with an omo release tag, and a
            # version number is refused when either namespace or npm already carries it, so one version
            # can never map to two different lazycodex-ai payloads.
            if git rev-parse -q --verify "refs/tags/lazycodex-v${VERSION}" >/dev/null; then
              echo "::error::lazycodex-v${VERSION} already exists: a LazyCodex-only release already consumed this version. Bump to an unused version."
              exit 1
            fi
            if git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
              echo "::error::v${VERSION} already exists as an omo release tag; a LazyCodex-only release must not reuse a number the omo line already released. Bump to an unused version."
              exit 1
            fi
            NPM_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://registry.npmjs.org/lazycodex-ai/${VERSION}")
            if [ "$NPM_STATUS" = "200" ]; then
              echo "::error::lazycodex-ai@${VERSION} is already on npm; publishing a different tree under the same version is refused. Bump to an unused version."
              exit 1
            fi
            echo "release_sha=${BASE_HEAD}" >> "$GITHUB_OUTPUT"
            echo "needs_push=false" >> "$GITHUB_OUTPUT"
            echo "LazyCodex-only release from origin/${BASE_REF} head ${BASE_HEAD}; no omo release state is stamped."
            exit 0
          fi

          # A version consumed by a LazyCodex-only release already carries a lazycodex-ai payload built
          # from a different tree; an omo release must never reuse that number.
          if git rev-parse -q --verify "refs/tags/lazycodex-v${VERSION}" >/dev/null; then
            echo "::error::lazycodex-v${VERSION} exists: this version was consumed by a LazyCodex-only release. Bump to an unused version so lazycodex-ai@${VERSION} keeps a single payload."
            exit 1
          fi

          # An unpinned retry must include the current base's tree (#7779). For a pin
          # it is the original parent, not the moving dev tree, that must match.
          reuse_or_refuse() {
            local candidate="$1" origin_desc="$2"
            local rev='^{tree}' expected="${BASE_HEAD}^{tree}"
            if [ -n "$SOURCE_SHA" ]; then
              rev='^1'
              expected="$SOURCE_SHA"
            fi
            if git merge-base --is-ancestor "$candidate" "$BASE_HEAD" &&
              [ "$(git rev-parse "${candidate}${rev}")" = "$(git rev-parse "$expected")" ]; then
              echo "release_sha=${candidate}" >> "$GITHUB_OUTPUT"
              echo "needs_push=false" >> "$GITHUB_OUTPUT"
              echo "Reusing ${origin_desc} at ${candidate}."
              exit 0
            fi
            echo "::error::${origin_desc} (${candidate}) is stale or unrelated to origin/${BASE_REF} (${BASE_HEAD}). Bump to an unused version so a fresh release commit is stamped on the current head."
            exit 1
          }

          if git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
            reuse_or_refuse "$(git rev-list --max-count=1 "refs/tags/v${VERSION}")" "Release tag v${VERSION}"
          fi

          RELEASE_SHA="$(git rev-list --no-merges --max-count=1 --grep="^release: v${VERSION}$" "origin/${BASE_REF}" 2>/dev/null || true)"
          if [ -n "$RELEASE_SHA" ]; then
            reuse_or_refuse "$RELEASE_SHA" "Release commit for v${VERSION}"
          fi

          git checkout -B "$RELEASE_BRANCH" "${SOURCE_SHA:-$BASE_HEAD}"

          CURRENT_VERSION="$(node -p "require('./package.json').version")"
          if [ "$CURRENT_VERSION" = "$VERSION" ]; then
            if [ -n "$SOURCE_SHA" ]; then
              echo "::error::The pinned source already carries ${VERSION}; choose an unused version to stamp."
              exit 1
            fi
            RELEASE_SHA="$(git rev-parse HEAD)"
            echo "release_sha=${RELEASE_SHA}" >> "$GITHUB_OUTPUT"
            echo "needs_push=false" >> "$GITHUB_OUTPUT"
            echo "origin/${BASE_REF} is already stamped as v${VERSION}: ${RELEASE_SHA}"
            exit 0
          fi

          jq --arg v "$VERSION" '.version = $v' package.json > tmp.json && mv tmp.json package.json
          jq --arg v "$OMO_AI_VERSION" '.version = $v' packages/omo-native/package.json > tmp.json && mv tmp.json packages/omo-native/package.json

          for platform in darwin-arm64 darwin-x64 darwin-x64-baseline linux-x64 linux-x64-baseline linux-arm64 linux-x64-musl linux-x64-musl-baseline linux-arm64-musl windows-x64 windows-x64-baseline windows-arm64; do
            package_dir="packages/oh-my-opencode-${platform}"
            jq --arg v "$VERSION" '.version = $v' "${package_dir}/package.json" > tmp.json
            mv tmp.json "${package_dir}/package.json"
          done

          jq --arg v "$VERSION" '.optionalDependencies = (.optionalDependencies | to_entries | map(.value = $v) | from_entries)' package.json > tmp.json && mv tmp.json package.json

          node packages/omo-codex/plugin/scripts/sync-version.mjs
          jq --arg v "$VERSION" '.version = $v' packages/omo-senpi/package.json > tmp.json && mv tmp.json packages/omo-senpi/package.json
          node packages/omo-senpi/plugin/scripts/sync-version.mjs
          node packages/omo-codex/plugin/scripts/sync-hook-status-messages.mjs
          # Assemble the changes/unreleased fragments into this release's CHANGELOG section and
          # delete them (same release commit), so the released commit carries the notes the GitHub
          # release body is later extracted from.
          # Replay uses the stamp commit's UTC date, even if generation crosses midnight.
          stamp_time="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          bun run script/stamp-release-changelog.ts "$VERSION" "${stamp_time%%T*}"
          # The stamp step assembled changes/unreleased/*.md into the released CHANGELOG section, wrote their
          # log blocks into changes.md and packages/*/changes.md, and deleted the fragments; stage all of it.
          git add changes changes.md packages/*/changes.md
          npm --prefix packages/omo-codex/plugin install --package-lock-only --ignore-scripts --no-audit --fund=false
          bun install --lockfile-only

          # The version bump restamps OMO_SENPI_PACKAGE_VERSION inside the committed Senpi
          # bundles; rebuild them so the release commit passes bundle-freshness CI.
          node packages/omo-senpi/plugin/scripts/build-extension.mjs
          # The committed Codex installer bundle embeds packages/omo-codex/package.json, and its
          # freshness marker digests that file; rebuild it too or codex-install-bundle-freshness
          # rejects the release commit as stale (v5.0.0-beta.83 release-state PR).
          bun run build:codex-install
          # The committed service-auth bundle inlines packages/omo-native/package.json's version;
          # rebuild it too or script/build-service-auth.test.ts rejects the release commit as stale (#12046).
          bun script/build-service-auth.ts

          git config --global user.email "code.yeon.gyu@gmail.com"
          git config --global user.name "YeonGyu-Kim"
          git add CHANGELOG.md package.json packages/omo-native/package.json packages/oh-my-opencode-*/package.json packages/omo-senpi/package.json packages/omo-senpi/plugin/package.json packages/omo-codex/package.json packages/omo-codex/plugin/package.json packages/omo-codex/plugin/package-lock.json packages/omo-codex/plugin/.codex-plugin/plugin.json packages/omo-codex/plugin/components/*/package.json packages/omo-codex/plugin/hooks/*.json packages/omo-codex/plugin/components/*/hooks/hooks.json bun.lock
          # build-extension.mjs also rewrites the committed bundles under plugin/runtime (the
          # agent-toolkit SDK, the rollback migrator); commit every tracked one it touched or the
          # freshness check rejects the release commit as stale-output (#8329, v5.1.1). `-u` stages
          # only tracked files, so gitignored staged runtimes (lsp-daemon, ast-grep-mcp) stay out.
          git add -f packages/omo-senpi/plugin/extensions
          git add -u packages/omo-senpi/plugin/runtime
          git add packages/omo-codex/scripts/install-dist/install-local.mjs
          git add -u packages/omo-native/bin/lib
          if [ -n "$SOURCE_SHA" ]; then
            # A historical pin may predate the path checker. Use the dispatch workflow's
            # checker without staging it in the stamp or changing the published tree.
            git restore --source="$GITHUB_SHA" --worktree -- script/release-state-paths.mjs
          fi
          # The stamp may change only RELEASE_STATE_PATHS: ci-fast-path.mjs keeps a release-state pull request on Linux
          # when its base is platform-green and its diff is inside that list, so a stamp outside it must stop here.
          git diff --cached --no-renames --name-only -z | node script/release-state-paths.mjs --check
          git diff --cached --quiet || GIT_COMMITTER_DATE="$stamp_time" git commit -m "release: v${VERSION}"

          echo "needs_push=true" >> "$GITHUB_OUTPUT"
          echo "release_branch=${RELEASE_BRANCH}" >> "$GITHUB_OUTPUT"
          echo "Release state generated on ${RELEASE_BRANCH}; handing off to the privileged publish step."

      - name: Verify pinned stamp before pushing
        if: steps.prepare.outputs.needs_push == 'true' && inputs.source_sha != ''
        run: |
          set -euo pipefail

          pin="$(git rev-parse --verify "$SOURCE_SHA")"
          stamp="$(git rev-parse HEAD)"
          proof_dir="$(mktemp -d "$RUNNER_TEMP/release-proof.XXXXXXXXXX")"
          trap 'rm -rf "$proof_dir"' EXIT
          # Match Node's canonical module path so the checker's CLI entry point runs.
          proof_dir="$(cd "$proof_dir" && pwd -P)"
          # A dev push after the PR merges tests the merge commit, not this stamp. The checker
          # belongs to the dispatch commit; neither the historical pin nor the stamp supplies it.
          if [ "$(git rev-parse "${stamp}^1")" != "$pin" ] ||
            ! git show "${GITHUB_SHA}:script/release-state-paths.mjs" > "$proof_dir/dispatch.mjs" ||
            ! node "$proof_dir/dispatch.mjs" --check-stamp "$pin" "$stamp"; then
            echo "::error::Cannot prove pinned release stamp ${stamp}; refusing to push a stamp that would need exact push CI."
            exit 1
          fi

          accepts_pin="$(git show "${stamp}:.github/workflows/publish.yml" |
            yq '.on.workflow_dispatch.inputs | has("source_sha")' -)"
          if [ "$accepts_pin" = true ]; then
            # A source-aware child independently repeats the proof using its green basis. A
            # path-only or missing checker there cannot prove this child can reuse the pin's CI.
            if ! git show "${pin}:script/release-state-paths.mjs" > "$proof_dir/basis.mjs" ||
              ! node "$proof_dir/basis.mjs" --check-stamp "$pin" "$stamp"; then
              echo "::error::The source-aware child cannot prove this stamp from its basis ${pin}; refusing to push."
              exit 1
            fi
          fi

      - name: Publish prepared release state
        id: publish_state
        if: steps.prepare.outputs.needs_push == 'true'
        # The only credential-bearing step: git push + gh PR operations. It runs
        # no repo-controlled generation scripts. The PAT is injected into the
        # git remote URL just for the push and removed immediately after.
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          VERSION: ${{ needs.release-metadata.outputs.version }}
          RELEASE_BRANCH: ${{ steps.prepare.outputs.release_branch }}
        run: |
          set -euo pipefail

          BASE_REF="${RELEASE_REF:-dev}"

          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          trap 'git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"' EXIT
          git push --force-with-lease origin "HEAD:${RELEASE_BRANCH}"
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"

          retry_gh() {
            local description="$1"
            shift
            local output=""
            for api_retry in 1 2 3 4 5; do
              if output="$("$@" 2>&1)"; then
                printf '%s' "$output"
                return 0
              fi
              echo "${description}: retry ${api_retry}/5" >&2
              echo "$output" >&2
              if [ "$api_retry" != "5" ]; then sleep 5; fi
            done
            echo "::error::${description} failed after 5 retries; GitHub API may be down." >&2
            return 1
          }

          create_release_pr() {
            local pr_url=""
            local recovered_number=""
            for api_retry in 1 2 3 4 5; do
              if pr_url="$(gh pr create --base "$BASE_REF" --head "$RELEASE_BRANCH" --title "release: v${VERSION}" --body "Automated release-state PR for v${VERSION}. This must merge before npm publication starts so protected-branch push failures cannot create a half-published release." 2>&1)"; then
                printf '%s' "${pr_url##*/}"
                return 0
              fi
              echo "Create release-state PR: retry ${api_retry}/5" >&2
              echo "$pr_url" >&2
              recovered_number="$(retry_gh "Recover created release-state PR" gh pr list --head "$RELEASE_BRANCH" --base "$BASE_REF" --state open --json number --jq '.[0].number // empty')"
              if [ -n "$recovered_number" ]; then
                printf '%s' "$recovered_number"
                return 0
              fi
              if [ "$api_retry" != "5" ]; then sleep 5; fi
            done
            echo "::error::Create release-state PR failed after 5 retries." >&2
            return 1
          }

          enable_release_auto_merge() {
            local output=""
            local enabled=""
            for api_retry in 1 2 3 4 5; do
              if output="$(gh pr merge "$PR_NUMBER" --merge --auto --delete-branch=false 2>&1)"; then
                printf '%s' "$output"
                return 0
              fi
              echo "Enable release-state PR auto-merge: retry ${api_retry}/5" >&2
              echo "$output" >&2
              enabled="$(retry_gh "Read release-state PR auto-merge" gh pr view "$PR_NUMBER" --json autoMergeRequest --jq '.autoMergeRequest != null')"
              if [ "$enabled" = "true" ]; then
                return 0
              fi
              if [ "$api_retry" != "5" ]; then sleep 5; fi
            done
            echo "::error::Enable release-state PR auto-merge failed after 5 retries." >&2
            return 1
          }

          # Once its PR exists, every failed exit of this step disarms it: auto-merge waits only on the required checks, so an
          # armed stamp would land a version on the base that nothing published (#15126, 5.1.84's #15124). Best-effort; it
          # reports one snapshot of the PR (state and auto-merge read together) and never masks the original failure.
          disarm_release_pr() {
            local snapshot="" state="" armed=""
            for api_retry in 1 2 3 4 5; do
              gh pr merge "$PR_NUMBER" --disable-auto >/dev/null 2>&1 || true
              snapshot="$(gh pr view "$PR_NUMBER" --json state,autoMergeRequest --jq '"\(.state) \(.autoMergeRequest != null)"' 2>/dev/null)" || snapshot=""
              read -r state armed <<< "$snapshot" || true
              if [ -n "$state" ] && { [ "$state" != OPEN ] || [ "$armed" = false ]; }; then break; fi
              if [ "$api_retry" != "5" ]; then sleep 5; fi
            done
            case "$state $armed" in
              "OPEN false") echo "Disabled auto-merge on release-state PR #${PR_NUMBER}; it stays open and unmerged for a maintainer." ;;
              "CLOSED "*) echo "Release-state PR #${PR_NUMBER} is closed; nothing was merged." ;;
              "MERGED "*)
                echo "::error::Release-state PR #${PR_NUMBER} merged into ${BASE_REF} before its auto-merge was disabled: ${BASE_REF} now declares v${VERSION}, which this run did not publish."
                if [ -n "${SOURCE_SHA:-}" ]; then
                  echo "::error::Recover by re-dispatching publish.yml with version=${VERSION} and source_sha=${SOURCE_SHA}: it reuses the merged stamp while that stamp is on ${BASE_REF} with ${SOURCE_SHA} as its first parent."
                else
                  echo "::error::Recover by re-dispatching publish.yml on ${BASE_REF} with version=${VERSION}: it reuses the merged stamp only while ${BASE_REF}'s tree still equals it; otherwise publish an unused version."
                fi
                ;;
              *) echo "::error::Could not confirm that auto-merge is off on release-state PR #${PR_NUMBER} (last read: '${snapshot:-none}'); disable it by hand before it merges." ;;
            esac
          }

          PR_NUMBER="$(retry_gh "List release-state PR" gh pr list --head "$RELEASE_BRANCH" --base "$BASE_REF" --state open --json number --jq '.[0].number // empty')"
          if [ -z "$PR_NUMBER" ]; then
            PR_NUMBER="$(create_release_pr)"
          fi

          release_pr_settled=false
          trap 'status=$?; git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git" || true; if [ "$status" != 0 ] && [ "$release_pr_settled" != true ]; then disarm_release_pr; fi; exit "$status"' EXIT

          enable_release_auto_merge

          for attempt in $(seq 1 120); do
            PR_STATE="$(retry_gh "Read release-state PR state" gh pr view "$PR_NUMBER" --json state --jq '.state')"
            if [ "$PR_STATE" = "MERGED" ]; then
              release_pr_settled=true
              MERGE_SHA="$(retry_gh "Read release-state PR merge SHA" gh pr view "$PR_NUMBER" --json mergeCommit --jq '.mergeCommit.oid')"
              RELEASE_SHA="$(retry_gh "Read release-state PR source SHA" gh pr view "$PR_NUMBER" --json headRefOid --jq '.headRefOid')"
              git fetch origin "$MERGE_SHA" "$RELEASE_SHA"
              if [ -n "$SOURCE_SHA" ]; then
                if [ "$RELEASE_SHA" != "$(git rev-parse HEAD)" ] ||
                  [ "$RELEASE_SHA" != "$(git rev-parse "${MERGE_SHA}^2")" ]; then
                  echo "::error::The release-state PR did not merge the generated stamp."
                  exit 1
                fi
              elif ! git merge-base --is-ancestor "$RELEASE_SHA" "$MERGE_SHA" ||
                [ "$(git rev-parse "${RELEASE_SHA}^{tree}")" != "$(git rev-parse "${MERGE_SHA}^{tree}")" ]; then
                echo "::error::Merged release tree differs from its prepared source; refusing publication."
                exit 1
              fi
              echo "release_sha=${RELEASE_SHA}" >> "$GITHUB_OUTPUT"
              echo "Release-state PR #${PR_NUMBER} merged at ${MERGE_SHA}; publishing stamped source ${RELEASE_SHA}"
              exit 0
            fi

            FAILURES="$(retry_gh "Read release-state PR checks" gh pr view "$PR_NUMBER" --json statusCheckRollup --jq '[.statusCheckRollup[] | select(.conclusion == "FAILURE" or .conclusion == "CANCELLED" or .conclusion == "TIMED_OUT")] | length')"
            if [ "$FAILURES" != "0" ]; then
              echo "::error::Release-state PR #${PR_NUMBER} has failing checks; refusing to publish npm packages."
              retry_gh "Read failing release-state PR checks" gh pr view "$PR_NUMBER" --json url,statusCheckRollup --jq '{url, statusCheckRollup}' || true
              exit 1
            fi

            echo "Waiting for release-state PR #${PR_NUMBER} to merge (attempt ${attempt}/120)"
            sleep 30
          done

          echo "::error::Timed out waiting for release-state PR #${PR_NUMBER} to merge; refusing to publish npm packages."
          exit 1

      - name: Write job summary
        if: always()
        shell: bash
        env:
          JOB_SUMMARY_TITLE: Release source-state gate
          JOB_SUMMARY_STATUS: ${{ job.status }}
          JOB_SUMMARY_DETAILS: |
            - Ensures the `release: v${{ needs.release-metadata.outputs.version }}` source-state commit exists on the release branch before npm publish starts.
            - Creates and auto-merges a release-state PR when source manifests need stamping.
            - Refuses to publish packages if protected-branch rules or required checks prevent that PR from merging.
          JOB_SUMMARY_NEXT: If this fails, merge the release-state PR or fix its checks before rerunning publish.
        run: GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" bash .github/scripts/write-job-summary.sh

  verify-exact-pinned-stamp:
    needs: [prepare-release-state, release-metadata]
    if: inputs.source_sha != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      independent_ci_required: ${{ steps.verify.outputs.independent_ci_required }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare-release-state.outputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - name: Reproduce release bytes on the exact stamp
        id: verify
        env:
          PIN: ${{ inputs.source_sha }}
          STAMP: ${{ needs.prepare-release-state.outputs.release_sha }}
          VERSION: ${{ needs.release-metadata.outputs.version }}
          NATIVE_VERSION: ${{ needs.release-metadata.outputs.omo_ai_version }}
        run: |
          set -euo pipefail
          proof="$(mktemp -d)"
          trap 'rm -rf "$proof"' EXIT
          for file in release-state-paths.mjs verify-release-stamp-tree.mjs; do
            git show "${GITHUB_SHA}:script/${file}" > "$proof/$file"
          done
          node "$proof/release-state-paths.mjs" --check-versions "$PIN" "$STAMP" "$VERSION" "$NATIVE_VERSION"
          if ! node "$proof/release-state-paths.mjs" --check-stamp "$PIN" "$STAMP"; then
            # Never execute a generated artifact or generator from a source-changing delta.
            # This is not proof: both tag paths must instead establish CI for the stamp SHA.
            echo "independent_ci_required=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Keep runner tokens, package credentials and user Git config out of repo generators.
          mkdir "$proof/home"
          env -i PATH="$PATH" HOME="$proof/home" CI=true GIT_CONFIG_NOSYSTEM=1 \
            node "$proof/verify-release-stamp-tree.mjs" "$(git rev-parse --verify "$PIN")" "$STAMP" "$VERSION" "$NATIVE_VERSION"

      - name: Write job summary
        if: always()
        env:
          JOB_SUMMARY_TITLE: Pinned release stamp verification
          JOB_SUMMARY_STATUS: ${{ job.status }}
          JOB_SUMMARY_DETAILS: |
            Checks the prepared tree against the pin or requires independent push CI for a source-changing delta.
          JOB_SUMMARY_NEXT: Inspect the stamp verification step before tagging or dispatching.
        run: GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" bash .github/scripts/write-job-summary.sh

  dispatch-provenance-safe-publish:
    # Pin until this release/deploy path is proven on Ubuntu 26.04: #9936.
    runs-on: ubuntu-24.04
    needs: [pin-ci, release-metadata, prepare-release-state, verify-exact-pinned-stamp]
    if: >-
      always() &&
      github.repository == 'code-yeongyu/oh-my-openagent' &&
      inputs.prepared_release_sha == '' &&
      inputs.operator_darwin_artifacts == '' &&
      inputs.operator_darwin_manifest_sha256 == '' &&
      (needs.verify-exact-pinned-stamp.result == 'success' || (inputs.source_sha == '' && needs.verify-exact-pinned-stamp.result == 'skipped')) &&
      needs.release-metadata.result == 'success' &&
      needs.prepare-release-state.result == 'success'
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare-release-state.outputs.release_sha }}

      # The parent's record that it accepted its own CI run for this source and handed it to the child of this prepared
      # source. Only this run can attach an artifact to itself, so the child, which finds the parent from the run's ref,
      # treats the artifact's name as the parent's binding of source, prepared SHA and CI run.
      - name: Record the release's own CI receipt for the child
        if: needs.pin-ci.outputs.ci_run_id != ''
        run: printf 'Accepted by this release attempt for its tagged child.\n' > "$RUNNER_TEMP/release-ci-receipt.txt"

      - name: Upload the release's own CI receipt
        if: needs.pin-ci.outputs.ci_run_id != ''
        uses: actions/upload-artifact@v6
        with:
          name: release-ci-receipt-${{ needs.pin-ci.outputs.source_sha }}-${{ needs.prepare-release-state.outputs.release_sha }}-${{ needs.pin-ci.outputs.ci_run_id }}
          path: ${{ runner.temp }}/release-ci-receipt.txt
          retention-days: 7
          if-no-files-found: error

      - name: Tag prepared source and dispatch provenance-safe publish
        env:
          INDEPENDENT_CI_REQUIRED: ${{ needs.verify-exact-pinned-stamp.outputs.independent_ci_required }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_CI_RUN: ${{ needs.pin-ci.outputs.ci_run_id }}
          VERSION: ${{ needs.release-metadata.outputs.version }}
          RELEASE_SHA: ${{ needs.prepare-release-state.outputs.release_sha }}
          BUMP: ${{ inputs.bump }}
          SKIP_PLATFORM: ${{ inputs.skip_platform }}
          PUBLISH_LAZYCODEX: ${{ inputs.publish_lazycodex }}
          LAZYCODEX_ONLY: ${{ inputs.lazycodex_only }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [ "$(git rev-parse HEAD)" != "$RELEASE_SHA" ]; then
            echo "::error::Checked-out source does not match prepared release SHA ${RELEASE_SHA}."
            exit 1
          fi

          source_args=(-f "prepared_release_sha=${RELEASE_SHA}")
          if [ -n "$SOURCE_SHA" ]; then
            pin="$(git rev-parse --verify "$SOURCE_SHA")"
            if [ "$(git rev-parse HEAD^1)" != "$pin" ]; then
              echo "::error::Refusing to tag ${RELEASE_SHA}: its first parent is not ${SOURCE_SHA}."
              exit 1
            fi
            proof_dir="$(mktemp -d "$RUNNER_TEMP/release-proof.XXXXXXXXXX")"
            trap 'rm -rf "$proof_dir"' EXIT
            proof_dir="$(cd "$proof_dir" && pwd -P)"
            if ! git show "${GITHUB_SHA}:script/release-state-paths.mjs" > "$proof_dir/dispatch.mjs"; then
              # The checkout targeted the stamp, not the dispatch ref, which may have advanced.
              git fetch --no-tags origin "$GITHUB_SHA"
              git show "${GITHUB_SHA}:script/release-state-paths.mjs" > "$proof_dir/dispatch.mjs"
            fi
            if [ "${INDEPENDENT_CI_REQUIRED:-}" = true ] || ! node "$proof_dir/dispatch.mjs" --check-stamp "$pin" "$RELEASE_SHA"; then
              # A reused stamp may already have exact push CI even though it cannot reuse the pin's CI.
              git show "${GITHUB_SHA}:.github/scripts/release-push-proof.sh" > "$proof_dir/release-push-proof.sh"
              git show "${GITHUB_SHA}:.github/scripts/release-push-proof.mjs" > "$proof_dir/release-push-proof.mjs"
              git show "${GITHUB_SHA}:.github/scripts/release-proof-contract.json" > "$proof_dir/release-proof-contract.json"
              source "$proof_dir/release-push-proof.sh"
              runs="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
                -f event=push -f "head_sha=${RELEASE_SHA}" -f status=success -f per_page=100)"
              push_run="$(select_green_push "$RELEASE_SHA" <<< "$runs")"
              if [ -z "$push_run" ]; then
                echo "::error::No exact push CI for release stamp ${RELEASE_SHA}; refusing to tag or dispatch."
                exit 1
              fi
              require_push_validation "$GITHUB_REPOSITORY" "$push_run"
            fi

            # The tag owns the child workflow; a legacy child cannot enforce the pin.
            accepts_pin="$(git show "${RELEASE_SHA}:.github/workflows/publish.yml" |
              yq '.on.workflow_dispatch.inputs | has("source_sha")' -)"
            if [ "$accepts_pin" = true ]; then
              source_args+=(-f "source_sha=${SOURCE_SHA}")
            fi
            # The child revalidates the parent's own CI run for the pin; without it, it would need a green push.
            accepts_run="$(git show "${RELEASE_SHA}:.github/workflows/publish.yml" |
              yq '.on.workflow_dispatch.inputs | has("source_ci_run")' -)"
            if [ -n "${SOURCE_CI_RUN:-}" ] && [ "$accepts_run" = true ]; then
              source_args+=(-f "source_ci_run=${SOURCE_CI_RUN}")
            fi
          fi

          # LazyCodex-only releases tag the source under their own namespace so the omo release
          # path can still refuse the number (and vice versa) instead of reusing a foreign tag.
          RELEASE_TAG="v${VERSION}"
          if [ "${LAZYCODEX_ONLY:-}" = "true" ]; then
            RELEASE_TAG="lazycodex-v${VERSION}"
          fi

          git fetch --force --tags
          if git rev-parse -q --verify "refs/tags/${RELEASE_TAG}" >/dev/null; then
            TAG_SHA="$(git rev-list --max-count=1 "${RELEASE_TAG}")"
            if [ "$TAG_SHA" != "$RELEASE_SHA" ]; then
              echo "::error::Existing tag ${RELEASE_TAG} points to ${TAG_SHA}, not prepared release SHA ${RELEASE_SHA}."
              exit 1
            fi
          else
            git tag "${RELEASE_TAG}" "$RELEASE_SHA"
            git push origin "${RELEASE_TAG}"
          fi

          gh workflow run publish.yml --ref "${RELEASE_TAG}" \
            -f "bump=${BUMP}" \
            -f "version=${VERSION}" \
            -f "skip_platform=${SKIP_PLATFORM}" \
            -f "publish_lazycodex=${PUBLISH_LAZYCODEX}" \
            -f "lazycodex_only=${LAZYCODEX_ONLY}" \
            "${source_args[@]}"

      - name: Write job summary
        if: always()
        shell: bash
        env:
          JOB_SUMMARY_TITLE: Provenance-safe publish dispatch
          JOB_SUMMARY_STATUS: ${{ job.status }}
          JOB_SUMMARY_DETAILS: |
            - Tags the exact prepared source state.
            - Dispatches the publish workflow from that tag so npm provenance matches the built source.
          JOB_SUMMARY_NEXT: Resolve a source/tag mismatch before retrying release publication.
        run: GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" bash .github/scripts/write-job-summary.sh

  tag-prepared-source:
    # A run dispatched directly with prepared_release_sha (not from the tag the parent pushes) has no release tag
    # yet, and `gh release create` would make GitHub create it from the default branch head. This job tags the
    # prepared source, or refuses a tag that points elsewhere. publish-platform and publish-main both need it, so
    # no package is published before the tag is right.
    # Pin until this release/deploy path is proven on Ubuntu 26.04: #9928.
    runs-on: ubuntu-24.04
    needs: [gate-reuse, preflight-trust, release-metadata, prepare-release-state, verify-exact-pinned-stamp]
    if: >-
      always() &&
      github.repository == 'code-yeongyu/oh-my-openagent' &&
      inputs.prepared_release_sha != '' &&
      (needs.verify-exact-pinned-stamp.result == 'success' || (inputs.source_sha == '' && needs.verify-exact-pinned-stamp.result == 'skipped')) &&
      needs.gate-reuse.result == 'success' &&
      needs.preflight-trust.result == 'success' &&
      needs.release-metadata.result == 'success' &&
      needs.prepare-release-state.result == 'success'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare-release-state.outputs.release_sha }}

      - run: git fetch --force --tags

      - name: Tag prepared release source
        env:
          INDEPENDENT_CI_REQUIRED: ${{ needs.verify-exact-pinned-stamp.outputs.independent_ci_required }}
          EXACT_STAMP_CI: ${{ needs.gate-reuse.outputs.exact_stamp_ci }}
          VERSION: ${{ needs.release-metadata.outputs.version }}
          RELEASE_SHA: ${{ inputs.prepared_release_sha }}
          LAZYCODEX_ONLY: ${{ inputs.lazycodex_only }}
        run: |
          set -euo pipefail

          if [ "${INDEPENDENT_CI_REQUIRED:-}" = true ] && [ "${EXACT_STAMP_CI:-}" != "$RELEASE_SHA" ]; then
            echo "::error::Refusing to tag a source-changing delta without successful CI on the exact stamp."
            exit 1
          fi

          if [ "$(git rev-parse HEAD)" != "$RELEASE_SHA" ]; then
            echo "::error::Checked-out source does not match prepared release SHA ${RELEASE_SHA}."
            exit 1
          fi

          RELEASE_TAG="v${VERSION}"
          if [ "${LAZYCODEX_ONLY:-}" = "true" ]; then
            RELEASE_TAG="lazycodex-v${VERSION}"
          fi

          if git rev-parse -q --verify "refs/tags/${RELEASE_TAG}" >/dev/null; then
            TAG_SHA="$(git rev-list --max-count=1 "${RELEASE_TAG}")"
            if [ "$TAG_SHA" != "$RELEASE_SHA" ]; then
              echo "::error::Existing tag ${RELEASE_TAG} points to ${TAG_SHA}, not prepared release SHA ${RELEASE_SHA}."
              exit 1
            fi
          else
            git tag "${RELEASE_TAG}" "$RELEASE_SHA"
            git push origin "${RELEASE_TAG}"
          fi

      - name: Write job summary
        if: always()
        shell: bash
        env:
          JOB_SUMMARY_TITLE: Prepared source tag
          JOB_SUMMARY_STATUS: ${{ job.status }}
          JOB_SUMMARY_DETAILS: |
            - Creates the release tag at prepared_release_sha, or verifies an existing one points there.
            - Runs before publish-platform and publish-main, so no package is published under a foreign tag.
          JOB_SUMMARY_NEXT: If an existing tag points elsewhere, bump to an unused version or remove the stray tag before rerunning.
        run: GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" bash .github/scripts/write-job-summary.sh

  publish-main:
    # Pin until this release/deploy path is proven on Ubuntu 26.04: #9937.
    runs-on: ubuntu-24.04
    # post-publish-verify runs the published-package probes in a job that cannot block the release, so the
    # lazycodex publish decision has to cross the job boundary as an output.
    outputs:
      lazycodex_publish_skipped: ${{ steps.check-lazycodex.outputs.skip }}
    needs: [gate-reuse, preflight-trust, release-metadata, prepare-release-state, tag-prepared-source, publish-platform]
    if: >-
      always() &&
      github.repository == 'code-yeongyu/oh-my-openagent' &&
      inputs.prepared_release_sha != '' &&
      needs.gate-reuse.result == 'success' &&
      needs.preflight-trust.result == 'success' &&
      needs.release-metadata.result == 'success' &&
      needs.prepare-release-state.result == 'success' &&
      needs.tag-prepared-source.result == 'success' &&
      (inputs.skip_platform == true || inputs.lazycodex_only == true || needs.publish-platform.result == 'success')
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Publish the prepared release commit, not the workflow-dispatch SHA.
          ref: ${{ needs.prepare-release-state.outputs.release_sha }}

      - run: git fetch --force --tags

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm for trusted publishing (>=11.5.1)
        run: npm install -g npm@11.18.0

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Verify platform packages are published
        if: inputs.lazycodex_only != true
        env:
          VERSION: ${{ needs.release-metadata.outputs.version }}
        run: |
          set -uo pipefail

          PLATFORMS=(darwin-arm64 darwin-x64 darwin-x64-baseline linux-x64 linux-x64-baseline linux-arm64 linux-x64-musl linux-x64-musl-baseline linux-arm64-musl windows-x64 windows-x64-baseline windows-arm64)
          # npm reads have lagged successful publishes by 10-25 minutes in this release lane
          # (#8691: 12-16 min on beta.84; 5.1.1: linux-arm64-musl still 404 when the old
          # 5-minute window closed). 120 x 15s = 30 minutes covers that with margin, so the
          # wrapper publish does not strand an otherwise successful platform release.
          ATTEMPTS="${PROPAGATION_ATTEMPTS:-120}"
          DELAY="${PROPAGATION_DELAY:-15}"

          PENDING=()
          for platform in "${PLATFORMS[@]}"; do
            for family in oh-my-opencode oh-my-openagent; do
              PENDING+=("${family}-${platform}")
            done
          done

          # The platform publish jobs have already succeeded when this runs, but the registry read
          # path lags the write: a version can 404 for a short while after a successful publish.
          # A single probe therefore proves nothing, so re-probe only what is still pending and
          # fail once the window closes - a genuinely unpublished package still blocks the release.
          for attempt in $(seq 1 "$ATTEMPTS"); do
            STILL_PENDING=()
            for pkg in "${PENDING[@]}"; do
              STATUS="$(curl -sS -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/${pkg}/${VERSION}" || echo 000)"
              if [ "$STATUS" = "200" ]; then
                echo "OK   ${pkg}@${VERSION}"
              else
                # 000 means curl itself failed (network/DNS), which is not evidence of absence.
                echo "WAIT ${pkg}@${VERSION} (HTTP ${STATUS})"
                STILL_PENDING+=("${pkg}")
              fi
            done

            if [ "${#STILL_PENDING[@]}" -eq 0 ]; then
              echo "All ${#PENDING[@]} platform package(s) are visible at ${VERSION}"
              break
            fi

            PENDING=("${STILL_PENDING[@]}")

            if [ "$attempt" -ge "$ATTEMPTS" ]; then
              echo "::error::Missing platform package(s); refusing to publish wrappers. Still absent after ${ATTEMPTS} attempts:"
              for pkg in "${PENDING[@]}"; do
                echo "::error::  ${pkg}@${VERSION}"
              done
              exit 1
            fi

            echo "Waiting for platform package registry propagation (attempt ${attempt}/${ATTEMPTS}; ${#PENDING[@]} pending)"
            sleep "$DELAY"
          done

      - name: Check if already published
        id: check
        env:
          VERSION: ${{ needs.release-metadata.outputs.version }}
          LAZYCODEX_ONLY: ${{ inputs.lazycodex_only }}
        run: |
          if [ "$LAZYCODEX_ONLY" = "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "LazyCodex-only release: oh-my-opencode is not published"
            exit 0
          fi
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://registry.npmjs.org/oh-my-opencode/${VERSION}")
          if [ "$STATUS" = "200" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "✓ oh-my-opencode@${VERSION} already published"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check if oh-my-openagent already published
        id: check-openagent
        env:
          VERSION: ${{ needs.release-metadata.outputs.version }}
          LAZYCODEX_ONLY: ${{ inputs.lazycodex_only }}
        run: |
          if [ "$LAZYCODEX_ONLY" = "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "LazyCodex-only release: oh-my-openagent is not published"
            exit 0
          fi
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://registry.npmjs.org/oh-my-openagent/${VERSION}")
          if [ "$STATUS" = "200" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "✓ oh-my-openagent@${VERSION} already published"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check if lazycodex-ai already published
        id: check-lazycodex
        if: inputs.publish_lazycodex == true
        env:
          VERSION: ${{ needs.release-metadata.outputs.version }}
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://registry.npmjs.org/lazycodex-ai/${VERSION}")
          if [ "$STATUS" = "200" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "✓ lazycodex-ai@${VERSION} already published"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update version
        if: >-
          steps.check.outputs.skip != 'true' ||
          steps.check-openagent.outputs.skip != 'true' ||
          (inputs.publish_lazycodex == true && steps.check-lazycodex.outputs.skip != 'true')
        env:
          VERSION: ${{ needs.release-metadata.outputs.version }}
          OMO_AI_VERSION: ${{ needs.release-metadata.outputs.omo_ai_version }}
        run: |
          jq --arg v "$VERSION" '.version = $v' package.json > tmp.json && mv tmp.json package.json
          jq --arg v "$OMO_AI_VERSION" '.version = $v' packages/omo-native/package.json > tmp.json && mv tmp.json packages/omo-native/package.json

          for platform in darwin-arm64 darwin-x64 darwin-x64-baseline linux-x64 linux-x64-baseline linux-arm64 linux-x64-musl linux-x64-musl-baseline linux-arm64-musl windows-x64 windows-x64-baseline windows-arm64; do
            package_dir="packages/oh-my-opencode-${platform}"
            jq --arg v "$VERSION" '.version = $v' "${package_dir}/package.json" > tmp.json
            mv tmp.json "${package_dir}/package.json"
          done

          jq --arg v "$VERSION" '.optionalDependencies = (.optionalDependencies | to_entries | map(.value = $v) | from_entries)' package.json > tmp.json && mv tmp.json package.json

      # PAYLOAD SOURCE OF TRUTH: this step and "Build Codex plugin components" below produce
      # every artifact in the published `files` payload. The npm publish steps run with
      # --ignore-scripts, so they do NOT re-run prepublishOnly/prepack/prepare at pack time.
      # If these explicit builds are ever removed or reordered, the publishes would ship a
      # stale or empty dist. Keep them before every publish.
      - name: Build main package
        if: >-
          steps.check.outputs.skip != 'true' ||
          steps.check-openagent.outputs.skip != 'true' ||
          (inputs.publish_lazycodex == true && steps.check-lazycodex.outputs.skip != 'true')
        run: bun run build:codex-install && bun run build:lsp-tools-mcp && bun run build:lsp-daemon && bun run build

      # Must run before every publish below: all three packages ship the plugin tree (lazycodex#45).
      - name: Build Codex plugin components
        if: >-
          steps.check.outputs.skip != 'true' ||
          steps.check-openagent.outputs.skip != 'true' ||
          (inputs.publish_lazycodex == true && steps.check-lazycodex.outputs.skip != 'true')
        env:
          VERSION: ${{ needs.release-metadata.outputs.version }}
          LAZYCODEX_RELEASE_VERSION: ${{ needs.release-metadata.outputs.version }}
        run: |
          jq --arg v "$VERSION" '.version = $v' packages/omo-codex/plugin/.codex-plugin/plugin.json > tmp.json
          mv tmp.json packages/omo-codex/plugin/.codex-plugin/plugin.json
          jq --arg v "$VERSION" '.version = $v' packages/omo-codex/plugin/package.json > tmp.json
          mv tmp.json packages/omo-codex/plugin/package.json
          # A LazyCodex-only release builds an unstamped tree: bring the component manifests and the
          # LazyCodex(<version>) hook status messages to the release version too (no-op when the
          # release commit already stamped them).
          node packages/omo-codex/plugin/scripts/sync-version.mjs
          node packages/omo-codex/plugin/scripts/sync-hook-status-messages.mjs
          npm --prefix packages/omo-codex/plugin ci
          bun run --cwd packages/omo-codex/plugin build

      # Payload containment gate: publishes below run with --ignore-scripts, so this is the
      # last check that no senpi payload, nested node_modules, or retired component residue
      # ships in the tarball (lazycodex-ai@4.15.1 shipped ~699MB of nested node_modules).
      - name: Verify npm payload containment
        if: >-
          steps.check.outputs.skip != 'true' ||
          steps.check-openagent.outputs.skip != 'true' ||
          (inputs.publish_lazycodex == true && steps.check-lazycodex.outputs.skip != 'true')
        run: node script/verify-npm-payload.mjs

      - name: Build omo-ai payload
        if: needs.release-metadata.outputs.already_published != 'true' && inputs.lazycodex_only != true
        run: bun run build:omo-native

      # omo-ai ships the signed keychain helper (#11262) as bin/darwin/omo-keychain. A normal run takes
      # it from this run's keychain-helper job (the tarball keeps its mode); a skip_platform run has no
      # such job and restores the same asset from the existing release by digest instead.
      - name: Download keychain helper
        if: inputs.skip_platform != true && inputs.lazycodex_only != true && needs.release-metadata.outputs.already_published != 'true'
        uses: actions/download-artifact@v8
        with:
          name: keychain-helper
          path: .omo/keychain-helper

      - name: Stage keychain helper into the omo-ai payload
        if: inputs.skip_platform != true && inputs.lazycodex_only != true && needs.release-metadata.outputs.already_published != 'true'
        run: |
          set -euo pipefail
          mkdir -p packages/omo-native/bin/darwin
          tar -xzpf .omo/keychain-helper/omo-keychain.tar.gz -C packages/omo-native/bin/darwin
          test -x packages/omo-native/bin/darwin/omo-keychain

      # Digest-verified, not requirement-verified: this job runs on ubuntu, and the requirement gate ran
      # in the keychain-helper job that produced the asset. A release without the asset fails here.
      - name: Restore keychain helper from the existing release
        if: inputs.skip_platform == true && inputs.lazycodex_only != true && needs.release-metadata.outputs.already_published != 'true'
        env:
          VERSION: ${{ needs.release-metadata.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          dir="$(mktemp -d)"
          trap 'rm -rf "$dir"' EXIT
          gh release download "v${VERSION}" --pattern omo-keychain-darwin-universal --pattern SHA256SUMS --dir "$dir"
          test -f "$dir/omo-keychain-darwin-universal"
          (cd "$dir" && shasum -a 256 -c --ignore-missing SHA256SUMS)
          mkdir -p packages/omo-native/bin/darwin
          install -m 0755 "$dir/omo-keychain-darwin-universal" packages/omo-native/bin/darwin/omo-keychain

      - name: Verify omo-ai payload
        if: needs.release-metadata.outputs.already_published != 'true' && inputs.lazycodex_only != true
        run: node script/verify-omo-ai-payload.mjs --release

      - name: Strip token auth from .npmrc to force OIDC
        if: >-
          steps.check.outputs.skip != 'true' ||
          steps.check-openagent.outputs.skip != 'true' ||
          (inputs.publish_lazycodex == true && steps.check-lazycodex.outputs.skip != 'true')
        run: |
          for f in .npmrc "$HOME/.npmrc"; do
            if [ -f "$f" ]; then
              sed -i.bak '/_authToken/d' "$f"
              rm -f "$f.bak"
              echo "Cleaned $f"
            fi
          done

      - name: Publish oh-my-opencode
        if: steps.check.outputs.skip != 'true'
        env:
          DIST_TAG: ${{ needs.release-metadata.outputs.dist_tag }}
          NPM_CONFIG_PROVENANCE: true
        run: |
          if [ -n "$DIST_TAG" ]; then
            npm publish --ignore-scripts --access public --provenance --tag "$DIST_TAG" --loglevel verbose
          else
            npm publish --ignore-scripts --access public --provenance --tag latest --loglevel verbose
          fi

      - name: Publish oh-my-openagent
        if: steps.check-openagent.outputs.skip != 'true'
        env:
          VERSION: ${{ needs.release-metadata.outputs.version }}
          DIST_TAG: ${{ needs.release-metadata.outputs.dist_tag }}
          NPM_CONFIG_PROVENANCE: true
        run: |
          # Update package name, version, and optionalDependencies for oh-my-openagent
          jq --arg v "$VERSION" '
            .name = "oh-my-openagent" |
            .version = $v |
            .optionalDependencies = (
              .optionalDependencies | to_entries |
              map(.key = (.key | sub("^oh-my-opencode-"; "oh-my-openagent-")) | .value = $v) |
              from_entries
            )
          ' package.json > tmp.json && mv tmp.json package.json

          if [ -n "$DIST_TAG" ]; then
            npm publish --ignore-scripts --access public --provenance --tag "$DIST_TAG" --loglevel verbose
          else
            npm publish --ignore-scripts --access public --provenance --tag latest --loglevel verbose
          fi

      - name: Restore package.json
        if: always() && steps.check-openagent.outputs.skip != 'true'
        run: |
          git checkout -- package.json

      - name: Publish lazycodex-ai
        if: inputs.publish_lazycodex == true && steps.check-lazycodex.outputs.skip != 'true'
        env:
          OMO_VERSION: ${{ needs.release-metadata.outputs.version }}
          DIST_TAG: ${{ needs.release-metadata.outputs.dist_tag }}
          NPM_CONFIG_PROVENANCE: true
        run: |
          jq --arg omo_version "$OMO_VERSION" '
            .name = "lazycodex-ai" |
            .version = $omo_version |
            .bin = { "lazycodex-ai": "packages/omo-codex/scripts/install-local.mjs", "lazycodex": "packages/omo-codex/scripts/install-local.mjs" } |
            .files = ["dist/cli", "dist/cli-node", "script/qa/strip-ansi.mjs", "script/qa/web-terminal-redaction.d.mts", "script/qa/web-terminal-redaction.mjs", "script/qa/web-terminal-visual-qa.mjs", "script/qa/xterm-live-terminal.mjs", "docs/reference/github-attachment-upload.md", "docs/reference/web-terminal-visual-qa.md", "packages/omo-codex/scripts/install-local.mjs", "packages/omo-codex/scripts/install-dist", "packages/omo-codex/plugin", "packages/omo-codex/plugin/components/bootstrap/dist/cli.js", "packages/omo-codex/plugin/components/bootstrap/scripts/bootstrap.ps1", "packages/omo-codex/plugin/components/bootstrap/scripts/node-dispatch.ps1", "packages/omo-codex/plugin/components/comment-checker/dist/cli.js", "packages/omo-codex/plugin/components/git-bash/dist/cli.js", "packages/omo-codex/plugin/components/lazycodex-executor-verify/dist/cli.js", "packages/omo-codex/plugin/components/lsp/dist/cli.js", "packages/omo-codex/plugin/components/rules/dist/cli.js", "packages/omo-codex/plugin/components/ulw-execute-continuation/dist/cli.js", "packages/omo-codex/plugin/components/teammode/dist/cli.js", "packages/omo-codex/plugin/components/telemetry/dist/cli.js", "packages/omo-codex/plugin/components/ultrawork/dist/cli.js", "packages/omo-codex/plugin/components/ulw-loop/dist/cli.js", "packages/prompts-core/prompts/ultrawork/codex.md", "packages/omo-codex/plugin/.codex-plugin", "packages/omo-codex/marketplace.json", "packages/omo-codex/lazycodex-repository", "packages/lsp-core/package.json", "packages/lsp-core/src", "packages/lsp-tools-mcp/package.json", "packages/lsp-tools-mcp/dist", "packages/lsp-daemon/package.json", "packages/lsp-daemon/dist", "packages/git-bash-mcp/dist", "packages/shared-skills/package.json", "packages/shared-skills/index.mjs", "packages/shared-skills/skill-source-filter.d.ts", "packages/shared-skills/skill-source-filter.mjs", "packages/shared-skills/skills", "!packages/omo-codex/plugin/node_modules", "!packages/omo-codex/plugin/**/node_modules", "!packages/omo-codex/plugin/components/workflow-selector"] |
            .scripts = {} |
            .dependencies = {} |
            .devDependencies = {} |
            .optionalDependencies = {} |
            .peerDependencies = {}
          ' package.json > tmp.json && mv tmp.json package.json

          node script/verify-npm-payload.mjs

          if [ -n "$DIST_TAG" ]; then
            npm publish --ignore-scripts --access public --provenance --tag "$DIST_TAG" --loglevel verbose
          else
            npm publish --ignore-scripts --access public --provenance --tag latest --loglevel verbose
          fi

      - name: Strip token auth before omo-ai publish
        if: needs.release-metadata.outputs.already_published != 'true' && inputs.lazycodex_only != true
        run: |
          for f in .npmrc "$HOME/.npmrc"; do
            if [ -f "$f" ]; then
              sed -i.bak '/_authToken/d' "$f"
              rm -f "$f.bak"
              echo "Cleaned $f"
            fi
          done

      - name: Publish omo-ai
        if: needs.release-metadata.outputs.already_published != 'true' && inputs.lazycodex_only != true
        working-directory: packages/omo-native
        env:
          OMO_AI_DIST_TAG: ${{ needs.release-metadata.outputs.omo_ai_dist_tag }}
        run: npm publish --ignore-scripts --access public --provenance --tag "$OMO_AI_DIST_TAG"

      - name: Restore package.json after lazycodex-ai publish attempt
        if: always() && inputs.publish_lazycodex == true && steps.check-lazycodex.outputs.skip != 'true'
        run: |
          git checkout -- package.json

      - name: Write job summary
        if: always()
        shell: bash
        env:
          JOB_SUMMARY_TITLE: Wrapper package publish
          JOB_SUMMARY_STATUS: ${{ job.status }}
          JOB_SUMMARY_DETAILS: |
            - Verifies platform packages exist before wrapper publish.
            - Publishes `oh-my-opencode`, `oh-my-openagent`, and optionally `lazycodex-ai`.
            - omo-ai mapped version: `${{ needs.release-metadata.outputs.omo_ai_version }}` (already published before this run: `${{ needs.release-metadata.outputs.already_published }}`).
            - omo-ai beta publish, registry readiness, dist-tag guard, and live-install gates: `${{ job.status }}`.
            - Smoke-tests the published LazyCodex package when it was published.
          JOB_SUMMARY_NEXT: Check package existence probes first, then npm publish logs and the LazyCodex smoke section.
        run: GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" bash .github/scripts/write-job-summary.sh

  verify-release-notes:
    # Pin until this release/deploy path is proven on Ubuntu 26.04: #9938.
    runs-on: ubuntu-24.04
    needs: [release-metadata, prepare-release-state]
    # A LazyCodex-only release creates no omo GitHub release, so it has no CHANGELOG section to verify.
    if: >-
      always() &&
      inputs.lazycodex_only != true &&
      needs.release-metadata.result == 'success' &&
      needs.prepare-release-state.result == 'success'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare-release-state.outputs.release_sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      # Fail before the platform builds rather than after them: the release body is extracted
      # from this commit's CHANGELOG section, so a source prepared without one can never publish.
      - name: Verify the release notes exist on the prepared source
        env:
          VERSION: ${{ needs.release-metadata.outputs.version }}
        run: bun run script/print-release-notes.ts "$VERSION" > /dev/null

      - name: Write job summary
        if: always()
        shell: bash
        env:
          JOB_SUMMARY_TITLE: Release notes preflight
          JOB_SUMMARY_STATUS: ${{ job.status }}
          JOB_SUMMARY_DETAILS: |
            - Extracts this version's CHANGELOG section from the prepared release source.
            - Fails closed when the section is absent, empty, or duplicated.
            - Runs before the platform builds so a source without notes cannot burn a tag.
          JOB_SUMMARY_NEXT: Add changes/unreleased fragments and prepare a fresh release state.
        run: GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" bash .github/scripts/write-job-summary.sh

  publish-platform:
    needs: [gate-reuse, preflight-trust, release-metadata, prepare-release-state, tag-prepared-source, verify-release-notes]
    if: >-
      always() &&
      github.repository == 'code-yeongyu/oh-my-openagent' &&
      inputs.prepared_release_sha != '' &&
      inputs.skip_platform != true &&
      inputs.lazycodex_only != true &&
      needs.gate-reuse.result == 'success' &&
      needs.preflight-trust.result == 'success' &&
      needs.release-metadata.result == 'success' &&
      needs.prepare-release-state.result == 'success' &&
      needs.tag-prepared-source.result == 'success'
    uses: ./.github/workflows/publish-platform.yml
    with:
      version: ${{ needs.release-metadata.outputs.version }}
      dist_tag: ${{ needs.release-metadata.outputs.dist_tag }}
      omo_ai_version: ${{ needs.release-metadata.outputs.omo_ai_version }}
      operator_darwin_artifacts: ${{ inputs.operator_darwin_artifacts }}
      operator_darwin_manifest_sha256: ${{ inputs.operator_darwin_manifest_sha256 }}
      prepared_release_sha: ${{ inputs.prepared_release_sha }}
    secrets: inherit

  release:
    # Pin until this release/deploy path is proven on Ubuntu 26.04: #9939.
    runs-on: ubuntu-24.04
    needs: [release-metadata, prepare-release-state, publish-main, publish-platform]
    outputs:
      created: ${{ steps.github-release.outputs.created }}
    if: >-
      always() &&
      inputs.prepared_release_sha != '' &&
      needs.release-metadata.result == 'success' &&
      needs.prepare-release-state.result == 'success' &&
      needs.publish-main.result == 'success' &&
      (inputs.skip_platform == true || inputs.lazycodex_only == true || needs.publish-platform.result == 'success')
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare-release-state.outputs.release_sha }}
          # GH_PAT (sisyphus-dev-ai, workflow scope) can mirror source that
          # includes workflow changes; the default token cannot.
          token: ${{ secrets.GH_PAT }}

      - run: git fetch --force --tags

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Generate changelog
        if: inputs.lazycodex_only != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.release-metadata.outputs.version }}
        run: |
          # The release body comes from the CHANGELOG section stamped into the released commit,
          # so the notes are reviewed in the release PR rather than written after publication.
          # Fail-closed: a missing or empty section aborts before the release is created.
          set -euo pipefail
          bun run script/generate-changelog.ts > /tmp/contributors.md || true
          bun run script/print-release-notes.ts "$VERSION" /tmp/contributors.md > /tmp/changelog.md
          cat /tmp/changelog.md


      # The marketplace mirror and the LazyCodex GitHub release follow every channel that publishes
      # lazycodex-ai: the 5.0.0 line ships as 5.0.0-beta.N only, and a stable-only gate left Codex
      # marketplace users on the last 4.x for months.
      - name: Checkout LazyCodex marketplace
        if: inputs.publish_lazycodex == true
        uses: actions/checkout@v7
        with:
          repository: code-yeongyu/lazycodex
          path: lazycodex-marketplace
          token: ${{ secrets.LAZYCODEX_SYNC_TOKEN }}
          fetch-depth: 0

      - name: Sync LazyCodex Codex marketplace
        if: inputs.publish_lazycodex == true
        env:
          VERSION: ${{ needs.release-metadata.outputs.version }}
          LAZYCODEX_RELEASE_VERSION: ${{ needs.release-metadata.outputs.version }}
        run: |
          jq --arg v "$VERSION" '.version = $v' packages/omo-codex/plugin/.codex-plugin/plugin.json > tmp.json
          mv tmp.json packages/omo-codex/plugin/.codex-plugin/plugin.json
          jq --arg v "$VERSION" '.version = $v' packages/omo-codex/plugin/package.json > tmp.json
          mv tmp.json packages/omo-codex/plugin/package.json
          node packages/omo-codex/plugin/scripts/sync-version.mjs
          node packages/omo-codex/plugin/scripts/sync-hook-status-messages.mjs
          npm --prefix packages/omo-codex/plugin ci
          bun run build:git-bash-mcp
          bun run build:lsp-tools-mcp
          bun run build:lsp-daemon
          bun build packages/omo-opencode/src/cli/index.ts --outdir dist/cli --target bun --format esm
          bun run build:cli-node
          bun run --cwd packages/omo-codex/plugin build
          bun run script/sync-lazycodex-marketplace.ts "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/lazycodex-marketplace"
          cd "$GITHUB_WORKSPACE/lazycodex-marketplace"
          git config --global user.email "code.yeon.gyu@gmail.com"
          git config --global user.name "YeonGyu-Kim"
          git add .agents/plugins/marketplace.json .github/workflows/pr-source-guidance.yml plugins/omo
          if git diff --cached --quiet; then
            echo "LazyCodex marketplace already up to date"
          else
            git commit -m "chore: sync Codex marketplace v${VERSION}"
            git push origin HEAD:main
          fi

      - name: Resolve LazyCodex release payload
        id: lazycodex-release-state
        if: inputs.publish_lazycodex == true
        env:
          PREVIOUS_LAZYCODEX_VERSION: ${{ needs.release-metadata.outputs.previous_lazycodex_version }}
        run: |
          set -euo pipefail

          if [ -z "$PREVIOUS_LAZYCODEX_VERSION" ]; then
            echo "No previous lazycodex-ai package found"
            echo "lazycodex_changed=true" >> "$GITHUB_OUTPUT"
            echo "previous_lazycodex_version=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          STATE_DIR="$(mktemp -d)"
          trap 'rm -rf "$STATE_DIR"' EXIT
          PACKAGE_TGZ="$(npm pack "lazycodex-ai@${PREVIOUS_LAZYCODEX_VERSION}" --pack-destination "$STATE_DIR" --silent)"
          tar -xzf "$STATE_DIR/$PACKAGE_TGZ" -C "$STATE_DIR"

          PREVIOUS_PACKAGE_ROOT="$STATE_DIR/package"
          PREVIOUS_MARKETPLACE_ROOT="$STATE_DIR/previous-lazycodex"
          CURRENT_MARKETPLACE_ROOT="$GITHUB_WORKSPACE/lazycodex-marketplace"
          bun run script/sync-lazycodex-marketplace.ts "$PREVIOUS_PACKAGE_ROOT" "$PREVIOUS_MARKETPLACE_ROOT" --previous-payload

          if diff -qr "$PREVIOUS_MARKETPLACE_ROOT/.agents/plugins/marketplace.json" "$CURRENT_MARKETPLACE_ROOT/.agents/plugins/marketplace.json" &&
             diff -qr "$PREVIOUS_MARKETPLACE_ROOT/.github/workflows/pr-source-guidance.yml" "$CURRENT_MARKETPLACE_ROOT/.github/workflows/pr-source-guidance.yml" &&
             diff -qr "$PREVIOUS_MARKETPLACE_ROOT/plugins/omo" "$CURRENT_MARKETPLACE_ROOT/plugins/omo"; then
            echo "LazyCodex payload unchanged from lazycodex-ai@${PREVIOUS_LAZYCODEX_VERSION}"
            echo "lazycodex_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "LazyCodex payload changed from lazycodex-ai@${PREVIOUS_LAZYCODEX_VERSION}"
            echo "lazycodex_changed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "previous_lazycodex_version=${PREVIOUS_LAZYCODEX_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create LazyCodex GitHub release
        if: inputs.publish_lazycodex == true && steps.lazycodex-release-state.outputs.lazycodex_changed == 'true'
        env:
          VERSION: ${{ needs.release-metadata.outputs.version }}
          RELEASE_SHA: ${{ needs.prepare-release-state.outputs.release_sha }}
          LAZYCODEX_ONLY: ${{ inputs.lazycodex_only }}
          PREVIOUS_LAZYCODEX_VERSION: ${{ steps.lazycodex-release-state.outputs.previous_lazycodex_version }}
          GH_TOKEN: ${{ secrets.LAZYCODEX_SYNC_TOKEN }}
        run: |
          # pipefail matters: an empty tag list is indistinguishable from "no releases
          # exist yet" and would resolve to --latest, so a failed `gh release list`
          # must fail the step instead of silently mis-assigning the badge.
          set -euo pipefail

          if [ "${LAZYCODEX_ONLY:-}" = "true" ]; then
            SOURCE_DESC="oh-my-openagent ${RELEASE_SHA} (LazyCodex-only release)"
          else
            SOURCE_DESC="oh-my-openagent v${VERSION} (${RELEASE_SHA})"
          fi
          {
            printf '%s\n' "Synced Codex Light marketplace payload from ${SOURCE_DESC}."
            printf '%s\n' ""
            printf '%s\n' "Compared against: lazycodex-ai@${PREVIOUS_LAZYCODEX_VERSION}"
          } > /tmp/lazycodex-release-notes.md

          # Same badge rule as the omo release above (#7743): never `--prerelease`, Latest decided by
          # the highest published semver, so a later stable outranks every beta on the mirror too.
          LATEST_FLAG="$(gh release list --repo code-yeongyu/lazycodex --exclude-drafts --limit 1000 --json tagName --jq '.[].tagName' | bun script/release-latest-flag.ts "$VERSION")"
          gh release view "v${VERSION}" --repo code-yeongyu/lazycodex >/dev/null 2>&1 || \
            gh release create "v${VERSION}" "$LATEST_FLAG" --repo code-yeongyu/lazycodex --target main --title "v${VERSION}" --notes-file /tmp/lazycodex-release-notes.md

      - name: Create GitHub release
        id: github-release
        # Always a full release, never `--prerelease`, on every channel: the npm
        # dist-tag (beta/next) already carries the channel semantics, and every
        # shipping version is `5.0.0-beta.N`.
        #
        # The Latest badge is decided by `script/release-latest-flag.ts` from the
        # highest ALREADY PUBLISHED semver, not by creation order. `gh release
        # create` can only send make_latest true/false, so a bare `--latest`
        # would hand the badge to an older-line hotfix dispatched after a newer
        # release. That badge is load-bearing: `releases/latest/download/<asset>`
        # is the URL the compiled omo binary's self-update hint resolves against
        # (packages/omo-native/compile-entry.ts).
        if: inputs.lazycodex_only != true
        env:
          VERSION: ${{ needs.release-metadata.outputs.version }}
          DIST_TAG: ${{ needs.release-metadata.outputs.dist_tag }}
          RELEASE_SHA: ${{ inputs.prepared_release_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # pipefail matters: an empty tag list is indistinguishable from "no releases
          # exist yet" and would resolve to --latest, so a failed `gh release list`
          # must fail the step instead of silently mis-assigning the badge.
          set -euo pipefail

          # --target only applies when GitHub creates the tag, so an existing tag must already be the prepared source.
          if git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
            TAG_SHA="$(git rev-list --max-count=1 "v${VERSION}")"
            if [ "$TAG_SHA" != "$RELEASE_SHA" ]; then
              echo "::error::Existing tag v${VERSION} points to ${TAG_SHA}, not prepared release SHA ${RELEASE_SHA}."
              exit 1
            fi
          fi

          LATEST_FLAG="$(gh release list --exclude-drafts --limit 1000 --json tagName --jq '.[].tagName' | bun script/release-latest-flag.ts "$VERSION")"
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "created=false" >> "$GITHUB_OUTPUT"
            if [ -z "$DIST_TAG" ]; then
              RECOVERY_NOTICE="The release already existed, so it was not announced again. If the earlier run did not post, re-announce with: gh workflow run release-announce.yml -f tag=v${VERSION} -f dry_run=false"
              printf '::warning::%s\n' "$RECOVERY_NOTICE"
              printf '%s\n' "$RECOVERY_NOTICE" >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            gh release create "v${VERSION}" "$LATEST_FLAG" --target "$RELEASE_SHA" --title "v${VERSION}" --notes-file /tmp/changelog.md
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download release-binary artifacts
        if: inputs.skip_platform != true && inputs.lazycodex_only != true
        uses: actions/download-artifact@v8
        with:
          pattern: release-binary-*
          path: .omo/release-binaries
          merge-multiple: true

      - name: Download desktop-engine artifacts
        if: inputs.skip_platform != true && inputs.lazycodex_only != true
        uses: actions/download-artifact@v8
        with:
          pattern: desktop-engine-*
          path: .omo/release-binaries
          merge-multiple: true

      - name: Upload release assets
        # Runs for both stable and dist-tagged releases: the compiled binaries
        # and SHA256SUMS are part of the release contract on every channel.
        # skip_platform reruns rely on the assets a prior run already uploaded.
        if: inputs.skip_platform != true && inputs.lazycodex_only != true
        env:
          VERSION: ${{ needs.release-metadata.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Partial reruns skip binaries already present on the release. Restore
          # those original bytes before rebuilding the complete checksum set.
          for TARGET in darwin-arm64 darwin-x64 darwin-x64-baseline linux-x64 linux-x64-baseline linux-arm64 linux-x64-musl linux-x64-musl-baseline linux-arm64-musl windows-x64 windows-x64-baseline windows-arm64; do
            NAME="omo-${TARGET}"
            if [[ "$TARGET" == windows-* ]]; then NAME="${NAME}.exe"; fi
            if [ ! -f ".omo/release-binaries/$NAME" ]; then
              gh release download "v${VERSION}" --pattern "$NAME" --dir .omo/release-binaries
            fi
          done
          if [ ! -f .omo/release-binaries/omo-keychain-darwin-universal ]; then
            gh release download "v${VERSION}" --pattern omo-keychain-darwin-universal --dir .omo/release-binaries
          fi
          # Any other asset an earlier run built (e.g. omo-runtime-capabilities.json) is known only from
          # what that run published: restore every SHA256SUMS entry this run did not build (RULING-77).
          PRIOR="$(mktemp -d)"
          trap 'rm -rf "$PRIOR"' EXIT
          if gh release download "v${VERSION}" --pattern SHA256SUMS --dir "$PRIOR"; then
            while read -r _ NAME; do
              if [ ! -f ".omo/release-binaries/$NAME" ]; then
                gh release download "v${VERSION}" --pattern "$NAME" --dir .omo/release-binaries
              fi
            done < "$PRIOR/SHA256SUMS"
          else
            echo "v${VERSION} has no SHA256SUMS yet: nothing beyond the canonical assets to restore"
          fi
          ls -la .omo/release-binaries/
          # The release owns two checksum assets: one for 12 omo launchers plus the
          # keychain helper, and one for the six separately downloadable desktop engines.
          (cd .omo/release-binaries && shasum -a 256 omo-* > SHA256SUMS)
          bun script/desktop-engine-release.ts checksums .omo/release-binaries
          gh release upload "v${VERSION}" .omo/release-binaries/omo-* \
            .omo/release-binaries/SHA256SUMS \
            .omo/release-binaries/senpi-desktop-engine-darwin-* \
            .omo/release-binaries/senpi-desktop-engine-linux-* \
            .omo/release-binaries/senpi-desktop-engine-win32-* \
            .omo/release-binaries/senpi-desktop-engine-checksums.txt --clobber

      - name: Verify uploaded assets
        # Intentionally ungated: release assets are part of the release
        # contract, so skip_platform reruns must fail when an engine asset is
        # absent rather than treating a skipped upload as success.
        if: inputs.lazycodex_only != true
        env:
          VERSION: ${{ needs.release-metadata.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERIFY_DIR="$(mktemp -d)"
          trap 'rm -rf "$VERIFY_DIR"' EXIT
          gh release download "v${VERSION}" --dir "$VERIFY_DIR"
          RELEASED="$(cd "$VERIFY_DIR" && printf '%s\n' * | sort)"
          # The contract floor every release carries, built in this run or not.
          # omo-runtime-capabilities.json: every runtime this stack builds declares its contract; a release without it would
          # ship runtimes the desktop never hands off to (RULING-77, #11613).
          FLOOR=(omo-keychain-darwin-universal SHA256SUMS senpi-desktop-engine-checksums.txt
            senpi-desktop-engine-win32-x64.exe senpi-desktop-engine-win32-arm64.exe omo-runtime-capabilities.json)
          for TARGET in darwin-arm64 darwin-x64 darwin-x64-baseline linux-x64 linux-x64-baseline linux-arm64 linux-x64-musl linux-x64-musl-baseline linux-arm64-musl windows-x64 windows-x64-baseline windows-arm64; do
            NAME="omo-${TARGET}"
            if [[ "$TARGET" == windows-* ]]; then NAME="${NAME}.exe"; fi
            FLOOR+=("$NAME")
          done
          for HOST in darwin-arm64 darwin-x64 linux-x64 linux-arm64; do
            FLOOR+=("senpi-desktop-engine-${HOST}")
          done
          for NAME in "${FLOOR[@]}"; do
            grep -qxF -- "$NAME" <<<"$RELEASED" || { echo "::error::v${VERSION} lacks the release asset ${NAME}"; exit 1; }
          done
          # A run that built assets must have published exactly what it built: nothing missing, nothing
          # extra (RULING-77). skip_platform runs built nothing, so their release is checked by the floor
          # and the checksum coverage below.
          # Only top-level regular files are release assets: the desktop-engine artifact also carries payload
          # directories (engine-trust-helper-<host>, shipped inside the compiled binaries, #12018) that are never uploaded.
          if [ -d .omo/release-binaries ]; then
            diff -u <(cd .omo/release-binaries && for NAME in *; do if [ -f "$NAME" ]; then printf '%s\n' "$NAME"; fi; done | sort) <(printf '%s\n' "$RELEASED")
          fi
          (
            cd "$VERIFY_DIR"
            # Every asset is listed in exactly one checksum file, and every listed digest matches.
            diff -u <({ awk '{print $2}' SHA256SUMS senpi-desktop-engine-checksums.txt; printf '%s\n' SHA256SUMS senpi-desktop-engine-checksums.txt; } | sort) \
              <(printf '%s\n' "$RELEASED")
            shasum -a 256 -c SHA256SUMS
            shasum -a 256 -c senpi-desktop-engine-checksums.txt
            printf '{"keychainHandoff":1}\n' | cmp - omo-runtime-capabilities.json
          )
          echo "Verified $(grep -c . <<<"$RELEASED") release assets for v${VERSION}"

      - name: Delete draft release
        if: inputs.lazycodex_only != true
        run: gh release delete next --yes 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Mirror release to master
        # Non-blocking: npm is already published by this point, so a mirror
        # failure must never fail the release. With no error swallow, a genuine
        # failure still surfaces as a red step for visibility.
        # Auth: uses the GH_PAT persisted by checkout (workflow scope) so the
        # push can carry the release's .github/workflows/* diff — the default
        # GITHUB_TOKEN cannot, which is why this silently failed the whole v4.x line.
        # Fast-forward only: master always trails the new tag (releases move
        # forward on dev), so the direct refspec push is a clean FF and satisfies
        # the branch ruleset's non_fast_forward rule without needing a bypass.
        if: inputs.lazycodex_only != true
        continue-on-error: true
        env:
          VERSION: ${{ needs.release-metadata.outputs.version }}
        run: |
          git push origin "v${VERSION}^{commit}:refs/heads/master"

      - name: Write job summary
        if: always()
        shell: bash
        env:
          JOB_SUMMARY_TITLE: Release finalization
          JOB_SUMMARY_STATUS: ${{ job.status }}
          JOB_SUMMARY_DETAILS: |
            - Applies and commits release state when needed.
            - Creates or reuses the release tag.
            - Syncs LazyCodex marketplace payload and creates GitHub releases.
            - Attempts the protected `master` mirror update after release.
          JOB_SUMMARY_NEXT: Inspect the first failing release-state, marketplace sync, or GitHub release step.
        run: GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" bash .github/scripts/write-job-summary.sh

  release-announce:
    needs: [release-metadata, release, post-publish-verify, installer-mirror]
    if: >-
      !cancelled() &&
      needs.release.outputs.created == 'true' &&
      needs.release.result == 'success' &&
      needs.post-publish-verify.result == 'success' &&
      (needs.installer-mirror.result == 'success' || (inputs.skip_platform == true && needs.installer-mirror.result == 'skipped')) &&
      needs.release-metadata.outputs.dist_tag == '' &&
      inputs.lazycodex_only != true &&
      inputs.prepared_release_sha != ''
    permissions:
      contents: read
    uses: ./.github/workflows/release-announce.yml
    with:
      tag: v${{ needs.release-metadata.outputs.version }}
    secrets:
      DISCORD_OMO_RELEASES_WEBHOOK_URL: ${{ secrets.DISCORD_OMO_RELEASES_WEBHOOK_URL }}

  release-announce-recovery:
    needs: [release-metadata, release, post-publish-verify, installer-mirror, release-announce]
    if: >-
      always() &&
      needs.release.outputs.created == 'true' &&
      needs.release-metadata.outputs.dist_tag == '' &&
      inputs.lazycodex_only != true &&
      inputs.prepared_release_sha != '' &&
      (cancelled() || needs.release-announce.result == 'skipped')
    # Pin until this release/deploy path is proven on Ubuntu 26.04: #9983.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Write job summary
        env:
          RELEASE_TAG: v${{ needs.release-metadata.outputs.version }}
        run: |
          recovery="gh workflow run release-announce.yml -f tag=$RELEASE_TAG -f dry_run=false"
          echo "::warning::Release announcement $RELEASE_TAG was skipped or cancelled. Fix the release assets, verification, and installer mirror, then confirm the post is missing before recovery: $recovery"
          printf 'Release announcement `%s` was skipped or cancelled. Once assets, verification, and the installer mirror are ready and no post exists, recover with `%s`.\n' "$RELEASE_TAG" "$recovery" >> "$GITHUB_STEP_SUMMARY"

  installer-mirror-assets:
    needs: [release-metadata, release]
    # Mirror the published assets into R2 behind get.omo.dev as soon as the GitHub release exists, moving no channel,
    # so the upload runs beside post-publish-verify instead of after it. The channel jobs below then find every object
    # already mirrored and only re-verify it before moving their pointer.
    if: >-
      always() &&
      inputs.prepared_release_sha != '' &&
      inputs.lazycodex_only != true &&
      inputs.skip_platform != true &&
      needs.release.result == 'success'
    uses: ./.github/workflows/installer-mirror.yml
    with:
      tag: v${{ needs.release-metadata.outputs.version }}
      channel: none
      dry_run: false
    secrets: inherit

  installer-mirror:
    needs: [release-metadata, release, installer-mirror-assets, post-publish-verify]
    # Last release step: move the installer channel to the mirrored release. It waits for post-publish-verify so the
    # channel only follows an npm dist-tag that is already live. A failure leaves the GitHub release and npm untouched
    # and keeps get.omo.dev on the previous version; re-run installer-mirror.yml for this tag to finish it.
    if: >-
      always() &&
      inputs.prepared_release_sha != '' &&
      inputs.lazycodex_only != true &&
      inputs.skip_platform != true &&
      needs.release.result == 'success' &&
      needs.installer-mirror-assets.result == 'success' &&
      needs.post-publish-verify.result == 'success'
    uses: ./.github/workflows/installer-mirror.yml
    with:
      tag: v${{ needs.release-metadata.outputs.version }}
      channel: ${{ needs.release-metadata.outputs.omo_ai_dist_tag }}
      dry_run: false
    secrets: inherit

  installer-mirror-beta:
    needs: [release-metadata, installer-mirror-assets, post-publish-verify]
    # beta is the newer of the latest stable release and the newest prerelease (#12987): a stable release moves
    # channels/beta to the same version, beside the channels/latest move (each channel has its own concurrency group, and
    # beta may lead latest but never trail it). The mirror never moves a channel backwards, so a newer beta prerelease
    # is kept. The assets are already mirrored; this run re-verifies them and moves the pointer.
    if: >-
      always() &&
      inputs.prepared_release_sha != '' &&
      inputs.lazycodex_only != true &&
      inputs.skip_platform != true &&
      needs.installer-mirror-assets.result == 'success' &&
      needs.post-publish-verify.result == 'success' &&
      needs.release-metadata.outputs.omo_ai_dist_tag == 'latest'
    uses: ./.github/workflows/installer-mirror.yml
    with:
      tag: v${{ needs.release-metadata.outputs.version }}
      channel: beta
      dry_run: false
    secrets: inherit

  registry-wait:
    # Pin until this release/deploy path is proven on Ubuntu 26.04: #9940.
    runs-on: ubuntu-24.04
    # The wait below has one 60-minute deadline; the margin covers checkout and setup.
    timeout-minutes: 75
    needs: [release-metadata, prepare-release-state, publish-main]
    # A pure registry read that needs only publish-main, so it runs beside the release job instead of after it.
    # Nothing waits on it except post-publish-verify, so it cannot hold back the GitHub release either.
    if: >-
      always() &&
      inputs.prepared_release_sha != '' &&
      needs.release-metadata.result == 'success' &&
      needs.publish-main.result == 'success'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare-release-state.outputs.release_sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Wait for every published package on the registry
        env:
          VERSION: ${{ needs.release-metadata.outputs.version }}
          OMO_AI_VERSION: ${{ needs.release-metadata.outputs.omo_ai_version }}
          PUBLISH_LAZYCODEX: ${{ inputs.publish_lazycodex }}
          LAZYCODEX_ONLY: ${{ inputs.lazycodex_only }}
          # ONE 60-minute deadline shared by every package, probe time included (each probe is capped at
          # 15 s): well inside the job's 120-minute timeout, so a missing package fails with its name.
          REGISTRY_WAIT_DEADLINE_SECONDS: "3600"
        run: |
          set -euo pipefail
          # npm answers every publish with 202 "being processed": 5.1.38's oh-my-openagent printed
          # "+ oh-my-openagent@5.1.38" at 10:09Z and was served only from 10:34Z, while this job only
          # waited on omo-ai. Read EVERY main and platform package back at its exact version (no-cache),
          # or fail naming what is missing and why.
          # Platform packages come from package.json optionalDependencies (--platform-packages), the
          # one list the release-platform test holds equal to build-binaries PLATFORMS, so this step
          # cannot drift from the platforms that are built and published.
          if [ "${LAZYCODEX_ONLY}" = "true" ]; then
            node script/wait-registry-versions.mjs "lazycodex-ai@$VERSION"
          else
            # omo-ai carries its own version (a prerelease spells it differently from the wrappers).
            SPECS=("oh-my-opencode@$VERSION" "oh-my-openagent@$VERSION" "omo-ai@$OMO_AI_VERSION")
            if [ "${PUBLISH_LAZYCODEX}" = "true" ]; then
              SPECS+=("lazycodex-ai@$VERSION")
            fi
            node script/wait-registry-versions.mjs --platform-packages "$VERSION" "${SPECS[@]}"
          fi

      - name: Write job summary
        if: always()
        shell: bash
        env:
          JOB_SUMMARY_TITLE: Registry wait
          JOB_SUMMARY_STATUS: ${{ job.status }}
          JOB_SUMMARY_DETAILS: |
            - Reads every main and platform package of this release back from the registry at its exact version.
            - Runs beside the release job; post-publish-verify starts once both are done.
          JOB_SUMMARY_NEXT: Check the named package on npm; the publish already succeeded, so this is registry propagation.
        run: GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" bash .github/scripts/write-job-summary.sh

  post-publish-verify:
    # Pin until this release/deploy path is proven on Ubuntu 26.04: #9940.
    runs-on: ubuntu-24.04
    # The readiness loop below is 240 x (15 s sleep + two npm views + a curl HEAD); bound the job so a stuck
    # probe can't hold a runner for GitHub's 6 h default (#9492).
    timeout-minutes: 120
    needs: [release-metadata, prepare-release-state, publish-main, release, registry-wait]
    # Post-publish verification runs AFTER the release exists. These probes assert registry state that is
    # already public by this point, so blocking the release job on them could only produce the worst
    # outcome: packages on npm with no GitHub release and no marketplace sync. A failure here is still a
    # red job that must be investigated - it just cannot strand a published release.
    if: >-
      always() &&
      inputs.prepared_release_sha != '' &&
      needs.release-metadata.result == 'success' &&
      needs.publish-main.result == 'success' &&
      needs.release.result == 'success' &&
      needs.registry-wait.result == 'success'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare-release-state.outputs.release_sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Wait for omo-ai registry readiness
        if: inputs.lazycodex_only != true
        env:
          OMO_AI_VERSION: ${{ needs.release-metadata.outputs.omo_ai_version }}
          OMO_AI_DIST_TAG: ${{ needs.release-metadata.outputs.omo_ai_dist_tag }}
          ALREADY_PUBLISHED: ${{ needs.release-metadata.outputs.already_published }}
        run: |
          set -euo pipefail

          # npm publish returns before the registry serves the new version: its own output says
          # "Your package is being processed and may take a few minutes to become available", and
          # omo-ai 5.0.0-0.beta.42 (2026-09-04) took ~5 minutes. The previous 5 x 15 s = 60 s budget
          # therefore failed the run AFTER a successful publish. Size the wait to the registry's stated
          # contract and read with --prefer-online so a cached "not found" cannot mask a landed version.
          READINESS_INTERVAL_SECONDS=15
          READINESS_ATTEMPTS=240  # 240 x 15 s = 60 minutes; npm took ~55 minutes to serve omo-ai@5.1.13 (#9492)
          for attempt in $(seq 1 "$READINESS_ATTEMPTS"); do
            IMMUTABLE_VERSION=$(npm view --prefer-online "omo-ai@$OMO_AI_VERSION" version 2>/dev/null || true)
            TARBALL_URL=$(npm view --prefer-online "omo-ai@$OMO_AI_VERSION" dist.tarball 2>/dev/null || true)
            TAG_READY=true
            if [ "$ALREADY_PUBLISHED" != "true" ]; then
              TAGGED_VERSION=$(npm view --prefer-online omo-ai "dist-tags.$OMO_AI_DIST_TAG" 2>/dev/null || true)
              [ "$TAGGED_VERSION" = "$OMO_AI_VERSION" ] || TAG_READY=false
            fi

            TARBALL_READY=false
            if [ -n "$TARBALL_URL" ] &&
               curl --fail --silent --location --connect-timeout 10 --max-time 15 --head --output /dev/null "$TARBALL_URL"; then
              TARBALL_READY=true
            fi

            if [ "$IMMUTABLE_VERSION" = "$OMO_AI_VERSION" ] &&
               [ "$TAG_READY" = "true" ] &&
               [ "$TARBALL_READY" = "true" ]; then
              echo "omo-ai@$OMO_AI_VERSION metadata and tarball are ready (attempt ${attempt}/${READINESS_ATTEMPTS})"
              break
            fi

            if [ "$attempt" = "$READINESS_ATTEMPTS" ]; then
              echo "::error::omo-ai@$OMO_AI_VERSION metadata and tarball did not become ready within $((READINESS_ATTEMPTS * READINESS_INTERVAL_SECONDS)) s. The publish-main job already reported '+ omo-ai@$OMO_AI_VERSION', so this is a registry propagation timeout, not a publish failure: check 'npm view omo-ai@$OMO_AI_VERSION version' and the dist.tarball URL's tarball availability before re-running anything."
              exit 1
            fi
            echo "Waiting for omo-ai@$OMO_AI_VERSION registry propagation (attempt ${attempt}/${READINESS_ATTEMPTS}, ${READINESS_INTERVAL_SECONDS}s)"
            sleep "$READINESS_INTERVAL_SECONDS"
          done

      - name: Move omo-ai beta up to the stable release
        # beta is the newer of the latest stable release and the newest prerelease (#12987), so a stable release also
        # moves beta unless beta already holds a newer prerelease. It runs here, after the registry serves the release
        # and before the guard below, so a beta-tag hiccup can never fail publish-main and block the GitHub release of an
        # already-published version: a failed dist-tag write only warns and the guard below reports it, while a read-back that
        # finds beta older than the newest of latest and every prerelease fails this step with the repair command.
        # Trusted publishing covers `npm publish` only, so the dist-tag write authenticates with the registry token, as
        # npm-dist-tag-rollback.yml does.
        if: >-
          inputs.lazycodex_only != true &&
          needs.release-metadata.outputs.omo_ai_dist_tag == 'latest'
        env:
          OMO_AI_VERSION: ${{ needs.release-metadata.outputs.omo_ai_version }}
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
        run: |
          set -euo pipefail

          # Read the whole dist-tags object, not dist-tags.beta: a failed lookup must never read as "no beta tag",
          # or a registry hiccup would move beta DOWN over a newer prerelease. lookup=failed means: do not move.
          for attempt in 1 2 3; do
            DIST_TAGS=$(npm view --prefer-online --json omo-ai dist-tags 2>/dev/null) || DIST_TAGS=""
            DECISION=$(node script/beta-follows-latest.mjs --dist-tags "$OMO_AI_VERSION" "$DIST_TAGS")
            [ "$DECISION" = "lookup=failed" ] || break
            [ "$attempt" = "3" ] || { echo "Retrying the omo-ai dist-tags lookup (attempt ${attempt}/3)"; sleep 15; }
          done
          if [ "$DECISION" = "lookup=failed" ]; then
            echo "::warning::Could not read the omo-ai dist-tags, so beta was not moved; the dist-tag guard checks beta >= latest"
            exit 0
          fi
          if [ "$DECISION" != "move=true" ]; then
            echo "omo-ai beta stays: it is not older than $OMO_AI_VERSION"
            exit 0
          fi

          echo "omo-ai beta is missing or older than $OMO_AI_VERSION; moving beta to $OMO_AI_VERSION"
          # npm expands the variable reference itself, so the token never lands on disk.
          NPMRC="$RUNNER_TEMP/omo-ai-dist-tag.npmrc"
          # shellcheck disable=SC2016
          printf '//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}\n' > "$NPMRC"
          trap 'rm -f "$NPMRC"' EXIT
          MOVED=false
          for attempt in 1 2 3 4 5; do
            if npm dist-tag add --userconfig "$NPMRC" "omo-ai@$OMO_AI_VERSION" beta; then
              MOVED=true
              break
            fi
            [ "$attempt" = "5" ] || { echo "Retrying omo-ai beta dist-tag (attempt ${attempt}/5)"; sleep 15; }
          done
          rm -f "$NPMRC"
          if [ "$MOVED" != "true" ]; then
            echo "::warning::Could not move omo-ai beta to $OMO_AI_VERSION; the dist-tag guard reports it. Fix: run 'npm dist-tag add omo-ai@$OMO_AI_VERSION beta' with a publish token"
            exit 0
          fi
          echo "omo-ai beta -> $OMO_AI_VERSION"

          # Re-read the whole dist-tags object after the write (#13149). The registry serves a dist-tag write with lag, so
          # a stale read is retried (bounded). Beta newer than what we wrote means someone moved it forward: leave it.
          # Beta older than the newest of latest and every prerelease seen in either read fails with the repair command.
          # A read-back that cannot be read at all only warns; the dist-tag guard below re-reads it.
          VERDICT="lookup=failed"
          for attempt in 1 2 3 4 5; do
            AFTER_TAGS=$(npm view --prefer-online --json omo-ai dist-tags 2>/dev/null) || AFTER_TAGS=""
            VERDICT=$(node script/beta-follows-latest.mjs --verify "$OMO_AI_VERSION" "$DIST_TAGS" "$AFTER_TAGS")
            case "$VERDICT" in
              beta=ok:*)
                echo "omo-ai beta reads ${VERDICT#beta=ok:} (attempt ${attempt}/5)"
                exit 0
                ;;
              beta=ahead:*)
                echo "omo-ai beta was moved forward to ${VERDICT#beta=ahead:}, newer than $OMO_AI_VERSION; leaving it"
                exit 0
                ;;
            esac
            [ "$attempt" = "5" ] || { echo "Waiting for omo-ai beta to settle after the move to $OMO_AI_VERSION (attempt ${attempt}/5, 15s)"; sleep 15; }
          done
          case "$VERDICT" in
            beta=behind:*)
              REPAIR_VERSION="${VERDICT#beta=behind:}"
              echo "::error::omo-ai beta is still older than $REPAIR_VERSION after the move; run: npm dist-tag add omo-ai@$REPAIR_VERSION beta"
              exit 1
              ;;
          esac
          echo "::warning::Could not re-read the omo-ai dist-tags after the move to $OMO_AI_VERSION; the dist-tag guard re-reads it"

      - name: Guard omo-ai dist-tags
        if: inputs.lazycodex_only != true
        env:
          OMO_AI_VERSION: ${{ needs.release-metadata.outputs.omo_ai_version }}
          OMO_AI_DIST_TAG: ${{ needs.release-metadata.outputs.omo_ai_dist_tag }}
          ALREADY_PUBLISHED: ${{ needs.release-metadata.outputs.already_published }}
        run: |
          set -euo pipefail

          # A stable release owns latest. A prerelease owns beta and must never land on latest.
          LATEST_VERSION=$(npm view omo-ai dist-tags.latest 2>/dev/null || true)
          if [ "$OMO_AI_DIST_TAG" != "latest" ] && [ "$LATEST_VERSION" = "$OMO_AI_VERSION" ]; then
            echo "::error::omo-ai latest points at the prerelease $OMO_AI_VERSION; move it back to the last stable release"
            exit 1
          fi

          if [ "$ALREADY_PUBLISHED" != "true" ]; then
            TAGGED_VERSION=$(npm view omo-ai "dist-tags.$OMO_AI_DIST_TAG" 2>/dev/null || true)
            if [ "$TAGGED_VERSION" != "$OMO_AI_VERSION" ]; then
              echo "::error::omo-ai $OMO_AI_DIST_TAG points to ${TAGGED_VERSION:-missing}, expected $OMO_AI_VERSION"
              exit 1
            fi
          fi

          # beta is never older than latest or the newest prerelease on any dist-tag (#12987). The step above moved it with
          # this stable release. The registry can serve that write with lag, so the read is retried (bounded, like the
          # readiness wait) before it fails.
          if [ "$OMO_AI_DIST_TAG" = "latest" ]; then
            for attempt in 1 2 3 4 5; do
              GUARD_TAGS=$(npm view --prefer-online --json omo-ai dist-tags 2>/dev/null) || GUARD_TAGS=""
              BETA_DECISION=$(node script/beta-follows-latest.mjs --guard "$GUARD_TAGS" || true)
              case "$BETA_DECISION" in beta=ok:*) break ;; esac
              if [ "$attempt" = "5" ]; then
                BEHIND="${BETA_DECISION#beta=behind:}"
                FLOOR_VERSION="${BEHIND%%:*}"
                BETA_VERSION="${BEHIND#*:}"
                [ "$BETA_DECISION" != "$BEHIND" ] || { FLOOR_VERSION="$LATEST_VERSION"; BETA_VERSION=""; }
                echo "::error::omo-ai beta points to ${BETA_VERSION:-missing}, older than latest ${LATEST_VERSION:-missing} or the newest prerelease (${FLOOR_VERSION:-missing}); move beta to ${FLOOR_VERSION:-$LATEST_VERSION}"
                exit 1
              fi
              echo "Waiting for omo-ai beta to reach latest ${LATEST_VERSION:-missing} (attempt ${attempt}/5, 15s)"
              sleep 15
            done
          fi

      - name: Verify omo-ai live install
        if: inputs.lazycodex_only != true
        env:
          OMO_AI_VERSION: ${{ needs.release-metadata.outputs.omo_ai_version }}
          OMO_AI_DIST_TAG: ${{ needs.release-metadata.outputs.omo_ai_dist_tag }}
          ALREADY_PUBLISHED: ${{ needs.release-metadata.outputs.already_published }}
        run: |
          set -euo pipefail

          EXACT_VERIFIED=false
          for attempt in $(seq 1 5); do
            EXACT_PREFIX=$(mktemp -d "$RUNNER_TEMP/omoai-exact-${attempt}.XXXXXX")
            if npm i -g "omo-ai@$OMO_AI_VERSION" --prefix "$EXACT_PREFIX" &&
               [ "$(jq -r '.version' "$EXACT_PREFIX/lib/node_modules/omo-ai/package.json")" = "$OMO_AI_VERSION" ] &&
               "$EXACT_PREFIX/bin/omo" --version; then
              EXACT_VERIFIED=true
              rm -rf "$EXACT_PREFIX"
              break
            fi
            rm -rf "$EXACT_PREFIX"
            if [ "$attempt" != "5" ]; then
              echo "Waiting for omo-ai@$OMO_AI_VERSION install propagation (attempt ${attempt}/5)"
              sleep 15
            fi
          done
          if [ "$EXACT_VERIFIED" != "true" ]; then
            echo "::error::Exact-version live install failed for omo-ai@$OMO_AI_VERSION"
            exit 1
          fi

          # The channel spelling users are told to run must install this release: bare `omo-ai` for a
          # stable release (latest), `omo-ai@beta` for a prerelease.
          if [ "$ALREADY_PUBLISHED" != "true" ]; then
            if [ "$OMO_AI_DIST_TAG" = "latest" ]; then
              CHANNEL_SPEC=omo-ai
            else
              CHANNEL_SPEC="omo-ai@$OMO_AI_DIST_TAG"
            fi
            CHANNEL_PREFIX=$(mktemp -d "$RUNNER_TEMP/omoai-channel.XXXXXX")
            npm i -g "$CHANNEL_SPEC" --prefix "$CHANNEL_PREFIX"
            CHANNEL_INSTALLED_VERSION=$(jq -r '.version' "$CHANNEL_PREFIX/lib/node_modules/omo-ai/package.json")
            rm -rf "$CHANNEL_PREFIX"
            if [ "$CHANNEL_INSTALLED_VERSION" != "$OMO_AI_VERSION" ]; then
              echo "::error::$CHANNEL_SPEC installed $CHANNEL_INSTALLED_VERSION, expected $OMO_AI_VERSION"
              exit 1
            fi
          fi

      - name: Smoke test published lazycodex-ai
        if: inputs.publish_lazycodex == true && needs.publish-main.outputs.lazycodex_publish_skipped != 'true'
        env:
          OMO_VERSION: ${{ needs.release-metadata.outputs.version }}
          DIST_TAG: ${{ needs.release-metadata.outputs.dist_tag }}
        run: |
          set -euo pipefail

          # Upgrade simulation: an existing install carries a legacy `omo` wrapper in the
          # Codex bin dir. A marker-bearing wrapper is ours and must be reclaimed by the
          # install; an unmarked file is user-owned and must survive byte-identical.
          simulate_legacy_omo_upgrade() {
            package_spec="$1"
            scenario_root="$2"
            seeded_kind="$3"
            (
              export HOME="$scenario_root/home"
              export CODEX_HOME="$scenario_root/codex"
              export CODEX_LOCAL_BIN_DIR="$scenario_root/bin"
              mkdir -p "$HOME" "$CODEX_HOME" "$CODEX_LOCAL_BIN_DIR" "$scenario_root/cwd"
              cd "$scenario_root/cwd"

              if [ "$seeded_kind" = "marked" ]; then
                printf '#!/bin/sh\n# OMO_GENERATED_RUNTIME_WRAPPER\nexit 0\n' > "$CODEX_LOCAL_BIN_DIR/omo"
              else
                printf '#!/bin/sh\n# user-owned omo, never generated by this installer\nexit 0\n' > "$CODEX_LOCAL_BIN_DIR/omo"
              fi
              chmod +x "$CODEX_LOCAL_BIN_DIR/omo"
              cp "$CODEX_LOCAL_BIN_DIR/omo" "$scenario_root/omo.seeded"

              npx -y "$package_spec" install --no-tui --codex-autonomous >/dev/null 2>&1 || return 1
              [ -x "$CODEX_LOCAL_BIN_DIR/omo-agent-toolkit" ] || return 1

              if [ "$seeded_kind" = "marked" ]; then
                if [ -e "$CODEX_LOCAL_BIN_DIR/omo" ]; then
                  echo "::error::marker-bearing legacy omo wrapper survived the install"
                  return 1
                fi
              else
                if ! cmp -s "$scenario_root/omo.seeded" "$CODEX_LOCAL_BIN_DIR/omo"; then
                  echo "::error::user-owned omo file was modified by the install"
                  return 1
                fi
              fi
            )
          }

          # Same wall-clock budget as the omo-ai readiness loop above: npm exposes a freshly published
          # version 4-5 minutes after `npm publish` returns, and a 12 x 10 s budget failed a successful
          # lazycodex-ai publish in beta.31, beta.34, and 5.0.0-beta.57 (#8182).
          SMOKE_READINESS_INTERVAL_SECONDS=15
          SMOKE_READINESS_ATTEMPTS=60   # 60 x 15 s = 15 minutes

          smoke_lazycodex_package() {
            package_spec="$1"
            for attempt in $(seq 1 "$SMOKE_READINESS_ATTEMPTS"); do
              SMOKE_DIR=$(mktemp -d)
              export HOME="$SMOKE_DIR/home"
              export CODEX_HOME="$SMOKE_DIR/codex"
              export CODEX_LOCAL_BIN_DIR="$SMOKE_DIR/bin"
              mkdir -p "$HOME" "$CODEX_HOME" "$CODEX_LOCAL_BIN_DIR" "$SMOKE_DIR/cwd"
              cd "$SMOKE_DIR/cwd"
              expected_install_output="npx --yes oh-my-openagent@latest install --platform=codex --no-tui --codex-autonomous"
              expected_doctor_output_prefix="codex exec "
              expected_doctor_hint="Use \$omo:lcx-doctor"

              if ! registry_version=$(npm view "$package_spec" version --silent 2>"$SMOKE_DIR/registry-error"); then
                echo "Waiting for ${package_spec} registry propagation (attempt ${attempt}/${SMOKE_READINESS_ATTEMPTS}, ${SMOKE_READINESS_INTERVAL_SECONDS}s)"
                cd "$GITHUB_WORKSPACE"
                rm -rf "$SMOKE_DIR"
                sleep "$SMOKE_READINESS_INTERVAL_SECONDS"
                continue
              fi

              if [[ "$package_spec" != *"@latest" && "$registry_version" != "${package_spec##*@}" ]]; then
                echo "Waiting for ${package_spec} registry propagation (attempt ${attempt}/${SMOKE_READINESS_ATTEMPTS}, ${SMOKE_READINESS_INTERVAL_SECONDS}s; visible=${registry_version})"
                cd "$GITHUB_WORKSPACE"
                rm -rf "$SMOKE_DIR"
                sleep "$SMOKE_READINESS_INTERVAL_SECONDS"
                continue
              fi

              if ! npx_install_output=$(npx -y "$package_spec" --dry-run install --no-tui --codex-autonomous 2>&1); then
                echo "::error::Published LazyCodex install dry-run failed after ${package_spec} became visible (registry=${registry_version})"
                echo "$npx_install_output" >&2
                cd "$GITHUB_WORKSPACE"
                rm -rf "$SMOKE_DIR"
                return 1
              fi
              if ! npx_doctor_output=$(npx -y "$package_spec" --dry-run doctor 2>&1); then
                echo "::error::Published LazyCodex doctor dry-run failed for visible ${package_spec} (registry=${registry_version})"
                echo "$npx_doctor_output" >&2
                cd "$GITHUB_WORKSPACE"
                rm -rf "$SMOKE_DIR"
                return 1
              fi
              doctor_prefix_ok=false
              doctor_sandbox_ok=false
              doctor_hint_ok=false
              doctor_model_ok=true
              case "$npx_doctor_output" in "$expected_doctor_output_prefix"*) doctor_prefix_ok=true ;; esac
              case "$npx_doctor_output" in *"--sandbox danger-full-access"*) doctor_sandbox_ok=true ;; esac
              case "$npx_doctor_output" in *"$expected_doctor_hint"*) doctor_hint_ok=true ;; esac
              case "$npx_doctor_output" in *"--model"*|*"gpt-5.5-codex-mini"*) doctor_model_ok=false ;; esac
              if [ "$npx_install_output" != "$expected_install_output" ] ||
                 [ "$doctor_prefix_ok" != true ] ||
                 [ "$doctor_sandbox_ok" != true ] ||
                 [ "$doctor_hint_ok" != true ] ||
                 [ "$doctor_model_ok" != true ]; then
                echo "::error::Published LazyCodex dry-run behavior failed for visible ${package_spec} (registry=${registry_version})"
                echo "$npx_install_output" >&2
                echo "$npx_doctor_output" >&2
                cd "$GITHUB_WORKSPACE"
                rm -rf "$SMOKE_DIR"
                return 1
              fi
              if ! npx -y "$package_spec" install --no-tui --codex-autonomous; then
                echo "::error::Published LazyCodex install failed for visible ${package_spec} (registry=${registry_version}); this is not registry propagation"
                cd "$GITHUB_WORKSPACE"
                rm -rf "$SMOKE_DIR"
                return 1
              fi
              if ! [ -x "$CODEX_LOCAL_BIN_DIR/omo-agent-toolkit" ] ||
                 [ -e "$CODEX_LOCAL_BIN_DIR/omo" ] ||
                 ! omo_agent_toolkit_version_output=$("$CODEX_LOCAL_BIN_DIR/omo-agent-toolkit" --version 2>&1) ||
                 [ "$omo_agent_toolkit_version_output" != "$OMO_VERSION" ] ||
                 ! ulw_loop_output=$("$CODEX_LOCAL_BIN_DIR/omo-agent-toolkit" ulw-loop --help 2>&1) ||
                 ! printf "%s" "$ulw_loop_output" | grep -q "ulw-loop"; then
                echo "::error::Published LazyCodex installed but runtime verification failed for visible ${package_spec}"
                echo "version output: ${omo_agent_toolkit_version_output:-<missing>}" >&2
                echo "$ulw_loop_output" >&2
                cd "$GITHUB_WORKSPACE"
                rm -rf "$SMOKE_DIR"
                return 1
              fi
              if ! simulate_legacy_omo_upgrade "$package_spec" "$SMOKE_DIR/upgrade-marked" marked ||
                 ! simulate_legacy_omo_upgrade "$package_spec" "$SMOKE_DIR/upgrade-unmarked" unmarked; then
                echo "::error::Published LazyCodex legacy-wrapper upgrade verification failed for visible ${package_spec}"
                cd "$GITHUB_WORKSPACE"
                rm -rf "$SMOKE_DIR"
                return 1
              fi
              echo "$npx_install_output"
              echo "$npx_doctor_output"
              echo "omo-agent-toolkit --version: $omo_agent_toolkit_version_output"
              echo "omo-agent-toolkit ulw-loop: $ulw_loop_output"
              cd "$GITHUB_WORKSPACE"
              rm -rf "$SMOKE_DIR"
              return 0
            done
            echo "::error::${package_spec} never became visible on the registry within $((SMOKE_READINESS_ATTEMPTS * SMOKE_READINESS_INTERVAL_SECONDS)) s; the publish itself may have succeeded (check npm before rerunning), this is registry propagation, not a broken package"
            return 1
          }

          smoke_lazycodex_package "lazycodex-ai@${OMO_VERSION}"
          if [ -z "$DIST_TAG" ]; then
            smoke_lazycodex_package "lazycodex-ai@latest"
          fi

      - name: Write job summary
        if: always()
        shell: bash
        env:
          JOB_SUMMARY_TITLE: Post-publish verification
          JOB_SUMMARY_STATUS: ${{ job.status }}
          JOB_SUMMARY_DETAILS: |
            - Waits for omo-ai registry readiness, moves beta up to a stable release, and guards its dist-tags.
            - Verifies the omo-ai live install and smoke-tests the published LazyCodex package.
            - Runs after the GitHub release so propagation delays cannot strand a published release.
          JOB_SUMMARY_NEXT: Investigate the failing registry probe; the release itself already exists.
        run: GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" bash .github/scripts/write-job-summary.sh
