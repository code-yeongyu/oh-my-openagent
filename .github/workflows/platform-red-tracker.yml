name: Platform red tracker

# Pull requests run Linux only (#13802), so a macOS/Windows regression first shows on the dev push run.
# When a macOS/Windows job of such a run fails, this files ONE open `ci:platform-red` issue naming the merged
# pull request, or comments on the open one. publish.yml refuses to cut a release while that issue is open.
on:
  workflow_run:
    workflows: [CI, Computer engine, Desktop engine, Desktop Windows QA, Engine trust helper, get.omo.dev CI, Git job helper]
    types: [completed]
    branches: [dev]

permissions:
  actions: read
  contents: read
  issues: write

# One writer at a time, so two red runs finishing together still produce one issue.
concurrency:
  group: platform-red-tracker
  cancel-in-progress: false

jobs:
  track:
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: File or update the platform-red tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_NAME: ${{ github.event.workflow_run.name }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          failed="$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID/jobs?filter=latest&per_page=100" --jq '
            [.jobs[]
              | select(.conclusion == "failure")
              | select(((.labels | join(" ")) + " " + .name) | test("macos|windows"; "i"))
              | "- [\(.name)](\(.html_url)) on `\(.labels | join(", "))`"]
            | join("\n")')"
          if [ -z "$failed" ]; then
            echo "Only Linux jobs failed in $RUN_NAME; the platform-red issue is for macOS/Windows legs."
            exit 0
          fi
          merged="$(gh api "repos/$GH_REPO/commits/$HEAD_SHA/pulls" --jq '[.[] | select(.merged_at != null) | "#\(.number)"] | join(", ")')"
          body="$RUNNER_TEMP/platform-red.md"
          {
            echo "A macOS/Windows job failed on \`dev\` after merging ${merged:-a direct push} at \`$HEAD_SHA\`."
            echo
            echo "Workflow run: [$RUN_NAME]($RUN_URL)"
            echo
            echo "$failed"
            echo
            echo "Pull requests run Linux only (#13802), so this is the first platform signal for that change."
            echo "Fix it in a pull request that says \`Fixes #<this issue>\`; releases are refused while this issue is open."
          } > "$body"
          issue="$(gh issue list --label ci:platform-red --state open --json number --jq '.[0].number // empty')"
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body-file "$body"
            echo "Commented on #$issue."
          else
            gh label create ci:platform-red --color B60205 --force \
              --description "A macOS/Windows job is red on dev; releases are refused while open"
            gh issue create --title "Platform CI red on dev (macOS/Windows)" --label ci:platform-red --body-file "$body"
          fi

      - name: Write job summary
        if: always()
        shell: bash
        env:
          JOB_SUMMARY_TITLE: Platform red tracker
          JOB_SUMMARY_STATUS: ${{ job.status }}
          JOB_SUMMARY_DETAILS: |
            - Reads the failed jobs of `${{ github.event.workflow_run.name }}` on `dev` at `${{ github.event.workflow_run.head_sha }}`.
            - Files or comments on the one open `ci:platform-red` issue when a macOS/Windows job failed.
          JOB_SUMMARY_NEXT: Fix the listed macOS/Windows job; publish.yml refuses a release while the issue is open.
        run: GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" bash .github/scripts/write-job-summary.sh
