name: Platform red tracker

# Pull requests run Linux only (#13802), so a macOS/Windows regression first shows on the dev push run.
# When a macOS/Windows job of such a run fails, this files ONE open `ci:platform-red` issue, or comments on the open
# one, naming for each failed job the merge whose run first turned it red (a later merge only inherits the red).
# publish.yml refuses to cut a release while that issue is open, so any green dev push run re-checks the issue and
# closes it once every tracked job passed again on its own workflow's latest dev push run (close-when-green).
on:
  workflow_run:
    workflows: [CI, Computer conformance fixtures, Computer engine, Desktop engine, Desktop Windows QA, Engine trust helper, get.omo.dev CI, Git job helper]
    types: [completed]
    branches: [dev]

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  # No concurrency group anywhere: GitHub would cancel a pending run, losing its failed jobs and merged PR.
  detect:
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      failed: ${{ steps.failed.outputs.failed }}
      introduced: ${{ steps.failed.outputs.introduced }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: List the failed macOS/Windows jobs and the run each first went red in
        id: failed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          OUT_DIR="$RUNNER_TEMP/platform-red" bash .github/scripts/platform-red-first-red.sh
          failed="$(cat "$RUNNER_TEMP/platform-red/failed.md")"
          {
            echo "introduced=$(cat "$RUNNER_TEMP/platform-red/introduced")"
            echo "failed<<PLATFORM_RED_EOF"
            echo "$failed"
            echo "PLATFORM_RED_EOF"
          } >> "$GITHUB_OUTPUT"
          [ -n "$failed" ] || echo "Only Linux jobs failed; the platform-red issue is for macOS/Windows legs."

      - name: Write job summary
        if: always()
        shell: bash
        env:
          JOB_SUMMARY_TITLE: Platform red tracker - detect
          JOB_SUMMARY_STATUS: ${{ job.status }}
          JOB_SUMMARY_DETAILS: |
            - Reads the failed jobs of `${{ github.event.workflow_run.name }}` on `dev` at `${{ github.event.workflow_run.head_sha }}`.
            - Hands any failed macOS/Windows job to the issue writer.
          JOB_SUMMARY_NEXT: If this fails, the jobs API could not be read; re-run it so a red platform job is not missed.
        run: GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" bash .github/scripts/write-job-summary.sh

  file-issue:
    needs: detect
    if: needs.detect.outputs.failed != ''
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: File or update the platform-red tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_NAME: ${{ github.event.workflow_run.name }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          FAILED: ${{ needs.detect.outputs.failed }}
          INTRODUCED: ${{ needs.detect.outputs.introduced }}
        run: |
          set -euo pipefail
          merged="$(gh api "repos/$GH_REPO/commits/$HEAD_SHA/pulls" --jq '[.[] | select(.merged_at != null) | "#\(.number)"] | join(", ")')"
          body="$RUNNER_TEMP/platform-red.md"
          {
            if [ "$INTRODUCED" = true ]; then
              echo "A macOS/Windows job turned red on \`dev\` after merging ${merged:-a direct push} at \`$HEAD_SHA\`."
            else
              echo "A macOS/Windows job is still red on \`dev\` after merging ${merged:-a direct push} at \`$HEAD_SHA\`; that merge did not turn it red."
            fi
            echo
            echo "Workflow run: [$RUN_NAME]($RUN_URL)"
            echo
            echo "Each failed job names the merge whose dev push run first failed it:"
            echo
            echo "$FAILED"
            echo
            echo "Pull requests run Linux only (#13802), so a dev push run is the first platform signal for a change."
            echo "Fix it in a pull request that says \`Fixes #<this issue>\`; releases are refused while this issue is open."
          } > "$body"
          oldest_open() { gh issue list --label ci:platform-red --state open --json number --jq 'map(.number) | min // empty'; }
          issue="$(oldest_open)"
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body-file "$body"
            echo "Commented on #$issue."
            exit 0
          fi
          gh label create ci:platform-red --color B60205 --force \
            --description "A macOS/Windows job is red on dev; releases are refused while open"
          created="$(gh issue create --title "Platform CI red on dev (macOS/Windows)" --label ci:platform-red --body-file "$body")"
          created="${created##*/}"
          # Two red runs finishing together can each find no issue and both create one: the oldest open issue wins.
          issue="$(oldest_open)"
          # The issue list can briefly lag a create; with nothing listed, the issue just created is the one.
          issue="${issue:-$created}"
          if [ "$issue" != "$created" ]; then
            gh issue comment "$issue" --body-file "$body"
            gh issue close "$created" --reason "not planned" --comment "Duplicate of #$issue."
          fi
          echo "Tracking issue: #$issue."

      - name: Write job summary
        if: always()
        shell: bash
        env:
          JOB_SUMMARY_TITLE: Platform red tracker - issue
          JOB_SUMMARY_STATUS: ${{ job.status }}
          JOB_SUMMARY_DETAILS: |
            - Files or comments on the one open `ci:platform-red` issue for `${{ github.event.workflow_run.name }}` at `${{ github.event.workflow_run.head_sha }}`.
          JOB_SUMMARY_NEXT: Fix the listed macOS/Windows job; publish.yml refuses a release while the issue is open.
        run: GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" bash .github/scripts/write-job-summary.sh

  close-when-green:
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Close the platform-red issue when every tracked job is green on its own workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: OUT_DIR="$RUNNER_TEMP/platform-red-close" bash .github/scripts/platform-red-close.sh

      - name: Write job summary
        if: always()
        shell: bash
        env:
          JOB_SUMMARY_TITLE: Platform red tracker - close when green
          JOB_SUMMARY_STATUS: ${{ job.status }}
          JOB_SUMMARY_DETAILS: |
            - After `${{ github.event.workflow_run.name }}` passed on `dev` at `${{ github.event.workflow_run.head_sha }}`, checks every job of the open `ci:platform-red` issue on its own workflow's latest dev push run.
          JOB_SUMMARY_NEXT: If the issue stayed open, the step log names the job that is still red, skipped its tests, or has not re-run since its red commit.
        run: GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" bash .github/scripts/write-job-summary.sh
