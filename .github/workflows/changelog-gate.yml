name: PR changelog gate

on:
  pull_request:
    branches: [dev]
    # edited: the release marker reads the title and body, so a correction re-runs the gate.
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  changelog-gate:
    name: Changelog gate
    # Every label event computes the real verdict, never a skipped-success check.
    # This gate's concurrency cannot cancel the main CI workflow.
    concurrency:
      group: pr-changelog-gate-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          # Use the merge tree's gate, including for heads that predate this script.
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Check this PR's changelog fragment
        env:
          EVENT_NAME: ${{ github.event_name }}
          CHANGELOG_GATE_BASE: ${{ github.event.pull_request.base.sha }}
          CHANGELOG_GATE_BASE_REF: ${{ github.event.pull_request.base.ref }}
          CHANGELOG_GATE_BRANCH: ${{ github.head_ref }}
          CHANGELOG_GATE_ACTOR: ${{ github.event.pull_request.user.login }}
          # A release branch pushed to THIS repository: a fork can name its branch anything, but only a writer
          # (publish.yml's token) can push here. The marker check in the script does the rest (#11704).
          CHANGELOG_GATE_RELEASE: ${{ startsWith(github.head_ref, 'release/') && github.event.pull_request.head.repo.full_name == github.repository && '1' || '0' }}
          CHANGELOG_GATE_PR: ${{ github.event.pull_request.number }}
          CHANGELOG_GATE_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          CHANGELOG_GATE_TITLE: ${{ github.event.pull_request.title }}
          CHANGELOG_GATE_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ "$EVENT_NAME" = "merge_group" ]; then
            echo "changelog-gate: PASS - queued PRs have already passed their PR gate"
            exit 0
          fi
          # The gate that judges a PR is the BASE branch's copy (#10710): a PR cannot change its own verdict by
          # editing the runner or its config. Only a base that predates the runner falls back to the PR's copy.
          gate="$RUNNER_TEMP/changelog-gate-base"
          mkdir -p "$gate"
          # No --depth: the checkout has full history, and a shallow refetch breaks merge-base once the base moves.
          git fetch --no-tags origin "$CHANGELOG_GATE_BASE_REF"
          git archive "origin/$CHANGELOG_GATE_BASE_REF" script | tar -x -C "$gate"
          if [ -f "$gate/script/check-pr-changelog.ts" ] && [ -f "$gate/script/release-pr-marker.ts" ]; then
            bun "$gate/script/check-pr-changelog.ts"
          else
            echo "changelog-gate: NOTICE - the base branch predates this gate; running the PR's copy (bootstrap only)"
            bun script/check-pr-changelog.ts
          fi

      - name: Write job summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## Changelog gate"
            echo "- Status: $JOB_STATUS"
          } >> "$GITHUB_STEP_SUMMARY"
