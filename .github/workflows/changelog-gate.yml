name: PR changelog gate

on:
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  changelog-gate:
    name: Changelog gate
    # Every label event computes the real verdict, never a skipped-success check.
    # This gate's concurrency cannot cancel the main CI workflow.
    concurrency:
      group: pr-changelog-gate-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          # Use the merge tree's gate, including for heads that predate this script.
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"

      - name: Check this PR's Unreleased addition
        env:
          EVENT_NAME: ${{ github.event_name }}
          CHANGELOG_GATE_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          CHANGELOG_GATE_PR: ${{ github.event.pull_request.number }}
          CHANGELOG_GATE_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          if [ "$EVENT_NAME" = "merge_group" ]; then
            echo "changelog-gate: PASS - queued PRs have already passed their PR gate"
          else
            bun script/check-pr-changelog.mjs --head "$PR_HEAD"
          fi

      - name: Write job summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## Changelog gate"
            echo "- Status: $JOB_STATUS"
          } >> "$GITHUB_STEP_SUMMARY"
