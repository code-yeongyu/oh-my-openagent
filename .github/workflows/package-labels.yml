name: Package Labels

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Open pull request to relabel"
        required: true
        type: string
  issues:
    types: [opened, edited]
  workflow_run:
    workflows: [PR Automation Signal]
    types: [completed]

permissions:
  contents: read
  issues: write
  pull-requests: write

env:
  OPENCODE_LABEL: opencode
  LAZYCODEX_LABEL: lazycodex
  GENERATED_LABEL: lazycodex-generated
  PACKAGE_LABEL_COLOR: ededed

concurrency:
  # Only PR Automation Signal runs are grouped: a newer signal for the same PR head supersedes the older run. Every
  # other trigger (CLA signing/recheck comments, any other comment, issues, dispatch, schedule, merge_group) keys on its
  # own run id, so nothing can cancel or replace a run that is recording a CLA signature or a manual recheck.
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_run' && format('signal-{0}:{1}', github.event.workflow_run.head_repository.full_name, github.event.workflow_run.head_branch) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'workflow_run' }}

jobs:
  resolve-pr:
    # A cancelled or skipped PR Automation Signal run carries no result to act on: skip cleanly.
    # A real upstream failure still runs and fails. notice-skipped-signal records the skip.
    if: >-
      (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion != 'cancelled' &&
        github.event.workflow_run.conclusion != 'skipped') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      number: ${{ steps.pr.outputs.number }}
      title: ${{ steps.pr.outputs.title }}
      body: ${{ steps.pr.outputs.body }}
    steps:
      - name: Check out trusted automation helper
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: script/pr-automation-context.mjs
          sparse-checkout-cone-mode: false
      - name: Resolve current PR from GitHub run metadata
        id: pr
        uses: actions/github-script@v9
        with:
          script: |
            const { pathToFileURL } = await import('node:url');
            const { resolveAutomationPR } = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/script/pr-automation-context.mjs`).href);
            const pr = await resolveAutomationPR({ github, context, core });
            if (!pr) return;
            core.setOutput('number', pr.number);
            core.setOutput('title', pr.title);
            core.setOutput('body', pr.body ?? '');
      - name: Write job summary
        if: always()
        run: echo 'Resolved current PR identity from authenticated GitHub metadata.' >> "$GITHUB_STEP_SUMMARY"

  ensure-labels:
    # Skip for cancelled or skipped signals; notice-skipped-signal records the skip instead.
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion != 'cancelled' && github.event.workflow_run.conclusion != 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Ensure canonical labels exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          ensure_label() {
            local name="$1"
            local color="$2"
            local description="$3"
            local error_file="/tmp/${name}-label-error.log"

            if gh label create "$name" --repo "$GITHUB_REPOSITORY" --color "$color" --description "$description" 2>"$error_file"; then
              return 0
            fi

            if grep -qi "already exists" "$error_file"; then
              gh label edit "$name" --repo "$GITHUB_REPOSITORY" --color "$color" --description "$description"
              return 0
            fi

            cat "$error_file" >&2
            return 1
          }

          ensure_label "$LAZYCODEX_LABEL" "7C3AED" "Codex (LazyCodex) edition: packages/omo-codex"
          ensure_label "$OPENCODE_LABEL" "0EA5E9" "OpenCode edition: packages/omo-opencode"
          ensure_label "$GENERATED_LABEL" "22C55E" "Reports and pull requests generated by LazyCodex"

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## Ensure package labels"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Result | \`${{ job.status }}\` |"
            echo "| Workflow | \`${{ github.workflow }}\` |"
            echo "| Event | \`${{ github.event_name }}\` |"
            echo
            echo "### What this job checks"
            echo
            echo "- Creates or updates canonical package labels."
            echo "- Keeps OpenCode, LazyCodex, and generated-report labels available."
            echo
            echo "### If this fails"
            echo
            echo "Check repository label permissions and the first \`gh label\` error."
          } >> "$GITHUB_STEP_SUMMARY"

  label-pull-request:
    needs: [ensure-labels, resolve-pr]
    if: github.event_name != 'issues' && needs.resolve-pr.outputs.number != ''
    runs-on: ubuntu-latest
    steps:
      - name: Label by changed packages and PR text
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.resolve-pr.outputs.number }}
          PR_TITLE: ${{ needs.resolve-pr.outputs.title }}
          PR_BODY: ${{ needs.resolve-pr.outputs.body }}
        run: |
          set -euo pipefail

          label_for_path() {
            case "$1" in
              packages/*/*) : ;;
              *) return 1 ;;
            esac
            local pkg="${1#packages/}"
            pkg="${pkg%%/*}"
            case "$pkg" in
              omo-opencode) printf '%s\n' "$OPENCODE_LABEL" ;;
              omo-codex) printf '%s\n' "$LAZYCODEX_LABEL" ;;
              oh-my-opencode-*) printf '%s\n' "$OPENCODE_LABEL" ;;
              *) printf '%s\n' "$pkg" ;;
            esac
          }

          declare -A wanted=()
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            if label="$(label_for_path "$path")"; then
              wanted["$label"]=1
            fi
          done < <(gh pr diff "$PR_NUMBER" --name-only --repo "$GITHUB_REPOSITORY")

          pr_text="$(printf '%s\n%s\n' "$PR_TITLE" "$PR_BODY" | tr '[:upper:]' '[:lower:]')"
          case "$pr_text" in
            *lazycodex-generated*|*"this pr was generated by lazycodex"*)
              echo "This PR was generated by LazyCodex."
              wanted["$GENERATED_LABEL"]=1
              ;;
          esac

          if [ "${#wanted[@]}" -eq 0 ]; then
            echo "No package-specific changes detected; nothing to label."
            exit 0
          fi

          ensure_package_label() {
            gh label create "$1" --repo "$GITHUB_REPOSITORY" --color "$PACKAGE_LABEL_COLOR" --description "Changes under packages/$1" 2>/dev/null || true
          }

          add_args=()
          for label in "${!wanted[@]}"; do
            case "$label" in
              "$OPENCODE_LABEL" | "$LAZYCODEX_LABEL" | "$GENERATED_LABEL") : ;;
              *) ensure_package_label "$label" ;;
            esac
            add_args+=(--add-label "$label")
          done
          gh pr edit "$PR_NUMBER" "${add_args[@]}" --repo "$GITHUB_REPOSITORY"

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## Pull request package labels"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Result | \`${{ job.status }}\` |"
            echo "| Workflow | \`${{ github.workflow }}\` |"
            echo "| Pull request | \`#${{ github.event.pull_request.number }}\` |"
            echo
            echo "### What this job checks"
            echo
            echo "- Reads changed paths from the pull request diff."
            echo "- Adds package-specific labels and LazyCodex generated markers."
            echo
            echo "### If this fails"
            echo
            echo "Check \`gh pr diff\` output and label edit permissions for the target repository."
          } >> "$GITHUB_STEP_SUMMARY"

  label-issue:
    needs: [ensure-labels]
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    steps:
      - name: Label by issue text
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail

          issue_text="$(printf '%s\n%s\n' "$ISSUE_TITLE" "$ISSUE_BODY" | tr '[:upper:]' '[:lower:]')"

          add_args=()
          case "$issue_text" in
            *lazycodex-ai*|*omo-codex*|*"codex light"*|*lazycodex*)
              add_args+=(--add-label "$LAZYCODEX_LABEL")
              ;;
          esac
          case "$issue_text" in
            *omo-opencode*)
              add_args+=(--add-label "$OPENCODE_LABEL")
              ;;
          esac
          case "$issue_text" in
            *lazycodex-generated*|*"this issue was generated by lazycodex"*)
              add_args+=(--add-label "$GENERATED_LABEL")
              ;;
          esac

          if [ "${#add_args[@]}" -eq 0 ]; then
            echo "Issue does not match any label rule; nothing to label."
            exit 0
          fi

          gh issue edit "$ISSUE_NUMBER" "${add_args[@]}" --repo "$GITHUB_REPOSITORY"

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## Issue package labels"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Result | \`${{ job.status }}\` |"
            echo "| Workflow | \`${{ github.workflow }}\` |"
            echo "| Issue | \`#${{ github.event.issue.number }}\` |"
            echo
            echo "### What this job checks"
            echo
            echo "- Reads issue title and body for package keywords."
            echo "- Adds OpenCode, LazyCodex, or generated-report labels when matched."
            echo
            echo "### If this fails"
            echo
            echo "Check issue edit permissions and the matched label names."
          } >> "$GITHUB_STEP_SUMMARY"

  notice-skipped-signal:
    # Runs exactly when the consumer jobs skipped for a cancelled or skipped signal: if no
    # newer completed signal run covers the same head, say so loudly instead of exiting silently.
    if: >-
      github.event_name == 'workflow_run' &&
      (github.event.workflow_run.conclusion == 'cancelled' ||
        github.event.workflow_run.conclusion == 'skipped')
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: Report a skipped signal with no newer run for this head
        uses: actions/github-script@v9
        with:
          script: |
            const head = context.payload.workflow_run.head_sha;
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'pr-automation-signal.yml',
              head_sha: head,
              per_page: 100,
            });
            const thisId = context.payload.workflow_run.id;
            const newer = data.workflow_runs.filter((run) => run.id > thisId);
            if (newer.length > 0) {
              core.info(`A newer PR Automation Signal run (${newer[0].run_number}) covers head ${head.slice(0, 10)}; this signal carried no result to act on.`);
              return;
            }
            core.warning(`No newer PR Automation Signal run for head ${head.slice(0, 10)}: the ${context.workflow} checks have NOT run for this head. Re-run with workflow_dispatch (pr_number) if this head still needs them.`);
            await core.summary
              .addHeading(`${context.workflow}: checks skipped on a cancelled signal`)
              .addRaw(`No newer PR Automation Signal run exists for head ${head.slice(0, 10)}. The checks did not run. Use the workflow_dispatch input pr_number to run them for this PR.`)
              .write();
      - name: Write job summary
        if: always()
        run: |
          {
            echo "## Skipped-signal notice"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Event | \`${{ github.event_name }}\` |"
            echo "| Upstream conclusion | \`${{ github.event.workflow_run.conclusion }}\` |"
            echo "| Detail | see the notice step output above |"
          } >> "$GITHUB_STEP_SUMMARY"
