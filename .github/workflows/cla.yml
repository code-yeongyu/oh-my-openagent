name: CLA Assistant

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Open pull request to recheck"
        required: true
        type: string
  issue_comment:
    types: [created]
  workflow_run:
    workflows: [PR Automation Signal]
    types: [completed]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write
  checks: write

jobs:
  cla:
    if: >-
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
        (github.event.comment.body == 'recheck' ||
          github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA')) ||
      github.event.workflow_run.event == 'pull_request' ||
      github.event.workflow_run.event == 'pull_request_review' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted automation helper
        if: github.event_name != 'issue_comment'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: script/pr-automation-context.mjs
          sparse-checkout-cone-mode: false

      - name: Resolve current PR from GitHub run metadata
        if: github.event_name != 'issue_comment'
        id: pr
        uses: actions/github-script@v9
        with:
          script: |
            const { pathToFileURL } = await import('node:url');
            const { prepareCLAEvent } = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/script/pr-automation-context.mjs`).href);
            const pr = await prepareCLAEvent({ github, context, core, eventPath: `${process.env.RUNNER_TEMP}/cla-pr-event.json` });
            if (pr) core.setOutput('head_sha', pr.head.sha);

      - name: Check stored CLA signatures
        id: cla_state
        if: github.event_name != 'issue_comment' && steps.pr.outputs.pr_number != ''
        uses: actions/github-script@v9
        with:
          script: |
            const { readFile } = await import('node:fs/promises');
            context.payload = JSON.parse(await readFile(`${process.env.RUNNER_TEMP}/cla-pr-event.json`, 'utf8'));
            const signaturePath = "signatures/cla.json";
            const signatureBranch = "cla-signatures";
            const allowlist = [
              "code-yeongyu",
              "YeongYU",
              "bot*",
              "dependabot*",
              "github-actions*",
              "*[bot]",
              "sisyphus-dev-ai",
              "web-flow",
            ];

            const matchesAllowlist = (login) => {
              const normalizedLogin = login.toLowerCase();

              return allowlist.some((entry) => {
                const pattern = entry.toLowerCase();

                if (pattern.startsWith("*")) {
                  return normalizedLogin.endsWith(pattern.slice(1));
                }

                if (pattern.endsWith("*")) {
                  return normalizedLogin.startsWith(pattern.slice(0, -1));
                }

                return normalizedLogin === pattern;
              });
            };

            const { owner, repo } = context.repo;
            const pullNumber = context.payload.pull_request.number;

            const [signatureFile, commits] = await Promise.all([
              github.rest.repos.getContent({
                owner,
                repo,
                path: signaturePath,
                ref: signatureBranch,
              }),
              github.paginate(github.rest.pulls.listCommits, {
                owner,
                repo,
                pull_number: pullNumber,
                per_page: 100,
              }),
            ]);

            if (Array.isArray(signatureFile.data) || signatureFile.data.type !== "file") {
              core.setFailed(`${signaturePath} is not a file on ${signatureBranch}`);
              return;
            }

            const signatureContent = Buffer.from(
              signatureFile.data.content,
              signatureFile.data.encoding,
            ).toString("utf8");
            const signatures = JSON.parse(signatureContent);
            const signedContributors = Array.isArray(signatures.signedContributors)
              ? signatures.signedContributors
              : [];
            const signedIds = new Set(
              signedContributors
                .map((contributor) => Number(contributor.id))
                .filter((id) => Number.isFinite(id)),
            );
            const signedNames = new Set(
              signedContributors
                .map((contributor) => String(contributor.name || "").toLowerCase())
                .filter(Boolean),
            );
            const contributors = new Map();

            for (const commit of commits) {
              if (commit.author?.login && commit.author?.id) {
                contributors.set(commit.author.login, {
                  id: commit.author.id,
                  login: commit.author.login,
                });
              }
            }

            const unsigned = [...contributors.values()].filter((contributor) => {
              const login = contributor.login.toLowerCase();

              return (
                !matchesAllowlist(contributor.login) &&
                !signedIds.has(contributor.id) &&
                !signedNames.has(login)
              );
            });

            core.setOutput("needs_cla_action", unsigned.length > 0 ? "true" : "false");

            if (unsigned.length > 0) {
              core.info(
                `CLA Assistant needed for unsigned contributors: ${unsigned
                  .map((contributor) => contributor.login)
                  .join(", ")}`,
              );
            } else {
              core.info("All linked commit authors already signed the CLA or are allowlisted.");
            }

      - name: CLA Assistant
        if: >-
          (github.event_name == 'issue_comment' &&
            (github.event.comment.body == 'recheck' ||
              github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA')) ||
          steps.cla_state.outputs.needs_cla_action == 'true'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Adapter for Contributor Assistant's PR-event API, not a privileged
          # pull_request_target trigger. The payload was resolved via GitHub.
          GITHUB_EVENT_NAME: ${{ github.event_name != 'issue_comment' && 'pull_request_target' || github.event_name }}
          GITHUB_EVENT_PATH: ${{ github.event_name != 'issue_comment' && format('{0}/cla-pr-event.json', runner.temp) || github.event_path }}
        with:
          path-to-signatures: 'signatures/cla.json'
          path-to-document: 'https://github.com/code-yeongyu/oh-my-openagent/blob/dev/CLA.md'
          branch: 'cla-signatures'
          allowlist: code-yeongyu,YeongYU,bot*,dependabot*,github-actions*,*[bot],sisyphus-dev-ai,web-flow
          custom-notsigned-prcomment: |
            Thank you for your contribution! Before we can merge this PR, we need you to sign our [Contributor License Agreement (CLA)](https://github.com/code-yeongyu/oh-my-opencode/blob/master/CLA.md).
            
            **To sign the CLA**, please comment on this PR with:
            ```
            I have read the CLA Document and I hereby sign the CLA
            ```
            
            This is a one-time requirement. Once signed, all your future contributions will be automatically accepted.
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: |
            All contributors have signed the CLA. Thank you! ✅
          lock-pullrequest-aftermerge: false

      - name: Report CLA result on the current PR head
        if: >-
          always() &&
          ((github.event_name != 'issue_comment' && steps.pr.outputs.pr_number != '') ||
            github.event_name == 'issue_comment')
        uses: actions/github-script@v9
        env:
          PR_NUMBER: ${{ steps.pr.outputs.pr_number || github.event.issue.number }}
          EXPECTED_SHA: ${{ steps.pr.outputs.head_sha }}
          RESULT: ${{ job.status }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: Number(process.env.PR_NUMBER) });
            if (pr.state !== 'open' || (process.env.EXPECTED_SHA && pr.head.sha !== process.env.EXPECTED_SHA)) return;
            await github.rest.checks.create({
              owner, repo, name: 'cla', head_sha: pr.head.sha,
              status: 'completed', conclusion: process.env.RESULT === 'success' ? 'success' : 'failure',
              output: { title: 'CLA signature check', summary: `Trusted CLA automation: ${process.env.RESULT}.` },
            });

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## CLA Assistant"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Result | \`${{ job.status }}\` |"
            echo "| Workflow | \`${{ github.workflow }}\` |"
            echo "| Event | \`${{ github.event_name }}\` |"
            echo
            echo "### What this job checks"
            echo
            echo "- Checks stored CLA signatures for pull requests."
            echo "- Runs Contributor Assistant only when a signature action is needed."
            echo
            echo "### If this fails"
            echo
            echo "Check the signature file on \`dev\`, contributor allowlist, and GitHub token permissions."
          } >> "$GITHUB_STEP_SUMMARY"
