name: CLA Assistant

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Open pull request to recheck"
        required: true
        type: string
      # Authoritative on workflow_dispatch only when it names a disclosure: a maintainer
      # declaring or correcting one. Defaults to "no" so a plain recheck records nothing new and
      # non-AI authors are unaffected; "no" also means "nothing declared", so the PR body's own
      # answer is still consulted. Named ai_assisted, not ai-assisted, to match the sibling
      # pr_number id and because a hyphenated id needs inputs['...'] in every expression.
      ai_assisted:
        description: "AI-assistance disclosure to record for this PR"
        required: false
        type: choice
        default: "no"
        options:
          - "no"
          - "pair-programming"
          - "fully-ai-authored"
      # Maintainer discretion on whether an absent disclosure is a failure or a note.
      # "advisory" (the default) keeps this informational and non-blocking.
      ai_disclosure_mode:
        description: "Whether an undisclosed AI-assisted PR fails the ai-attribution check"
        required: false
        type: choice
        default: "advisory"
        options:
          - "advisory"
          - "required"
  issue_comment:
    types: [created]
  workflow_run:
    workflows: [PR Automation Signal]
    types: [completed]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write
  checks: write

concurrency:
  # Only PR Automation Signal runs are grouped: a newer signal for the same PR head supersedes the older run. Every
  # other trigger (CLA signing/recheck comments, any other comment, issues, dispatch, schedule, merge_group) keys on its
  # own run id, so nothing can cancel or replace a run that is recording a CLA signature or a manual recheck.
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_run' && format('signal-{0}:{1}', github.event.workflow_run.head_repository.full_name, github.event.workflow_run.head_branch) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'workflow_run' }}

jobs:
  cla:
    # A cancelled or skipped PR Automation Signal run carries no result to act on: skip cleanly.
    # A real upstream failure still runs and fails. notice-skipped-signal records the skip.
    if: >-
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
        (github.event.comment.body == 'recheck' ||
          github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA')) ||
      (github.event_name == 'workflow_run' &&
        (github.event.workflow_run.event == 'pull_request' ||
          github.event.workflow_run.event == 'pull_request_review') &&
        github.event.workflow_run.conclusion != 'cancelled' &&
        github.event.workflow_run.conclusion != 'skipped') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted automation helper
        if: github.event_name != 'issue_comment'
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: script/pr-automation-context.mjs
          sparse-checkout-cone-mode: false

      - name: Resolve current PR from GitHub run metadata
        if: github.event_name != 'issue_comment'
        id: pr
        uses: actions/github-script@v9
        with:
          script: |
            const { pathToFileURL } = await import('node:url');
            const { prepareCLAEvent } = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/script/pr-automation-context.mjs`).href);
            const pr = await prepareCLAEvent({ github, context, core, eventPath: `${process.env.RUNNER_TEMP}/cla-pr-event.json` });
            if (pr) core.setOutput('head_sha', pr.head.sha);

      - name: Check stored CLA signatures
        id: cla_state
        if: github.event_name != 'issue_comment' && steps.pr.outputs.pr_number != ''
        uses: actions/github-script@v9
        with:
          script: |
            const { readFile } = await import('node:fs/promises');
            context.payload = JSON.parse(await readFile(`${process.env.RUNNER_TEMP}/cla-pr-event.json`, 'utf8'));
            const signaturePath = "signatures/cla.json";
            const signatureBranch = "cla-signatures";
            const allowlist = [
              "code-yeongyu",
              "YeongYU",
              "bot*",
              "dependabot*",
              "github-actions*",
              "*[bot]",
              "sisyphus-dev-ai",
              "web-flow",
            ];

            const matchesAllowlist = (login) => {
              const normalizedLogin = login.toLowerCase();

              return allowlist.some((entry) => {
                const pattern = entry.toLowerCase();

                if (pattern.startsWith("*")) {
                  return normalizedLogin.endsWith(pattern.slice(1));
                }

                if (pattern.endsWith("*")) {
                  return normalizedLogin.startsWith(pattern.slice(0, -1));
                }

                return normalizedLogin === pattern;
              });
            };

            const { owner, repo } = context.repo;
            const pullNumber = context.payload.pull_request.number;

            const [signatureFile, commits] = await Promise.all([
              github.rest.repos.getContent({
                owner,
                repo,
                path: signaturePath,
                ref: signatureBranch,
              }),
              github.paginate(github.rest.pulls.listCommits, {
                owner,
                repo,
                pull_number: pullNumber,
                per_page: 100,
              }),
            ]);

            if (Array.isArray(signatureFile.data) || signatureFile.data.type !== "file") {
              core.setFailed(`${signaturePath} is not a file on ${signatureBranch}`);
              return;
            }

            const signatureContent = Buffer.from(
              signatureFile.data.content,
              signatureFile.data.encoding,
            ).toString("utf8");
            const signatures = JSON.parse(signatureContent);
            const signedContributors = Array.isArray(signatures.signedContributors)
              ? signatures.signedContributors
              : [];
            const signedIds = new Set(
              signedContributors
                .map((contributor) => Number(contributor.id))
                .filter((id) => Number.isFinite(id)),
            );
            const signedNames = new Set(
              signedContributors
                .map((contributor) => String(contributor.name || "").toLowerCase())
                .filter(Boolean),
            );
            const contributors = new Map();

            for (const commit of commits) {
              if (commit.author?.login && commit.author?.id) {
                contributors.set(commit.author.login, {
                  id: commit.author.id,
                  login: commit.author.login,
                });
              }
            }

            const unsigned = [...contributors.values()].filter((contributor) => {
              const login = contributor.login.toLowerCase();

              return (
                !matchesAllowlist(contributor.login) &&
                !signedIds.has(contributor.id) &&
                !signedNames.has(login)
              );
            });

            core.setOutput("needs_cla_action", unsigned.length > 0 ? "true" : "false");

            if (unsigned.length > 0) {
              const { data: current } = await github.rest.pulls.get({
                owner, repo, pull_number: pullNumber,
              });
              if (current.state !== "open" ||
                  current.head.sha !== context.payload.pull_request.head.sha) return;
              const marker = "CLA Assistant Lite bot";
              const body = `Thank you for your contribution! ${unsigned
                .map(contributor => `@${contributor.login}`).join(", ")} must sign the ` +
                `[Contributor License Agreement](https://github.com/${owner}/${repo}/blob/dev/CLA.md).\n\n` +
                "To sign, comment on this PR with:\n```\n" +
                "I have read the CLA Document and I hereby sign the CLA\n```\n\n" +
                `<sub>Posted by the **${marker}**.</sub>`;
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: pullNumber, per_page: 100,
              });
              const existing = comments.find(comment =>
                comment.user?.login === "github-actions[bot]" &&
                comment.body?.includes(marker));
              if (existing) {
                await github.rest.issues.updateComment({
                  owner, repo, comment_id: existing.id, body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: pullNumber, body,
                });
              }
            } else {
              core.info("All linked commit authors already signed the CLA or are allowlisted.");
            }

      - name: CLA Assistant
        if: >-
          github.event_name == 'issue_comment' &&
            (github.event.comment.body == 'recheck' ||
              github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA')
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/cla.json'
          path-to-document: 'https://github.com/code-yeongyu/oh-my-openagent/blob/dev/CLA.md'
          branch: 'cla-signatures'
          allowlist: code-yeongyu,YeongYU,bot*,dependabot*,github-actions*,*[bot],sisyphus-dev-ai,web-flow
          custom-notsigned-prcomment: |
            Thank you for your contribution! Before we can merge this PR, we need you to sign our [Contributor License Agreement (CLA)](https://github.com/code-yeongyu/oh-my-opencode/blob/master/CLA.md).
            
            **To sign the CLA**, please comment on this PR with:
            ```
            I have read the CLA Document and I hereby sign the CLA
            ```
            
            This is a one-time requirement. Once signed, all your future contributions will be automatically accepted.
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: |
            All contributors have signed the CLA. Thank you! ✅
          lock-pullrequest-aftermerge: false

      - name: Report CLA result on the current PR head
        if: >-
          always() &&
          ((github.event_name != 'issue_comment' && steps.pr.outputs.pr_number != '') ||
            github.event_name == 'issue_comment')
        uses: actions/github-script@v9
        env:
          PR_NUMBER: ${{ steps.pr.outputs.pr_number || github.event.issue.number }}
          EXPECTED_SHA: ${{ steps.pr.outputs.head_sha }}
          RESULT: ${{ job.status }}
          UNSIGNED: ${{ steps.cla_state.outputs.needs_cla_action }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: Number(process.env.PR_NUMBER) });
            if (pr.state !== 'open' || (process.env.EXPECTED_SHA && pr.head.sha !== process.env.EXPECTED_SHA)) return;
            await github.rest.checks.create({
              owner, repo, name: 'cla', head_sha: pr.head.sha,
              status: 'completed', conclusion: process.env.RESULT === 'success' && process.env.UNSIGNED !== 'true' ? 'success' : 'failure',
              output: { title: 'CLA signature check', summary: `Trusted CLA automation: ${process.env.RESULT}.` },
            });

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## CLA Assistant"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Result | \`${{ job.status }}\` |"
            echo "| Workflow | \`${{ github.workflow }}\` |"
            echo "| Event | \`${{ github.event_name }}\` |"
            echo
            echo "### What this job checks"
            echo
            echo "- Checks stored CLA signatures for pull requests."
            echo "- Records signing comments with Contributor Assistant; trusted API checks deliver instructions."
            echo
            echo "### If this fails"
            echo
            echo "Check the signature file on \`dev\`, contributor allowlist, and GitHub token permissions."
          } >> "$GITHUB_STEP_SUMMARY"

  ai-attribution:
    # Records the author's AI-assistance disclosure into signatures/ai-attribution.json on the
    # cla-signatures branch, the bot-managed branch the CLA signature registry already lives on.
    # It is a sibling file rather than a new key inside signatures/cla.json because the pinned
    # contributor-assistant action rewrites cla.json wholesale; a key stored there would be
    # destroyed by the next unrelated signature.
    #
    # Non-blocking by default: an undisclosed PR gets a "neutral" ai-attribution check, so no
    # merge is gated on this until a maintainer dispatches with ai_disclosure_mode=required.
    #
    # Source of truth: on workflow_dispatch a named ai_assisted value wins (a maintainer declaring
    # or correcting a disclosure); its "no" default means "nothing declared", so it falls through
    # to the PR body rather than erasing the author's answer. On every other trigger the value is
    # parsed from the PR body's "## AI Assistance" section. A write that would not change the
    # stored value is skipped, so unrelated re-runs never grow the record.
    if: >-
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
        (github.event.comment.body == 'recheck' ||
          github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA')) ||
      (github.event_name == 'workflow_run' &&
        (github.event.workflow_run.event == 'pull_request' ||
          github.event.workflow_run.event == 'pull_request_review') &&
        github.event.workflow_run.conclusion != 'cancelled' &&
        github.event.workflow_run.conclusion != 'skipped') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write
      checks: write
      pull-requests: read
    steps:
      - name: Check out trusted automation helper
        if: github.event_name != 'issue_comment'
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: script/pr-automation-context.mjs
          sparse-checkout-cone-mode: false

      - name: Resolve current PR from GitHub run metadata
        if: github.event_name != 'issue_comment'
        id: pr
        uses: actions/github-script@v9
        with:
          script: |
            const { pathToFileURL } = await import('node:url');
            const { prepareCLAEvent } = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/script/pr-automation-context.mjs`).href);
            try {
              const pr = await prepareCLAEvent({ github, context, core, eventPath: `${process.env.RUNNER_TEMP}/ai-attribution-pr-event.json` });
              if (pr) core.setOutput('head_sha', pr.head.sha);
            } catch (error) {
              // An advisory job must never go red because the signal was not usable.
              core.info(`No pull request resolved for AI attribution: ${error.message}`);
            }

      - name: Resolve AI-assistance disclosure
        id: disclosure
        if: github.event_name == 'issue_comment' || steps.pr.outputs.pr_number != ''
        uses: actions/github-script@v9
        env:
          DECLARED: ${{ inputs.ai_assisted }}
          MODE: ${{ inputs.ai_disclosure_mode }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number || github.event.issue.number }}
        with:
          script: |
            const { readFile } = await import('node:fs/promises');
            let payload = context.payload;
            if (context.eventName !== 'issue_comment') {
              try {
                payload = JSON.parse(await readFile(`${process.env.RUNNER_TEMP}/ai-attribution-pr-event.json`, 'utf8'));
              } catch (error) {
                core.info(`No pull request payload on disk: ${error.message}`);
                payload = null;
              }
            }
            const pullRequest = payload?.pull_request ?? payload;
            const prNumber = Number(pullRequest?.number ?? process.env.PR_NUMBER);
            if (!Number.isSafeInteger(prNumber) || prNumber <= 0) {
              core.info('No usable pull request; nothing to disclose against.');
              return;
            }

            const VALID = ['no', 'pair-programming', 'fully-ai-authored'];
            const HEADING = /^\s*#{1,6}\s/;
            const SECTION = /^\s*#{1,6}\s*AI Assistance\s*$/i;
            // The template writes "fully AI-authored"; the dispatch input writes
            // "fully-ai-authored". Accept both spellings, store the hyphenated one.
            const OPTION = /^\s*[-*]\s*\[( |x|X)\]\s*(none|no|pair-programming|fully[\s-]+ai-authored)\s*$/i;
            const normalize = value => {
              const candidate = String(value ?? '').trim().toLowerCase().replace(/[\s_]+/g, '-');
              if (candidate === 'none') return 'no';
              return VALID.includes(candidate) ? candidate : '';
            };

            // The PR body is untrusted contributor text. Strip HTML comments first so an
            // unrendered example box can never be read as a ticked answer.
            const fromBody = body => {
              if (typeof body !== 'string') return '';
              let inSection = false;
              const ticked = [];
              for (const line of body.replace(/<!--[\s\S]*?-->/g, '').split('\n')) {
                if (HEADING.test(line)) {
                  inSection = SECTION.test(line);
                  continue;
                }
                if (!inSection) continue;
                const option = OPTION.exec(line);
                if (option && option[1].toLowerCase() === 'x') ticked.push(normalize(option[2]));
              }
              // Exactly one ticked box is a disclosure. Zero, or several at once, is not an answer.
              return ticked.length === 1 ? ticked[0] : '';
            };

            const declared = normalize(process.env.DECLARED);
            const fromPrBody = fromBody(pullRequest.body);
            // The input default is "no", meaning "no disclosure declared on this run", so it
            // must not silently erase what the author wrote. Only a named disclosure overrides.
            const override = declared && declared !== 'no' ? declared : '';
            const value = override || fromPrBody;
            const source = override ? 'workflow-dispatch-input' : 'pr-body';

            core.setOutput('pr_number', String(prNumber));
            core.setOutput('value', value || 'none-recorded');
            core.setOutput('source', value ? source : 'none');
            core.setOutput('mode', process.env.MODE === 'required' ? 'required' : 'advisory');
            core.setOutput('body_value', fromPrBody || 'none-recorded');

      - name: Record the disclosure and report the ai-attribution check
        if: always() && steps.disclosure.outputs.pr_number != ''
        uses: actions/github-script@v9
        env:
          PR_NUMBER: ${{ steps.disclosure.outputs.pr_number }}
          VALUE: ${{ steps.disclosure.outputs.value }}
          SOURCE: ${{ steps.disclosure.outputs.source }}
          MODE: ${{ steps.disclosure.outputs.mode }}
          EXPECTED_SHA: ${{ steps.pr.outputs.head_sha }}
        with:
          script: |
            const RECORD_PATH = 'signatures/ai-attribution.json';
            const RECORD_BRANCH = 'cla-signatures';
            const { owner, repo } = context.repo;
            const pullNumber = Number(process.env.PR_NUMBER);
            const value = process.env.VALUE;
            const disclosed = value !== 'none-recorded';

            const { data: current } = await github.rest.pulls.get({ owner, repo, pull_number: pullNumber });
            if (current.state !== 'open' || (process.env.EXPECTED_SHA && current.head.sha !== process.env.EXPECTED_SHA)) {
              core.info('The pull request closed or advanced; leaving the record untouched.');
              return;
            }

            let outcome = 'not-recorded';
            if (disclosed) {
              const readRecord = async () => {
                try {
                  const { data } = await github.rest.repos.getContent({
                    owner, repo, path: RECORD_PATH, ref: RECORD_BRANCH,
                  });
                  if (Array.isArray(data) || data.type !== 'file') {
                    core.warning(`${RECORD_PATH} on ${RECORD_BRANCH} is not a file; leaving it untouched.`);
                    return undefined;
                  }
                  const parsed = JSON.parse(Buffer.from(data.content, data.encoding).toString('utf8'));
                  return { sha: data.sha, disclosures: Array.isArray(parsed.disclosures) ? parsed.disclosures : [] };
                } catch (error) {
                  if (error.status === 404) return { sha: undefined, disclosures: [] };
                  throw error;
                }
              };

              const entry = {
                pullRequest: pullNumber,
                headSha: current.head.sha,
                author: current.user?.login ?? 'unknown',
                value,
                source: process.env.SOURCE,
                recordedAt: new Date().toISOString(),
              };

              outcome = 'unchanged';
              for (let attempt = 1; attempt <= 3; attempt += 1) {
                const record = await readRecord();
                if (!record) {
                  outcome = 'skipped-unreadable-record';
                  break;
                }
                const previous = record.disclosures.find(item => Number(item.pullRequest) === pullNumber);
                if (previous?.value === entry.value && previous?.source === entry.source) break;
                const next = [...record.disclosures.filter(item => Number(item.pullRequest) !== pullNumber), entry];
                try {
                  await github.rest.repos.createOrUpdateFileContents({
                    owner, repo, path: RECORD_PATH, branch: RECORD_BRANCH,
                    message: `record AI-assistance disclosure for #${pullNumber} (${entry.value})`,
                    content: Buffer.from(`${JSON.stringify({ schemaVersion: 1, disclosures: next }, null, 2)}\n`).toString('base64'),
                    ...(record.sha ? { sha: record.sha } : {}),
                  });
                  outcome = 'recorded';
                  break;
                } catch (error) {
                  // Another CLA run committed first; re-read and rebase onto its entry.
                  if (error.status !== 409 && error.status !== 422) throw error;
                  core.info(`${RECORD_PATH} moved under this run; retrying (attempt ${attempt}).`);
                  if (attempt === 3) outcome = 'skipped-contention';
                }
              }
            }

            // The check carries the gate, never the job status, so an advisory run stays green.
            const mode = process.env.MODE === 'required' ? 'required' : 'advisory';
            const persisted = outcome === 'recorded' || outcome === 'unchanged';
            let conclusion;
            let title;
            if (!disclosed) {
              conclusion = mode === 'required' ? 'failure' : 'neutral';
              title = mode === 'required'
                ? 'AI assistance: disclosure required'
                : 'AI assistance: not disclosed (advisory)';
            } else if (persisted) {
              conclusion = 'success';
              title = `AI assistance: ${value}`;
            } else {
              // Answered, but the bot-managed record could not be written. Report that plainly
              // instead of a clean success that claims a record nobody can read.
              conclusion = mode === 'required' ? 'failure' : 'neutral';
              title = `AI assistance: ${value} (branch record not updated)`;
            }

            await github.rest.checks.create({
              owner, repo, name: 'ai-attribution', head_sha: current.head.sha,
              status: 'completed', conclusion,
              output: {
                title,
                summary: [
                  `Mode: \`${mode}\` (dispatch input \`ai_disclosure_mode\`).`,
                  '',
                  `- Disclosure: \`${disclosed ? value : 'none recorded'}\``,
                  `- Source: \`${disclosed ? process.env.SOURCE : 'none'}\``,
                  `- Record: \`${disclosed ? `${RECORD_PATH} on ${RECORD_BRANCH} (${outcome})` : 'nothing to write'}\``,
                  '',
                  'Informational. The check only fails when a maintainer dispatches this',
                  'workflow with `ai_disclosure_mode=required`.',
                ].join('\n'),
              },
            });

      - name: Write job summary
        if: always()
        env:
          AI_PR: ${{ steps.disclosure.outputs.pr_number }}
          AI_VALUE: ${{ steps.disclosure.outputs.value }}
          AI_SOURCE: ${{ steps.disclosure.outputs.source }}
          AI_MODE: ${{ steps.disclosure.outputs.mode }}
          AI_BODY_VALUE: ${{ steps.disclosure.outputs.body_value }}
        run: |
          {
            echo "## AI assistance disclosure"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Pull request | \`${AI_PR:-none resolved}\` |"
            echo "| Recorded value | \`${AI_VALUE:-none recorded}\` |"
            echo "| Source | \`${AI_SOURCE:-none}\` |"
            echo "| PR-body value | \`${AI_BODY_VALUE:-none recorded}\` |"
            echo "| Mode | \`${AI_MODE:-advisory}\` |"
            echo "| Workflow | \`${{ github.workflow }}\` |"
            echo "| Event | \`${{ github.event_name }}\` |"
            echo
            echo "### What this job checks"
            echo
            echo "- Reads the \`## AI Assistance\` section of the PR body, or the \`ai_assisted\` dispatch input."
            echo "- Upserts the answer into \`signatures/ai-attribution.json\` on \`cla-signatures\`."
            echo "- Publishes an \`ai-attribution\` check: \`success\` when disclosed, otherwise \`neutral\`."
            echo
            echo "### If this fails"
            echo
            echo "Advisory mode never fails the job. A \`failure\` conclusion means a maintainer"
            echo "dispatched with \`ai_disclosure_mode=required\` and the PR carries no disclosure."
          } >> "$GITHUB_STEP_SUMMARY"

  notice-skipped-signal:
    # Runs exactly when the consumer jobs skipped for a cancelled or skipped signal: if no
    # newer completed signal run covers the same head, say so loudly instead of exiting silently.
    if: >-
      github.event_name == 'workflow_run' &&
      (github.event.workflow_run.conclusion == 'cancelled' ||
        github.event.workflow_run.conclusion == 'skipped')
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: Report a skipped signal with no newer run for this head
        uses: actions/github-script@v9
        with:
          script: |
            const head = context.payload.workflow_run.head_sha;
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'pr-automation-signal.yml',
              head_sha: head,
              per_page: 100,
            });
            const thisId = context.payload.workflow_run.id;
            const newer = data.workflow_runs.filter((run) => run.id > thisId);
            if (newer.length > 0) {
              core.info(`A newer PR Automation Signal run (${newer[0].run_number}) covers head ${head.slice(0, 10)}; this signal carried no result to act on.`);
              return;
            }
            core.warning(`No newer PR Automation Signal run for head ${head.slice(0, 10)}: the ${context.workflow} checks have NOT run for this head. Re-run with workflow_dispatch (pr_number) if this head still needs them.`);
            await core.summary
              .addHeading(`${context.workflow}: checks skipped on a cancelled signal`)
              .addRaw(`No newer PR Automation Signal run exists for head ${head.slice(0, 10)}. The checks did not run. Use the workflow_dispatch input pr_number to run them for this PR.`)
              .write();
      - name: Write job summary
        if: always()
        run: |
          {
            echo "## Skipped-signal notice"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Event | \`${{ github.event_name }}\` |"
            echo "| Upstream conclusion | \`${{ github.event.workflow_run.conclusion }}\` |"
            echo "| Detail | see the notice step output above |"
          } >> "$GITHUB_STEP_SUMMARY"
