name: CLA Assistant

# CLA signing and 'recheck' comments only. The per-PR CLA check runs in pr-automation.yml. Every run here keeps its own
# group and is never cancelled: a later comment must not cancel a run that is recording a signature.
on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write
  checks: write

concurrency:
  group: ${{ github.workflow }}-run-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  cla:
    if: >-
      github.event_name == 'issue_comment' && github.event.issue.pull_request &&
        (github.event.comment.body == 'recheck' ||
          github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA')
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: >-
          github.event_name == 'issue_comment' &&
            (github.event.comment.body == 'recheck' ||
              github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA')
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/cla.json'
          path-to-document: 'https://github.com/code-yeongyu/oh-my-openagent/blob/dev/CLA.md'
          branch: 'cla-signatures'
          allowlist: code-yeongyu,YeongYU,bot*,dependabot*,github-actions*,*[bot],sisyphus-dev-ai,web-flow
          custom-notsigned-prcomment: |
            Thank you for your contribution! Before we can merge this PR, we need you to sign our [Contributor License Agreement (CLA)](https://github.com/code-yeongyu/oh-my-opencode/blob/master/CLA.md).
            
            **To sign the CLA**, please comment on this PR with:
            ```
            I have read the CLA Document and I hereby sign the CLA
            ```
            
            This is a one-time requirement. Once signed, all your future contributions will be automatically accepted.
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: |
            All contributors have signed the CLA. Thank you! ✅
          lock-pullrequest-aftermerge: false

      - name: Report CLA result on the current PR head
        if: always()
        uses: actions/github-script@v9
        env:
          PR_NUMBER: ${{ github.event.issue.number }}
          RESULT: ${{ job.status }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: Number(process.env.PR_NUMBER) });
            if (pr.state !== 'open' || (process.env.EXPECTED_SHA && pr.head.sha !== process.env.EXPECTED_SHA)) return;
            await github.rest.checks.create({
              owner, repo, name: 'cla', head_sha: pr.head.sha,
              status: 'completed', conclusion: process.env.RESULT === 'success' && process.env.UNSIGNED !== 'true' ? 'success' : 'failure',
              output: { title: 'CLA signature check', summary: `Trusted CLA automation: ${process.env.RESULT}.` },
            });

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## CLA Assistant"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Result | \`${{ job.status }}\` |"
            echo "| Workflow | \`${{ github.workflow }}\` |"
            echo "| Event | \`${{ github.event_name }}\` |"
            echo
            echo "### What this job checks"
            echo
            echo "- Records CLA signing and recheck comments; pr-automation.yml checks stored signatures on every PR head."
            echo "- Records signing comments with Contributor Assistant; trusted API checks deliver instructions."
            echo
            echo "### If this fails"
            echo
            echo "Check the signature file on \`dev\`, contributor allowlist, and GitHub token permissions."
          } >> "$GITHUB_STEP_SUMMARY"
