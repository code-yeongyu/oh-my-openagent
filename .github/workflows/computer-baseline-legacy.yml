name: Computer baseline (shipped runtime)

# The baseline of the RELEASED OmO Native computer tool (ideal-state plan row 8): the published omo-ai release is
# installed on a hosted runner, its own computer-use bundle is driven through `run.ts --driver legacy` with default
# settings, and the conformance catalog and the model-free task set record what it really does. No model is called and
# no credential is used: the release comes from the public npm registry and its engine from the public GitHub release.
# A cell is recorded not_run while its fixture app (row 4) or the desktop observer for the OS (rows 3, 30, 31) is
# missing. Linux and Windows run here; macOS joins with the live tier of row 5.
on:
  workflow_dispatch:
    inputs:
      release:
        description: omo-ai release to measure
        required: true
        default: "5.1.69"
  pull_request:
    paths:
      - ".github/workflows/computer-baseline-legacy.yml"
      - "script/qa/computer/conformance/drivers/legacy*.ts"
      - "script/qa/computer/conformance/baselines/**"
  push:
    branches:
      - "test/cu-is-row08-baseline"
    paths:
      - ".github/workflows/computer-baseline-legacy.yml"
      - "script/qa/computer/conformance/drivers/legacy*.ts"
      - "script/qa/computer/conformance/baselines/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  RELEASE: ${{ inputs.release || '5.1.69' }}
  # The release tag's settings resolver is extracted here (runner only, never committed) so its imports resolve.
  SETTINGS_DIR: packages/senpi-desktop-tool

jobs:
  x11:
    name: computer baseline legacy (x11)
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: The release's own default settings
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "refs/tags/v${RELEASE}:refs/tags/v${RELEASE}"
          mkdir -p "$SETTINGS_DIR/.release-settings"
          for file in settings.ts host-policy.ts; do
            git show "v${RELEASE}:$SETTINGS_DIR/src/${file}" > "$SETTINGS_DIR/.release-settings/${file}"
            echo "settings ${file} from v${RELEASE} $(git rev-parse "v${RELEASE}:$SETTINGS_DIR/src/${file}")"
          done
          echo "OMO_RELEASE_SETTINGS=$PWD/$SETTINGS_DIR/.release-settings/settings.ts" >> "$GITHUB_ENV"

      - name: Install Xorg, the accessibility bus and the fixture apps' toolkits
        shell: bash
        run: |
          set -uo pipefail
          apt() { sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get "$@"; }
          for attempt in 1 2 3; do
            if apt update && apt install -y --no-install-recommends xserver-xorg-core xserver-xorg-video-dummy \
              x11-utils dbus-x11 at-spi2-core python3-gi gir1.2-gtk-3.0 gir1.2-webkit2-4.1 openbox xdotool; then
              echo "apt attempt ${attempt} ok"; exit 0
            fi
            echo "apt attempt ${attempt} failed"; sleep $((attempt * 15))
          done
          exit 1

      - name: Start Xorg
        shell: bash
        run: |
          set -euo pipefail
          qa="${RUNNER_TEMP}/computer-baseline"
          mkdir -p "$qa"
          printf '%s\n' 'Section "Device"' '  Identifier "dummy"' '  Driver "dummy"' '  VideoRam 256000' 'EndSection' \
            'Section "Screen"' '  Identifier "screen"' '  Device "dummy"' '  DefaultDepth 24' \
            '  SubSection "Display"' '    Depth 24' '    Modes "1920x1080"' '  EndSubSection' 'EndSection' > "$qa/xorg.conf"
          sudo Xorg :99 -noreset -nolisten tcp -config "$qa/xorg.conf" -logfile "$qa/xorg.log" &
          for _ in $(seq 1 50); do DISPLAY=:99 xdpyinfo >/dev/null 2>&1 && break; sleep 0.2; done
          DISPLAY=:99 xdpyinfo | grep -m1 dimensions
          # A desktop has a window manager; without one the engine lists no client windows at all.
          DISPLAY=:99 openbox --sm-disable > "$qa/openbox.log" 2>&1 &
          for _ in $(seq 1 50); do DISPLAY=:99 xprop -root _NET_SUPPORTING_WM_CHECK 2>/dev/null | grep -q 'window id' && break; sleep 0.2; done
          DISPLAY=:99 xprop -root _NET_SUPPORTING_WM_CHECK
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      # No package in the repository carries Electron; the fixture app runs one pinned release (row 4).
      - name: Fetch Electron 45.3.1
        shell: bash
        run: |
          set -uo pipefail
          dir="$RUNNER_TEMP/electron"
          for attempt in 1 2 3; do
            if npm install --no-save --prefix "$dir" electron@45.3.1 > "$RUNNER_TEMP/electron.log" 2>&1 \
              && node "$dir/node_modules/electron/install.js" >> "$RUNNER_TEMP/electron.log" 2>&1 \
              && binary=$(node -p "require(process.argv[1])" "$dir/node_modules/electron") && test -x "$binary"; then
              sandbox="$(dirname "$binary")/chrome-sandbox"
              sudo chown root:root "$sandbox" && sudo chmod 4755 "$sandbox"
              echo "OMO_CONFORMANCE_ELECTRON=$binary" >> "$GITHUB_ENV"
              echo "electron 45.3.1 fetched on attempt ${attempt}: $binary"
              exit 0
            fi
            tail -n 5 "$RUNNER_TEMP/electron.log"
            [ "$attempt" -lt 3 ] && sleep 20
          done
          echo "::error::ENVIRONMENT failure, the runner could not fetch Electron (not a baseline finding)"
          exit 1

      - name: Install the released omo-ai
        shell: bash
        run: |
          set -euo pipefail
          npm install --global "omo-ai@${RELEASE}"
          echo "OMO_BIN=$(command -v omo)" >> "$GITHUB_ENV"
          echo "omo-ai $(npm ls --global --depth=0 omo-ai | grep -o 'omo-ai@[^ ]*')"

      - name: Shipped tool reaches its engine (no model, no credential)
        shell: bash
        run: |
          set -euo pipefail
          dbus-run-session -- bun script/qa/computer/conformance/drivers/legacy.ts --smoke | tee "${RUNNER_TEMP}/computer-baseline/smoke.log"

      # The control for the "delivered but the application never received it" cells: the release's background click,
      # then an independent xdotool click at the same point. Its own result is the evidence, so it never fails the job.
      - name: Control, release click then an independent click at the same point
        shell: bash
        run: |
          set +e -uo pipefail
          dbus-run-session -- bun script/qa/computer/conformance/drivers/legacy.ts --control | tee "${RUNNER_TEMP}/computer-baseline/control.log"
          echo "control EXIT ${PIPESTATUS[0]}"

      - name: Catalog and task set on the shipped runtime
        shell: bash
        run: |
          set +e -uo pipefail
          qa="${RUNNER_TEMP}/computer-baseline"
          dbus-run-session -- bun script/qa/computer/conformance/run.ts --os x11 --all --driver legacy --out "$qa/catalog" | tee "$qa/catalog.log"
          catalog=${PIPESTATUS[0]}
          dbus-run-session -- bun script/qa/computer/conformance/run.ts --os x11 --taskset --driver legacy --out "$qa/taskset" | tee "$qa/taskset.log"
          taskset=${PIPESTATUS[0]}
          echo "catalog EXIT ${catalog} taskset EXIT ${taskset}"
          test "$catalog" -eq 0 && test "$taskset" -eq 0

      - name: Teardown receipts
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          left=0
          sudo pkill -x Xorg 2>/dev/null || true
          pkill -f 'conformance/fixtures/' 2>/dev/null || true
          pkill -x openbox 2>/dev/null || true
          for name in senpi-desktop-engine openbox Xorg; do
            for _ in $(seq 1 25); do pgrep -x "$name" >/dev/null || break; sleep 0.2; done
            if pgrep -x "$name" >/dev/null; then echo "${name} LEFT $(pgrep -x "$name" | tr '\n' ' ')"; left=1; else echo "${name} procs 0"; fi
          done
          if pgrep -f 'conformance/fixtures/' >/dev/null; then echo "fixture LEFT"; left=1; else echo "fixture procs 0"; fi
          exit "$left"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: computer-baseline-legacy-x11
          path: ${{ runner.temp }}/computer-baseline
          if-no-files-found: warn

      - name: Write job summary
        if: always()
        shell: bash
        env:
          JOB_SUMMARY_TITLE: Computer baseline, shipped runtime (x11)
          JOB_SUMMARY_STATUS: ${{ job.status }}
          JOB_SUMMARY_DETAILS: |
            - Installs the released omo-ai and takes its default computer settings from the release tag's own resolver.
            - Drives the Linux native, web-view and Electron fixture apps; a cell without its fixture or observer is recorded not_run.
            - Smoke: the release's computer tool reaches its own engine with no model and no credential.
            - Runs the conformance catalog and the task set through run.ts --driver legacy on real Xorg.
            - Teardown: the engine, fixture and Xorg processes are gone.
          JOB_SUMMARY_NEXT: Open the computer-baseline-legacy-x11 artifact for run.json, environment.json and the logs.
        run: GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" bash .github/scripts/write-job-summary.sh

  windows:
    name: computer baseline legacy (windows)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: The release's own default settings
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "refs/tags/v${RELEASE}:refs/tags/v${RELEASE}"
          mkdir -p "$SETTINGS_DIR/.release-settings"
          for file in settings.ts host-policy.ts; do
            git show "v${RELEASE}:$SETTINGS_DIR/src/${file}" > "$SETTINGS_DIR/.release-settings/${file}"
            echo "settings ${file} from v${RELEASE} $(git rev-parse "v${RELEASE}:$SETTINGS_DIR/src/${file}")"
          done
          echo "OMO_RELEASE_SETTINGS=$(cygpath -w "$PWD/$SETTINGS_DIR/.release-settings/settings.ts")" >> "$GITHUB_ENV"

      - name: Interactive-desktop smoke
        shell: powershell
        run: ./script/qa/desktop/windows/interactive-desktop-smoke.ps1

      - name: Build the Windows fixture app
        shell: pwsh
        run: |
          $qa = Join-Path $env:RUNNER_TEMP "computer-baseline"
          New-Item -ItemType Directory -Force -Path $qa | Out-Null
          $exe = Join-Path $qa "conformance-fixture.exe"
          ./script/qa/computer/conformance/fixtures/native-windows/build.ps1 -Out $exe
          "OMO_CONFORMANCE_FIXTURE_EXE=$exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "fixture built $exe"

      # No package in the repository carries Electron; the fixture app runs one pinned release (row 4).
      - name: Fetch Electron 45.3.1
        shell: bash
        run: |
          set -uo pipefail
          dir="$RUNNER_TEMP/electron"
          for attempt in 1 2 3; do
            if npm install --no-save --prefix "$dir" electron@45.3.1 > "$RUNNER_TEMP/electron.log" 2>&1 \
              && node "$dir/node_modules/electron/install.js" >> "$RUNNER_TEMP/electron.log" 2>&1 \
              && binary=$(node -p "require(process.argv[1])" "$dir/node_modules/electron") && test -x "$binary"; then
              echo "OMO_CONFORMANCE_ELECTRON=$binary" >> "$GITHUB_ENV"
              echo "electron 45.3.1 fetched on attempt ${attempt}: $binary"
              exit 0
            fi
            tail -n 5 "$RUNNER_TEMP/electron.log"
            [ "$attempt" -lt 3 ] && sleep 20
          done
          echo "::error::ENVIRONMENT failure, the runner could not fetch Electron (not a baseline finding)"
          exit 1

      - name: Install the released omo-ai
        shell: bash
        run: |
          set -euo pipefail
          npm install --global "omo-ai@${RELEASE}"
          echo "OMO_BIN=$(cygpath -w "$(npm prefix --global)")\\node_modules\\omo-ai\\bin\\omo.js" >> "$GITHUB_ENV"
          echo "omo-ai $(npm ls --global --depth=0 omo-ai | grep -o 'omo-ai@[^ ]*')"

      - name: Shipped tool reaches its engine (no model, no credential)
        shell: bash
        run: |
          set -euo pipefail
          bun script/qa/computer/conformance/drivers/legacy.ts --smoke | tee "${RUNNER_TEMP}/computer-baseline/smoke.log"

      # The control for the Windows "delivered but the application never received it" cells: the release's background
      # typing and key chord, then independent SendInput to the same control, with the focus logged before each step.
      - name: Control, release input then independent SendInput to the same control
        shell: bash
        run: |
          set +e -uo pipefail
          bun script/qa/computer/conformance/drivers/legacy.ts --control | tee "${RUNNER_TEMP}/computer-baseline/control.log"
          echo "control EXIT ${PIPESTATUS[0]}"

      - name: Catalog and task set on the shipped runtime
        shell: bash
        run: |
          set +e -uo pipefail
          qa="${RUNNER_TEMP}/computer-baseline"
          bun script/qa/computer/conformance/run.ts --os windows --all --driver legacy --out "$qa/catalog" | tee "$qa/catalog.log"
          catalog=${PIPESTATUS[0]}
          bun script/qa/computer/conformance/run.ts --os windows --taskset --driver legacy --out "$qa/taskset" | tee "$qa/taskset.log"
          taskset=${PIPESTATUS[0]}
          echo "catalog EXIT ${catalog} taskset EXIT ${taskset}"
          test "$catalog" -eq 0 && test "$taskset" -eq 0

      - name: Teardown receipts
        if: always()
        shell: powershell
        run: |
          $left = 0
          Get-Process -Name conformance-fixture, electron -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          foreach ($name in @("senpi-desktop-engine*", "conformance-fixture", "electron")) {
            $procs = Get-Process -Name $name -ErrorAction SilentlyContinue
            if ($procs) { "$name LEFT $($procs.Id -join ' ')"; $left = 1 } else { "$name procs 0" }
          }
          exit $left

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: computer-baseline-legacy-windows
          path: ${{ runner.temp }}/computer-baseline
          if-no-files-found: warn

      - name: Write job summary
        if: always()
        shell: bash
        env:
          JOB_SUMMARY_TITLE: Computer baseline, shipped runtime (windows)
          JOB_SUMMARY_STATUS: ${{ job.status }}
          JOB_SUMMARY_DETAILS: |
            - Installs the released omo-ai and takes its default computer settings from the release tag's own resolver.
            - Builds and drives the Windows native and Electron fixture apps; a cell without its fixture or observer is recorded not_run.
            - Smoke: the release's computer tool reaches its own engine with no model and no credential.
            - Runs the conformance catalog and the task set through run.ts --driver legacy in the interactive session.
            - Teardown: no engine, fixture or Electron process is left.
          JOB_SUMMARY_NEXT: Open the computer-baseline-legacy-windows artifact for run.json, environment.json and the logs.
        run: GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" bash .github/scripts/write-job-summary.sh
