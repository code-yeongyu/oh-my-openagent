name: LazyCodex Bug Report
description: Report a LazyCodex, lazycodex-ai, or Codex Light issue
title: "[LazyCodex Bug]: "
labels: ["bug", "needs-triage", "lazycodex"]
body:
  - type: markdown
    attributes:
      value: |
        **If you hit this in the omo app, run `/bug` inside a session instead.** It lists what it includes and lets you see the exact report before you send it, then sends the redacted engine log, environment, config with secrets blanked and session transcript, plus identity lines - device name and, when telemetry is on, an install id and a session hash, and your account details (email, name, account, user and device ids, plan, device name) from the desktop app - so we can reply. This form stays open for LazyCodex and for anyone who cannot use the in-app report.

  - type: markdown
    attributes:
      value: |
        Please file source-level LazyCodex work in [oh-my-openagent](https://github.com/code-yeongyu/oh-my-openagent), where `packages/omo-codex` lives.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: Describe the LazyCodex failure.
      placeholder: Describe what failed and when it happens.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Include exact commands or UI actions.
      placeholder: |
        1. Install with npx lazycodex-ai install
        2. Run ...
        3. See ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What happened instead?
    validations:
      required: true

  - type: input
    id: lazycodex-version
    attributes:
      label: LazyCodex version
      placeholder: "lazycodex-ai 4.7.5"
    validations:
      required: true

  - type: input
    id: codex-version
    attributes:
      label: Codex version
      placeholder: "codex 0.0.0"
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Relevant config
      description: Paste relevant Codex or LazyCodex config with secrets removed.
      render: toml

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Paste relevant terminal output or logs.
      render: shell
